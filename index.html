    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();

      // Tentativa de consulta Supabase
      if (db) {
        try {
          const { data, error } = await db.from('users').select('*').eq('email', email).single();
          if (data && data.password_hash === pass) {
            loginUserSuccess(data);
            return;
          }
        } catch(err) {
          console.warn('[Supabase] Consulta falhou, acionando fallback.');
        }
      }

      // Autenticação local de contingência
      if (email === 'admin@kognus.com' && pass === 'admin123') {
        loginUserSuccess({ id: 'adm_1', name: 'Administrador Kognus', email, role: 'admin' });
      } else if (email === 'instrutor@kognus.com' && pass === '123456') {
        loginUserSuccess({ id: 'inst_1', name: 'Prof. Renato Mestre', email, role: 'instrutor' });
      } else if (email === 'aluno@kognus.com' && pass === '123456') {
        loginUserSuccess({ id: 'alu_1', name: 'Lucas Mendes', email, role: 'aluno', must_change_password: false });
      } else if (pass.startsWith('TMP-')) {
        loginUserSuccess({ id: 'alu_tmp', name: 'Aluno Recente', email, role: 'aluno', must_change_password: true });
      } else {
        showToast('Credenciais incorretas! Tente as contas de teste rápidas.', 'error');
      }
    }

    function loginUserSuccess(user) {
      if (user) {
        user.id = ensureUUID(user.id);
      }
      currentUser = user;
      localStorage.setItem('kognus_session', JSON.stringify(user));
      renderHeader();
      showToast(`Bem-vindo, ${user.name}!`, 'success');

      // REDIRECIONAMENTO OBRIGATÓRIO POR PERFIL
      if (user.must_change_password) {
        navigateTo('first-login');
      } else if (user.role === 'admin') {
        navigateTo('dashboard-admin');
      } else if (user.role === 'instrutor') {
        navigateTo('dashboard-instrutor');
      } else {
        navigateTo('dashboard-aluno');
      }
    }

    async function handleCheckoutSimulate(e, courseId) {
      if (e && e.preventDefault) e.preventDefault();
      const name = document.getElementById('chk-name').value;
      const email = document.getElementById('chk-email').value;
      const tempPass = 'TMP-' + Math.floor(100000 + Math.random() * 900000);

      const cleanEmail = email.toLowerCase().trim();
      const cid = courseId || 1;

      if (!state.enrollments.some(en => en.studentEmail && en.studentEmail.toLowerCase().trim() === cleanEmail && (en.courseId == cid || String(en.courseId) === String(cid)))) {
        state.enrollments.push({ studentEmail: cleanEmail, courseId: cid });
      }

      try {
        localStorage.setItem('kognus_enrollments', JSON.stringify(state.enrollments));
      } catch(err) {}

      // Persistência real e assíncrona no Supabase
      if (db) {
        try {
          let studentId = generateUUID();
          const qU = db.from('users');
          if (qU && typeof qU.upsert === 'function') {
            const { data: uData, error: uErr } = await qU.upsert({
            id: studentId,
            name: name || 'Aluno',
            email: cleanEmail,
            role: 'aluno',
            school_name: '',
            status: 'ativo',
            password_hash: 'kognus123',
            must_change_password: true,
            created_at: new Date().toISOString()
          }, { onConflict: 'email' }).select();

          if (!uErr && uData && uData[0] && uData[0].id) {
            studentId = uData[0].id;
          } else if (uErr) {
            console.error('[Supabase Student User Error]', uErr);
          }

          }

          const courseUuid = ensureUUID(cid, '00000000-0000-0000-0000-');
          const enrollUuid = generateUUID();
          const qE = db.from('enrollments');
          if (qE && typeof qE.upsert === 'function') {
            const { data: enrData, error: enrErr } = await qE.upsert({
              id: enrollUuid,
              student_id: studentId,
              course_id: courseUuid,
              progress_percentage: 0,
              completed_lessons: [],
              enrolled_at: new Date().toISOString()
            }).select();

            if (enrErr) {
              console.error('[Supabase Enrollment Error]', enrErr);
            } else {
              console.log('[Supabase Enrollment Success]', enrData);
            }
          }
        } catch(err) {
          console.error('[Supabase Checkout Simulate Exception]', err);
        }
      }

      showToast('Matrícula confirmada pelo Gateway!', 'success');
      navigateTo('purchase-success', { tempPass: tempPass });
    }

    function handlePasswordChange(e) {
      e.preventDefault();
      const n = document.getElementById('new-pass').value;
      const c = document.getElementById('confirm-pass').value;
      if (n !== c) {
        showToast('As senhas não coincidem!', 'error');
        return;
      }
      if (n.length < 6) {
        showToast('A senha deve ter no mínimo 6 caracteres!', 'error');
        return;
      }
      if (currentUser) {
        currentUser.must_change_password = false;
        localStorage.setItem('kognus_session', JSON.stringify(currentUser));
      }
      showToast('Senha alterada com sucesso! Acesso liberado ao seu painel.', 'success');
      navigateTo('dashboard-aluno');
    }

    async function handleInstructorRegister(e) {
      if (e && e.preventDefault) e.preventDefault();
      const nameInput = document.getElementById('inst-name');
      const schoolInput = document.getElementById('inst-school');
      const emailInput = document.getElementById('inst-email');
      const passInput = document.getElementById('inst-pass');

      const name = nameInput ? nameInput.value.trim() : 'Novo Instrutor';
      const school = schoolInput ? schoolInput.value.trim() : 'Minha Escola';
      const email = emailInput ? emailInput.value.trim().toLowerCase() : 'instrutor@kognus.com';
      const password = passInput && passInput.value ? passInput.value : 'kognus123';
      const userId = generateUUID();

      const user = {
        id: userId,
        name,
        school,
        school_name: school,
        email,
        role: 'instrutor',
        status: 'pendente'
      };
      
      const newRecord = {
        id: user.id,
        name,
        email,
        school,
        coursesCount: 0,
        status: 'pendente',
        mrr: 89.90,
        createdAt: new Date().toLocaleDateString('pt-BR')
      };
      const existingIdx = state.instructors.findIndex(i => i.email && i.email.toLowerCase().trim() === email);
      if (existingIdx >= 0) {
        state.instructors[existingIdx] = newRecord;
      } else {
        state.instructors.unshift(newRecord);
      }

      try {
        localStorage.setItem('kognus_instructors', JSON.stringify(state.instructors));
      } catch(err) {}

      // Visual de loading no botão submit
      let submitBtn = null;
      let origBtnHtml = '';
      if (e && e.target) {
        submitBtn = e.target.querySelector('button[type="submit"]') || e.target;
        if (submitBtn && submitBtn.tagName === 'BUTTON') {

    // 2. SINCRONIZAÇÃO ASSÍNCRONA E TEMPO REAL (REALTIME LOCKDOWN)
    let instructorRealtimeChannel = null;
    let instructorStatusPollInterval = null;

    function setupInstructorRealtimeListener() {
      if (!currentUser || currentUser.role !== 'instrutor') return;
      const userEmail = currentUser.email;

      // Limpa listeners prévios para evitar duplicação
      if (instructorRealtimeChannel && db) {
        try {
          db.removeChannel(instructorRealtimeChannel);
        } catch(e) {}
        instructorRealtimeChannel = null;
      }
      if (instructorStatusPollInterval) {
        clearInterval(instructorStatusPollInterval);
        instructorStatusPollInterval = null;
      }

      // 1. Escuta Supabase Realtime (se cliente disponível)
      if (db && typeof db.channel === 'function') {
        try {
          instructorRealtimeChannel = db.channel(`user-status-${userEmail}`)
            .on('postgres_changes', {
              event: '*',
              schema: 'public',
              table: 'users',
              filter: `email=eq.${userEmail}`
            }, (payload) => {
              console.log('[Supabase Realtime] Evento na tabela users:', payload);
              const newStatus = payload.new?.status;
              if (newStatus && newStatus !== currentUser.status) {
                handleRealtimeStatusTransition(newStatus);
              }
            })
            .subscribe();
        } catch(err) {
          console.warn('[Supabase Realtime Warning]:', err);
        }
      }

      // 2. Fallback de Polling contínuo a cada 3 segundos
      instructorStatusPollInterval = setInterval(async () => {
        if (!currentUser || currentUser.role !== 'instrutor') {
          clearInterval(instructorStatusPollInterval);
          return;
        }

        // Checa Supabase se disponível
        if (db) {
          try {
            const { data } = await db.from('users').select('status').eq('email', userEmail).single();
            if (data && data.status && data.status !== currentUser.status) {
              handleRealtimeStatusTransition(data.status);
              return;
            }
          } catch(e) {}
        }

        // Checa LocalStorage / Estado
        const storedStatus = localStorage.getItem('kognus_status_' + userEmail);
        if (storedStatus && storedStatus !== currentUser.status) {
          handleRealtimeStatusTransition(storedStatus);
          return;
        }
        const inst = state.instructors.find(i => i.email === userEmail);
        if (inst && inst.status !== currentUser.status) {
          handleRealtimeStatusTransition(inst.status);
        }
      }, 3000);
    }

    // 3. Listener Cross-Tab nativo (0ms entre abas SuperAdmin e Instrutor)
    if (typeof window !== 'undefined') {
      window.addEventListener('storage', (e) => {
        if (!currentUser || currentUser.role !== 'instrutor') return;
        if (e.key === 'kognus_status_' + currentUser.email || e.key === 'kognus_realtime_event') {
          let targetStatus = null;
          if (e.key === 'kognus_status_' + currentUser.email) {
            targetStatus = e.newValue;
          } else if (e.key === 'kognus_realtime_event' && e.newValue) {
            try {
              const parsed = JSON.parse(e.newValue);
              if (parsed.email === currentUser.email) {
                targetStatus = parsed.status;
              }
            } catch(err) {}
          }
          if (targetStatus && targetStatus !== currentUser.status) {
            handleRealtimeStatusTransition(targetStatus);
          }
        }
      });
    }

    function handleRealtimeStatusTransition(newStatus) {
      if (!currentUser) return;
      const oldStatus = currentUser.status;
      currentUser.status = newStatus;
      localStorage.setItem('kognus_session', JSON.stringify(currentUser));
      localStorage.setItem('kognus_status_' + currentUser.email, newStatus);
      const inst = state.instructors.find(i => i.email === currentUser.email);
      if (inst) inst.status = newStatus;

      console.log(`[Realtime Lockdown] Transição para ${currentUser.email}: ${oldStatus} -> ${newStatus}`);

      // Sincroniza a Máquina de Estados do Modal de Pagamento se estiver visível
      const modal = document.getElementById('stripe-radar-modal');
      if (modal) {
        if (newStatus === 'ativo') {
          setPaymentModalState('SUCCESS');
        } else if (newStatus === 'recusado') {
          setPaymentModalState('FAILED');
        } else if (newStatus === 'pendente') {
          setPaymentModalState('WAITING');
        }
      }

      if (newStatus === 'inadimplente') {
        showToast('⚠️ ATENÇÃO: Sua assinatura foi suspensa por inadimplência. Regularize para reativar sua escola.', 'error');
      } else if (newStatus === 'ativo') {
        showToast('🎉 Pagamento aprovado! Sua escola foi liberada.', 'success');
      } else if (newStatus === 'recusado') {
        showToast('❌ Pagamento recusado pela operadora.', 'error');
      }

      // Destrava ou Trava instantaneamente na tela sem F5
      if (currentView === 'dashboard-instrutor' || currentView === 'creator') {
        navigateTo('dashboard-instrutor');
      }
    }

    function setPaymentModalState(newState) {
      paymentModalState = newState;
      window.paymentModalState = newState;
      const modal = document.getElementById('stripe-radar-modal') || document.getElementById('student-radar-modal');
      if (!modal) return;

      const loadingState = document.getElementById('radar-loading-state');
      const successState = document.getElementById('radar-success-state');
      const failedState = document.getElementById('radar-failed-state');

      // Limpa timer anterior se houver
      if (window.failedCountdownTimer) {
        clearInterval(window.failedCountdownTimer);
        window.failedCountdownTimer = null;
      }

      if (newState === 'WAITING') {
        if (loadingState) loadingState.classList.remove('hidden');
        if (successState) successState.classList.add('hidden');
        if (failedState) failedState.classList.add('hidden');

        failedCountdownSeconds = 10;
        updateCountdownUI(failedCountdownSeconds);
      } else if (newState === 'FAILED') {
        if (loadingState) loadingState.classList.add('hidden');
        if (successState) successState.classList.add('hidden');
        if (failedState) failedState.classList.remove('hidden');

        failedCountdownSeconds = 10;
        updateCountdownUI(failedCountdownSeconds);

        window.failedCountdownTimer = setInterval(() => {
          failedCountdownSeconds--;
          updateCountdownUI(failedCountdownSeconds);

          if (failedCountdownSeconds <= 0) {
            clearInterval(window.failedCountdownTimer);
            window.failedCountdownTimer = null;
            retryStripePayment();
          }
        }, 1000);
      } else if (newState === 'SUCCESS') {
        if (loadingState) loadingState.classList.add('hidden');
        if (successState) successState.classList.remove('hidden');
        if (failedState) failedState.classList.add('hidden');

        // Atualiza status da transação no card
        const statusLabel = document.getElementById('radar-transaction-status');
        if (statusLabel) {
          statusLabel.className = 'text-emerald-400 font-semibold flex items-center gap-1.5';
          statusLabel.innerHTML = '<i data-lucide="check-circle" class="w-3.5 h-3.5"></i> ✅ Pagamento Confirmado e Aprovado!';
        }

        const isStudent = currentRadarRole === 'student';
        if (isStudent) {
          // Desbloqueio e matrícula de aluno
          if (!currentUser) {
            currentUser = {
              id: 'aluno_' + Math.random().toString(36).substring(2, 7),
              name: 'Aluno',
              email: currentRadarTargetEmail || 'aluno@kognus.com',
              role: 'aluno'
            };
            try {
              localStorage.setItem('kognus_session', JSON.stringify(currentUser));
            } catch(e) {}
            renderHeader();
          }
        } else {
          // Desbloqueio imediato do instrutor
          if (currentUser) {
            currentUser.status = 'ativo';
            localStorage.setItem('kognus_session', JSON.stringify(currentUser));
            localStorage.setItem('kognus_status_' + currentUser.email, 'ativo');
          }
          const inst = state.instructors.find(i => i.email === (currentUser ? currentUser.email : 'instrutor@kognus.com'));
          if (inst) inst.status = 'ativo';
        }

        // Efeito de confetes / celebração visual
        launchSuccessCelebration();
      }

      if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
    }

    function startStripePolling(email) {
      if (stripePollingInterval) clearInterval(stripePollingInterval);

      }, 2000);

    async function checkActivationStatus(isManual = false, emailToCheck = null, role = null, courseId = null) {
      const email = emailToCheck || currentRadarTargetEmail || (currentUser ? currentUser.email : null);
      const activeRole = role || currentRadarRole || 'instructor';
      const cid = courseId || currentRadarCourseId || (state.courses[0] ? state.courses[0].id : 1);

      if (!email) return;

      if (activeRole === 'student') {
        const cleanEmail = email.toLowerCase().trim();
        let isEnrolled = state.enrollments.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === String(cid));

        if (!isEnrolled && db) {
          try {
            const { data, error } = await db.from('enrollments')
              .select('*')
              .eq('student_email', cleanEmail)
              .eq('course_id', String(cid))
              .maybeSingle();

            if (!error && data && (data.status === 'active' || !data.status)) {
              isEnrolled = true;
            }
          } catch(e) {
            console.warn('[CheckActivation Supabase]:', e);
          }
        }

        if (!isEnrolled) {
          try {
            const localStored = JSON.parse(localStorage.getItem('kognus_enrollments') || '[]');
            if (localStored.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === String(cid))) {
              isEnrolled = true;
            }
          } catch(e) {}
        }

        if (isEnrolled) {
          onStudentPaymentSuccess({ student_email: cleanEmail, course_id: cid });
        } else if (isManual) {
          showToast('Ainda processando transação no Stripe, aguarde mais alguns segundos...', 'info');
        }
        return;
      }

      // Fluxo do Instrutor:
      let currentFoundStatus = null;

      // 1. Consulta no Supabase se cliente estiver disponível
      if (db) {
        try {
          const { data, error } = await db.from('users').select('status, subscription_status').eq('email', email).single();
          if (!error && data && data.status) {
            currentFoundStatus = data.status;
          }
        } catch (e) {
          console.warn('[Polling Supabase]', e);
        }
      }

      // 2. Consulta no LocalStorage / State fallback
      const storedStatus = localStorage.getItem('kognus_status_' + email);
      if (storedStatus) {
        currentFoundStatus = storedStatus;
      }
      const inst = state.instructors.find(i => i.email === email);
      if (inst && inst.status) {
        if (!currentFoundStatus || currentFoundStatus === 'pendente') {
          currentFoundStatus = inst.status;
        }
      }

      console.log(`[Stripe Polling] Status para ${email}: ${currentFoundStatus}`);

      if (currentFoundStatus === 'ativo') {
        if (stripePollingInterval) {
          clearInterval(stripePollingInterval);
          stripePollingInterval = null;
        }
        setPaymentModalState('SUCCESS');
        showToast('🎉 Pagamento aprovado! Sua escola foi liberada.', 'success');
      } else if (currentFoundStatus === 'recusado') {
        if (stripePollingInterval) {
          clearInterval(stripePollingInterval);
          stripePollingInterval = null;
        }
        if (currentUser && currentUser.email === email) {
          currentUser.status = 'recusado';
          localStorage.setItem('kognus_session', JSON.stringify(currentUser));
        }
        if (inst) inst.status = 'recusado';
        setPaymentModalState('FAILED');
        showToast('❌ Pagamento recusado pela operadora.', 'error');
      } else {
        if (isManual) {
          showToast('Ainda processando transação no Stripe, aguarde mais alguns segundos...', 'info');
        }
      }
    }

    function handleCertSchoolLogoUpload(input) {
      if (!input || !input.files || !input.files[0]) return;
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        window.currentCertSchoolLogo = e.target.result;
        const prev = document.getElementById('cert-logo-preview');
        if (prev) prev.src = window.currentCertSchoolLogo;
      };
      reader.readAsDataURL(file);
    }

    function handleCertSignatureUpload(input) {
      if (!input || !input.files || !input.files[0]) return;
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        window.currentCertSignature = e.target.result;

        }
      };
      reader.readAsDataURL(file);

    async function handleSaveCertificateStudio(e, courseId) {
      if (e && e.preventDefault) e.preventDefault();
      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId);
      if (!course) return;

      const enabled = document.getElementById('cert-enabled')?.checked ?? true;
      const template = window.currentCertificateStudioTemplate || 'classic';
      const minCompletionPercentage = Number(document.getElementById('cert-min-percentage')?.value || 100);
      const workloadHours = Number(document.getElementById('cert-workload-hours')?.value || 40);
      const instructorTitle = document.getElementById('cert-instructor-title')?.value || 'Instrutor Titular & Diretor Técnico';
      const showSchoolName = document.getElementById('cert-show-school')?.checked ?? true;
      const schoolLogo = window.currentCertSchoolLogo || (course.certificateConfig?.schoolLogo || null);
      const signatureImage = window.currentCertSignature || (course.certificateConfig?.signatureImage || null);

      course.certificateConfig = {
        enabled,
        template,
        minCompletionPercentage,
        workloadHours,
        instructorTitle,
        showSchoolName,
        schoolLogo,
        signatureImage
      };

      try {
        localStorage.setItem('kognus_custom_courses', JSON.stringify(state.courses));
      } catch(err) {}

      // Atualização persistente de certificado no Supabase
      if (db && course) {
        try {
          const courseUuid = ensureUUID(course.rawId || course.id, '00000000-0000-0000-0000-');
          const { error: certErr } = await db.from('courses').update({
            certificate_config: course.certificateConfig,
            certificate_enabled: course.certificateConfig.enabled,
            certificate_hours: course.certificateConfig.workloadHours || 40
          }).eq('id', courseUuid);
          if (certErr) console.warn('[Supabase Certificate Save Error]', certErr);
        } catch(err) {
          console.warn('[Supabase Certificate Save Exception]', err);
        }
      }

      closeCertificateStudioModal();
      showToast(`Certificado do curso "${course.title}" configurado com sucesso!`, 'success');
      navigateTo('dashboard-instrutor');
    }

    // Helper de tempo relativo
    function formatRelativeTime(dateStr) {
      if (!dateStr) return 'agora pouco';
      const now = Date.now();
      const past = new Date(dateStr).getTime();
      const diffSec = Math.floor((now - past) / 1000);
      if (diffSec < 60) return 'agora pouco';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `há ${diffMin} min`;
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return `há ${diffHour} ${diffHour === 1 ? 'hora' : 'horas'}`;
      const diffDays = Math.floor(diffHour / 24);
      if (diffDays < 30) return `há ${diffDays} ${diffDays === 1 ? 'dia' : 'dias'}`;
      return new Date(dateStr).toLocaleDateString('pt-BR');
    }

    // Salvar Novo Módulo no Supabase e Atualizar Árvore Dinamicamente
    async function handleSaveNewModule(courseId) {
      const titleInput = document.getElementById('cb-new-mod-title');
      const delayInput = document.getElementById('cb-new-mod-delay');
      if (!titleInput) return;

      const moduleTitle = titleInput.value.trim();
      if (!moduleTitle) {
        showToast('Por favor, informe o título do módulo.', 'warning');
        return;
      }
      const releaseDays = delayInput ? (parseInt(delayInput.value, 10) || 0) : 0;

      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId);
      if (!course) return;

      const moduleId = generateUUID();
      const courseUuid = ensureUUID(course.rawId || course.id, '00000000-0000-0000-0000-');
      const moduleIndex = (course.modules || []).length;

      // 1. Inserção verificada no Supabase (course_modules)
      if (db) {
        try {
          const qM = db.from('course_modules');
          if (qM && typeof qM.insert === 'function') {
            const payload = {
              id: moduleId,
              course_id: courseUuid,
              title: moduleTitle,
              order_index: moduleIndex,
              release_delay_days: releaseDays || 0
            };
            let { error: mErr } = await qM.insert(payload);
            if (mErr && (mErr.code === '42703' || String(mErr.message || '').includes('release_delay_days'))) {
              delete payload.release_delay_days;
              await qM.insert(payload);
            }
          }
        } catch(err) {
          console.warn('[Curriculum Builder] Module insert warning:', err);
        }
      }

      // 2. Atualização reativa de estado local
      if (!course.modules) course.modules = [];
      const newMod = {
        id: moduleId,
        rawId: moduleId,
        title: moduleTitle,
        release_delay_days: releaseDays,
        lessons: []
      };
      course.modules.push(newMod);
      curriculumOpenModules[moduleId] = true;
      isAddingModule = false;

      try {
        localStorage.setItem('kognus_custom_courses', JSON.stringify(state.courses));
      } catch(e) {}

      const container = document.getElementById('curriculum-builder-content');
      if (container) {
        container.innerHTML = renderCurriculumBuilderContent(course.id);
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      }
      showToast('Módulo adicionado à grade curricular com sucesso!', 'success');
    }
    window.handleSaveNewModule = handleSaveNewModule;

    // Renomear Módulo
    async function promptRenameModule(courseId, moduleId) {
      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId);
      if (!course) return;
      const targetMod = (course.modules || []).find(m => m.id == moduleId || String(m.id) === String(moduleId) || m.rawId === moduleId);
      if (!targetMod) return;

      const newTitle = prompt('Digite o novo título do módulo:', targetMod.title);
      if (!newTitle || !newTitle.trim() || newTitle.trim() === targetMod.title) return;

      targetMod.title = newTitle.trim();

      if (db) {
        try {
          const modUuid = ensureUUID(targetMod.rawId || targetMod.id, '00000000-0000-0001-');
          const qM = db.from('course_modules');
          if (qM && typeof qM.update === 'function') {
            await qM.update({ title: targetMod.title }).eq('id', modUuid);
          }
        } catch(err) {
          console.warn('[Curriculum Builder] Module rename warning:', err);
        }
      }

      try {
        localStorage.setItem('kognus_custom_courses', JSON.stringify(state.courses));
      } catch(e) {}

      const container = document.getElementById('curriculum-builder-content');
      if (container) {
        container.innerHTML = renderCurriculumBuilderContent(course.id);
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      }
      showToast('Título do módulo atualizado!', 'success');
    }
    window.promptRenameModule = promptRenameModule;

    // Excluir Módulo
    async function handleDeleteModule(courseId, moduleId) {
      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId);
      if (!course) return;
      const targetMod = (course.modules || []).find(m => m.id == moduleId || String(m.id) === String(moduleId) || m.rawId === moduleId);
      if (!targetMod) return;

      if (!confirm(`Tem certeza que deseja excluir o módulo "${targetMod.title}" e todas as suas aulas? Esta ação é irreversível.`)) return;

      if (db) {
        try {
          const modUuid = ensureUUID(targetMod.rawId || targetMod.id, '00000000-0000-0001-');
          const qL = db.from('course_lessons');
          if (qL && typeof qL.delete === 'function') {
            await qL.delete().eq('module_id', modUuid);
          }
          const qM = db.from('course_modules');
          if (qM && typeof qM.delete === 'function') {
            await qM.delete().eq('id', modUuid);
          }
        } catch(err) {
          console.warn('[Curriculum Builder] Module delete warning:', err);
        }
      }

      course.modules = course.modules.filter(m => m.id != moduleId && String(m.id) !== String(moduleId) && m.rawId !== moduleId);

      try {
        localStorage.setItem('kognus_custom_courses', JSON.stringify(state.courses));
      } catch(e) {}

      const container = document.getElementById('curriculum-builder-content');
      if (container) {
        container.innerHTML = renderCurriculumBuilderContent(course.id);
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      }
      showToast('Módulo excluído com sucesso!', 'success');
    }
    window.handleDeleteModule = handleDeleteModule;

        try {

      window.__curriculumLessonModal = {

        <div class="bg-darkCard border border-brand-500/40 rounded-3xl max-w-2xl w-full p-6 sm:p-8 space-y-5 shadow-2xl relative my-8 text-left max-h-[92vh] flex flex-col">

            <span class="text-[10px] font-mono font-bold bg-brand-500/20 text-brand-300 px-2 py-0.5 rounded uppercase">${isEdit ? 'EDITAR CONTEÚDO' : 'NOVO CONTEÚDO NA GRADE'}</span>

              <i data-lucide="video" class="w-4 h-4"></i> Vídeo Aula

            <button type="button" onclick="setLessonModalContentType('quiz')" id="btn-lmt-quiz" class="flex-1 py-2.5 px-3 rounded-xl ${isQuiz ? 'bg-purple-600 text-white font-bold shadow-lg shadow-purple-600/30' : 'bg-zinc-900 hover:bg-zinc-800 text-zinc-400 font-semibold border border-darkBorder'} text-xs flex items-center justify-center gap-2 transition">

        return `
          <div class="p-4 sm:p-5 bg-zinc-950/90 border border-purple-500/30 rounded-2xl space-y-3.5 relative">
            <div class="flex justify-between items-center border-b border-darkBorder/60 pb-2.5">

            <div>
              <label class="block text-[11px] font-bold text-zinc-300 mb-1">Enunciado da Questão *</label>
              <textarea rows="2" placeholder="Digite aqui o enunciado claro da questão..." oninput="updateQuizQuestionStatement(${qIdx}, this.value)" class="w-full bg-zinc-900 border border-darkBorder rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-purple-500 resize-none">${q.question || ''}</textarea>
            </div>

            <div class="space-y-2 pt-1">
              <label class="text-[11px] font-bold text-zinc-300 flex items-center gap-1">
                Alternativas <span class="text-[10px] text-zinc-500 font-normal">(marque no botão circular qual é o gabarito correto)</span>
              </label>

              ${(q.options || ['', '', '', '']).map((opt, optIdx) => {
                const isCorrect = q.correctIndex === optIdx;
                return `
                  <div class="flex items-center gap-2.5 p-2 rounded-xl border ${isCorrect ? 'border-emerald-500/50 bg-emerald-950/20' : 'border-darkBorder/70 bg-zinc-900/60'} transition">
                    <label class="flex items-center justify-center cursor-pointer p-1" title="Definir como alternativa correta">
                      <input type="radio" name="modal_q_correct_${qIdx}" value="${optIdx}" ${isCorrect ? 'checked' : ''} onchange="setQuizCorrectIndex(${qIdx}, ${optIdx})" class="w-4 h-4 text-emerald-500 border-zinc-600 focus:ring-emerald-500 cursor-pointer accent-emerald-500">
                    </label>
                    <span class="w-5 text-[11px] font-mono font-bold text-zinc-400 text-center shrink-0">${letters[optIdx] || optIdx + 1}</span>
                    <input type="text" placeholder="Texto da alternativa ${letters[optIdx] || optIdx + 1}..." value="${opt || ''}" oninput="updateQuizOptionText(${qIdx}, ${optIdx}, this.value)" class="flex-1 bg-transparent border-0 text-xs text-white placeholder-zinc-500 focus:outline-none focus:ring-0">
                    ${isCorrect ? `
                      <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1 shrink-0 px-2 py-0.5 bg-emerald-500/10 rounded-full border border-emerald-500/20">
                        <i data-lucide="check" class="w-3 h-3"></i> Gabarito
                      </span>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');

      if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
    }
    window.renderModalQuizQuestionsDom = renderModalQuizQuestionsDom;

    // Salvar Aula ou Avaliação no Módulo (Supabase + LocalState)
    async function handleSaveLessonToModule(e, courseId, moduleId, existingLessonId = null) {
      if (e && e.preventDefault) e.preventDefault();

      const modalState = window.__curriculumLessonModal || {};
      const isQuiz = modalState.type === 'quiz';
      const isEdit = Boolean(existingLessonId);

      const titleInput = document.getElementById('alm-title');
      const durationInput = document.getElementById('alm-duration');
      const videoUrlInput = document.getElementById('alm-video-url');
      const pdfNameInput = document.getElementById('alm-pdf-name');

      const lessonTitle = titleInput ? titleInput.value.trim() : '';
      if (!lessonTitle) {
        showToast(isQuiz ? 'Informe o título da avaliação.' : 'Informe o título da aula.', 'warning');
        return;
      }
      const lessonDuration = durationInput ? (durationInput.value.trim() || '15 min') : '15 min';

      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId);
      if (!course) return;
      const targetMod = (course.modules || []).find(m => m.id == moduleId || String(m.id) === String(moduleId) || m.rawId === moduleId);
      if (!targetMod) return;

      let cleanedQuizData = null;
      if (isQuiz) {
        const rawQuestions = modalState.questions || [];
        if (rawQuestions.length === 0) {
          showToast('Adicione pelo menos 1 pergunta para a avaliação.', 'warning');
          return;
        }

        cleanedQuizData = [];
        for (let i = 0; i < rawQuestions.length; i++) {
          const q = rawQuestions[i];
          const statement = (q.question || '').trim();
          if (!statement) {
            showToast(`Preencha o enunciado da Questão ${i + 1}.`, 'warning');
            return;
          }
          const validOpts = (q.options || []).map(o => (o || '').trim()).filter(Boolean);
          if (validOpts.length < 2) {
            showToast(`Preencha pelo menos 2 alternativas válidas na Questão ${i + 1}.`, 'warning');
            return;
          }
          let corrIdx = Number(q.correctIndex) || 0;
          if (corrIdx < 0 || corrIdx >= validOpts.length) {
            corrIdx = 0;
          }
          cleanedQuizData.push({
            question: statement,
            options: validOpts,
            correctIndex: corrIdx
          });
        }
      }

      const lessonId = isEdit ? existingLessonId : generateUUID();
      const courseUuid = ensureUUID(course.rawId || course.id, '00000000-0000-0000-0000-');
      const modUuid = ensureUUID(targetMod.rawId || targetMod.id, '00000000-0000-0001-');
      const lessonUuid = ensureUUID(lessonId, '00000000-0000-0000-0002-');
      const lessonIndex = isEdit ? 0 : (targetMod.lessons || []).length;

      let finalVideoUrl = null;
      let finalVideoType = currentCurriculumLessonVideoType;
      let ytId = 'dQw4w9WgXcQ';
      let finalPdf = null;

      if (!isQuiz) {
        const rawVideoUrl = videoUrlInput ? videoUrlInput.value.trim() : '';
        if (currentCurriculumLessonVideoType === 'upload' && currentCurriculumUploadedVideoUrl) {
          finalVideoUrl = currentCurriculumUploadedVideoUrl;
        } else if (rawVideoUrl) {
          finalVideoUrl = rawVideoUrl;
          if (rawVideoUrl.includes('v=')) {
            ytId = rawVideoUrl.split('v=')[1].split('&')[0];
          } else if (rawVideoUrl.includes('youtu.be/')) {
            ytId = rawVideoUrl.split('youtu.be/')[1].split('?')[0];
          }
        } else {
          finalVideoUrl = `https://www.youtube-nocookie.com/embed/${ytId}`;
        }

        finalPdf = (pdfNameInput && pdfNameInput.value.trim()) 
          ? pdfNameInput.value.trim() 
          : (currentCurriculumUploadedPdfName || null);
      }

      // 1. Inserção / Atualização no Supabase (course_lessons)
      if (db) {
        try {
          const qL = db.from('course_lessons');
          if (qL) {
            const lessonPayload = {
              id: lessonUuid,
              module_id: modUuid,
              course_id: courseUuid,
              title: lessonTitle,
              duration: lessonDuration,
              order_index: lessonIndex
            };

            if (isQuiz) {
              lessonPayload.type = 'quiz';
              lessonPayload.content_type = 'quiz';
              lessonPayload.quiz_data = cleanedQuizData;
              lessonPayload.min_grade = Number(document.getElementById('alm-quiz-min-grade')?.value || 100);
            } else {
              lessonPayload.type = 'video';
              lessonPayload.content_type = 'video';
              lessonPayload.video_url = finalVideoUrl || null;
              lessonPayload.pdf_url = finalPdf || null;
            }

            let { error: lErr } = await qL.upsert(lessonPayload);
            if (lErr) {
              console.warn('[Curriculum Builder] Lesson upsert warning, retrying with basic fields:', lErr);
              delete lessonPayload.type;
              delete lessonPayload.content_type;
              delete lessonPayload.quiz_data;
              await qL.upsert(lessonPayload);
            }
          }

          // Gravação complementar na tabela lesson_quizzes caso exista
          if (isQuiz) {
            try {
              const qLq = db.from('lesson_quizzes');
              if (qLq && typeof qLq.upsert === 'function') {
                await qLq.upsert({
                  lesson_id: lessonUuid,
                  quiz_data: cleanedQuizData,
                  min_grade: Number(document.getElementById('alm-quiz-min-grade')?.value || 100)
                }, { onConflict: 'lesson_id' });
              }
            } catch(eQ) {}
          }
        } catch(err) {
          console.warn('[Curriculum Builder] Lesson save warning:', err);
        }
      }

      // 2. Atualização reativa de estado local
      if (!targetMod.lessons) targetMod.lessons = [];

      if (isEdit) {
        const existingTarget = targetMod.lessons.find(l => l.id == lessonId || String(l.id) === String(lessonId) || l.rawId === lessonId);
        if (existingTarget) {
          existingTarget.title = lessonTitle;
          existingTarget.duration = lessonDuration;
          existingTarget.type = isQuiz ? 'quiz' : 'video';
          if (isQuiz) {
            existingTarget.quiz_data = cleanedQuizData;
            existingTarget.min_grade = Number(document.getElementById('alm-quiz-min-grade')?.value || 100);
            existingTarget.videoUrl = '';
            existingTarget.videoType = '';
            existingTarget.youtubeId = '';
          } else {
            existingTarget.videoUrl = finalVideoUrl;
            existingTarget.videoType = finalVideoType;
            existingTarget.youtubeId = ytId;
            existingTarget.pdf = finalPdf;
            existingTarget.quiz_data = null;
            existingTarget.min_grade = null;
          }
        }
      } else {
        targetMod.lessons.push({
          id: lessonId,
          rawId: lessonId,
          title: lessonTitle,
          duration: lessonDuration,
          type: isQuiz ? 'quiz' : 'video',
          quiz_data: isQuiz ? cleanedQuizData : null,
          min_grade: isQuiz ? Number(document.getElementById('alm-quiz-min-grade')?.value || 100) : null,
          videoUrl: isQuiz ? '' : finalVideoUrl,
          videoType: isQuiz ? '' : finalVideoType,
          youtubeId: isQuiz ? '' : ytId,
          pdf: isQuiz ? null : finalPdf
        });
      }

      // 3. Persistência em cache local
      if (isQuiz) {
        try {
          localStorage.setItem('kognus_quiz_' + lessonId, JSON.stringify(cleanedQuizData));
          localStorage.setItem('kognus_lesson_quiz_' + lessonId, JSON.stringify(cleanedQuizData));
        } catch(e) {}
      }

      try {
        localStorage.setItem('kognus_custom_courses', JSON.stringify(state.courses));
      } catch(e) {}

      closeAddLessonToModuleModal();

      const container = document.getElementById('curriculum-builder-content');
      if (container) {
        container.innerHTML = renderCurriculumBuilderContent(course.id);
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      }
      showToast(isQuiz ? 'Avaliação salva na grade com sucesso!' : 'Aula salva com sucesso!', 'success');
    }
    window.handleSaveLessonToModule = handleSaveLessonToModule;

    // Excluir Aula do Módulo no Supabase
    async function handleDeleteLesson(courseId, moduleId, lessonId) {
      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId);
      if (!course) return;
      const targetMod = (course.modules || []).find(m => m.id == moduleId || String(m.id) === String(moduleId) || m.rawId === moduleId);
      if (!targetMod) return;
      const targetLesson = (targetMod.lessons || []).find(l => l.id == lessonId || String(l.id) === String(lessonId) || l.rawId === lessonId);
      if (!targetLesson) return;

      if (!confirm(`Tem certeza que deseja excluir a aula "${targetLesson.title}"? Esta ação não pode ser desfeita.`)) return;

      if (db) {
        try {
          const lesUuid = ensureUUID(targetLesson.rawId || targetLesson.id, '00000000-0000-0002-');
          const qL = db.from('course_lessons');
          if (qL && typeof qL.delete === 'function') {
            await qL.delete().eq('id', lesUuid);
          }
        } catch(err) {
          console.warn('[Curriculum Builder] Lesson delete warning:', err);
        }
      }

      targetMod.lessons = targetMod.lessons.filter(l => l.id != lessonId && String(l.id) !== String(lessonId) && l.rawId !== lessonId);

      try {
        localStorage.setItem('kognus_custom_courses', JSON.stringify(state.courses));
      } catch(e) {}

      const container = document.getElementById('curriculum-builder-content');
      if (container) {
        container.innerHTML = renderCurriculumBuilderContent(course.id);
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      }
      showToast('Aula excluída com sucesso!', 'success');
    }
    window.handleDeleteLesson = handleDeleteLesson;

    // Publicar Comentário ou Resposta
    async function handlePostComment(courseId, lessonId, parentId = null) {
      let contentText = '';
      if (parentId) {
        const replyInput = document.getElementById('reply-text-' + parentId);
        contentText = replyInput ? replyInput.value.trim() : '';
      } else {
        const commentInput = document.getElementById('new-comment-textarea');
        contentText = commentInput ? commentInput.value.trim() : '';
      }

      if (!contentText) {
        showToast('Por favor, escreva seu comentário antes de publicar.', 'warning');
        return;
      }

      const authorName = currentUser ? currentUser.name : 'Aluno Visitante';
      const authorEmail = currentUser ? currentUser.email : 'aluno@kognus.com';
      const authorRole = currentUser ? currentUser.role : 'aluno';
      const authorAvatar = currentUser?.avatar || (currentUser?.role === 'instrutor' 
        ? 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80' 
        : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80');

      const commentId = generateUUID();
      const courseUuid = ensureUUID(courseId, '00000000-0000-0000-0000-');
      const lessonUuid = ensureUUID(lessonId, '00000000-0000-0002-');
      const parentUuid = parentId ? (isValidUUID(parentId) ? parentId : toUuid(parentId)) : null;

      const newComment = {
        id: commentId,
        lesson_id: lessonId,
        rawLessonId: lessonUuid,
        course_id: courseId,
        rawCourseId: courseUuid,
        user_name: authorName,
        user_email: authorEmail,
        user_role: authorRole,
        user_avatar: authorAvatar,
        content: contentText,
        parent_id: parentId || null,
        likes_count: 0,
        created_at: new Date().toISOString()
      };

      if (!state.lessonComments) state.lessonComments = [];
      state.lessonComments.push(newComment);

      try {
        localStorage.setItem('kognus_lesson_comments', JSON.stringify(state.lessonComments));
      } catch(e) {}

      // Persistência assíncrona verificada no Supabase (lesson_comments)
      if (db) {
        try {
          const qC = db.from('lesson_comments');
          if (qC && typeof qC.insert === 'function') {
            await qC.insert({
              id: commentId,
              lesson_id: lessonUuid,
              course_id: courseUuid,
              user_name: newComment.user_name,
              user_email: newComment.user_email,
              user_role: newComment.user_role,
              user_avatar: newComment.user_avatar,
              content: newComment.content,
              parent_id: parentUuid,
              likes_count: 0,
              created_at: newComment.created_at
            });
          }
        } catch(err) {
          console.warn('[Supabase Lesson Comment Insert Warning]', err);
        }
      }

      activeReplyCommentId = null;

      const container = document.getElementById('lesson-comments-container');
      if (container) {
        container.innerHTML = renderLessonCommentsHtml(lessonId, courseId);
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      }

      showToast('Comentário publicado no fórum!', 'success');
    }
    window.handlePostComment = handlePostComment;

    // Curtir Comentário
    async function handleLikeComment(commentId) {
      if (!state.lessonComments) return;
      const comment = state.lessonComments.find(c => c.id === commentId || String(c.id) === String(commentId));
      if (!comment) return;

      comment.likes_count = (Number(comment.likes_count) || 0) + 1;

      try {
        localStorage.setItem('kognus_lesson_comments', JSON.stringify(state.lessonComments));
      } catch(e) {}

      if (db) {
        try {
          const commUuid = isValidUUID(commentId) ? commentId : toUuid(commentId);
          const qC = db.from('lesson_comments');
          if (qC && typeof qC.update === 'function') {
            await qC.update({ likes_count: comment.likes_count }).eq('id', commUuid);
          }
        } catch(err) {}
      }

      const container = document.getElementById('lesson-comments-container');
      if (container) {
        container.innerHTML = renderLessonCommentsHtml(comment.lesson_id, comment.course_id);
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      }
    }
    window.handleLikeComment = handleLikeComment;

    // Toggle Box de Resposta
    function toggleReplyBox(commentId) {
      activeReplyCommentId = activeReplyCommentId === commentId ? null : commentId;
      const comment = (state.lessonComments || []).find(c => c.id === commentId || String(c.id) === String(commentId));
      if (comment) {
        const container = document.getElementById('lesson-comments-container');
        if (container) {
          container.innerHTML = renderLessonCommentsHtml(comment.lesson_id, comment.course_id);
          if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
        }
      }
    }
    window.toggleReplyBox = toggleReplyBox;

    // Supabase Realtime para Comentários
    function setupLessonCommentsRealtime(lessonId) {
      if (window.lessonCommentsRealtimeChannel && db && typeof db.removeChannel === 'function') {
        try { db.removeChannel(window.lessonCommentsRealtimeChannel); } catch(e) {}
        window.lessonCommentsRealtimeChannel = null;
      }

      if (db && typeof db.channel === 'function') {
        try {
          const lUuid = ensureUUID(lessonId, '00000000-0000-0002-');
          window.lessonCommentsRealtimeChannel = db.channel('lesson-comments-realtime-' + lessonId)
            .on('postgres_changes', {
              event: '*',
              schema: 'public',
              table: 'lesson_comments'
            }, (payload) => {
              if (payload.eventType === 'INSERT' && payload.new) {
                const item = payload.new;
                if (!state.lessonComments.some(c => c.id === item.id)) {
                  state.lessonComments.push({
                    id: item.id,
                    lesson_id: fromUuidToId(item.lesson_id),
                    rawLessonId: item.lesson_id,
                    course_id: fromUuidToId(item.course_id),
                    rawCourseId: item.course_id,
                    user_name: item.user_name || 'Aluno',
                    user_email: item.user_email || '',
                    user_role: item.user_role || 'aluno',
                    user_avatar: item.user_avatar,
                    content: item.content,
                    parent_id: item.parent_id,
                    likes_count: Number(item.likes_count) || 0,
                    created_at: item.created_at || new Date().toISOString()
                  });
                  try {
                    localStorage.setItem('kognus_lesson_comments', JSON.stringify(state.lessonComments));
                  } catch(e) {}

                  const container = document.getElementById('lesson-comments-container');
                  if (container && selectedLesson) {
                    container.innerHTML = renderLessonCommentsHtml(selectedLesson.id, selectedCourse ? selectedCourse.id : 1);
                    if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
                  }
                }
              } else if (payload.eventType === 'UPDATE' && payload.new) {
                const idx = (state.lessonComments || []).findIndex(c => c.id === payload.new.id);
                if (idx !== -1) {
                  state.lessonComments[idx].likes_count = payload.new.likes_count;
                  const container = document.getElementById('lesson-comments-container');
                  if (container && selectedLesson) {
                    container.innerHTML = renderLessonCommentsHtml(selectedLesson.id, selectedCourse ? selectedCourse.id : 1);
                    if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
                  }
                }
              }
            })
            .subscribe();
        } catch(err) {
          console.warn('[Realtime Comments Subscription Error]', err);
        }
      }
    }
    window.setupLessonCommentsRealtime = setupLessonCommentsRealtime;

    
    // =========================================================================

    let currentUploadedCover = null;

    // 1. Cópia do Link Direto Compartilhável de Vendas
    function copyCourseDirectLink(courseId) {
      const origin = (typeof window !== 'undefined' && window.location?.origin) ? window.location.origin : 'http://localhost:3000';
      const directUrl = `${origin}/?curso=${courseId}`;
      const nav = (typeof window !== 'undefined' && window.navigator && window.navigator.clipboard) ? window.navigator : (typeof navigator !== 'undefined' ? navigator : null);
      if (nav && nav.clipboard && nav.clipboard.writeText) {
        nav.clipboard.writeText(directUrl).then(() => {
          showToast('Link direto de vendas copiado para a área de transferência!', 'success');
        }).catch(() => {
          showToast('Link do curso: ' + directUrl, 'info');
        });
      } else {
        showToast('Link do curso: ' + directUrl, 'info');
      }
    }

    // 2. Upload de Capa do Curso (FileReader)
    function handleCourseCoverUpload(input) {
      if (!input || !input.files || !input.files[0]) return;
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        currentUploadedCover = e.target.result;
        const preview = document.getElementById('course-cover-preview');
        if (preview) {
          preview.src = currentUploadedCover;
          preview.classList.remove('hidden');
        }
        const urlInput = document.getElementById('course-cover-url');
        if (urlInput) urlInput.value = currentUploadedCover;
      };
      reader.readAsDataURL(file);
    }

    function setCoverInputMode(mode) {
      const upMode = document.getElementById('cover-mode-upload');
      const urlMode = document.getElementById('cover-mode-url');
      const btnUp = document.getElementById('btn-cover-upload');
      const btnUrl = document.getElementById('btn-cover-url');
      if (mode === 'url') {
        if (upMode) upMode.classList.add('hidden');
        if (urlMode) urlMode.classList.remove('hidden');
        if (btnUrl) btnUrl.className = 'px-2.5 py-1 rounded bg-brand-600 text-white font-bold';
        if (btnUp) btnUp.className = 'px-2.5 py-1 rounded text-zinc-400 hover:text-white font-medium';
      } else {
        if (urlMode) urlMode.classList.add('hidden');
        if (upMode) upMode.classList.remove('hidden');
        if (btnUp) btnUp.className = 'px-2.5 py-1 rounded bg-brand-600 text-white font-bold';
        if (btnUrl) btnUrl.className = 'px-2.5 py-1 rounded text-zinc-400 hover:text-white font-medium';
      }
    }

    async function toggleCoursePublishStatus(courseId) {
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return;

      const isCurrentPub = !course.status || course.status.toLowerCase() === 'published' || course.status.toLowerCase() === 'publicado';
      const newStatus = isCurrentPub ? 'draft' : 'published';
      course.status = newStatus;

      try {
        localStorage.setItem('kognus_custom_courses', JSON.stringify(state.courses));
      } catch(e) {}

      if (newStatus === 'draft') {
        showToast(`Curso "${course.title}" colocado em rascunho (oculto do catálogo)!`, 'warning');
      } else {
        showToast(`Curso "${course.title}" publicado com sucesso na vitrine!`, 'success');
      }

      // Persistência no Supabase
      if (db) {
        try {
          const cUuid = toUuid(course.id, '00000000-0000-0000-0000-');
          const qC = db.from('courses');
          if (qC && typeof qC.update === 'function') {
            await qC.update({
              status: newStatus,
              updated_at: new Date().toISOString()
            }).eq('id', cUuid);
          }
        } catch(err) {
          console.warn('[Supabase Course Status Update Warning]', err);
        }
      }

      navigateTo('dashboard-instrutor');
    }

    // =========================================================================

    function maskCnpj(input) {
      if (!input) return;
      let v = input.value.replace(/\D/g, '').slice(0, 14);
      v = v.replace(/^(\d{2})(\d)/, '$1.$2');
      v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
      v = v.replace(/(\d{4})(\d)/, '$1-$2');
      input.value = v;
    }

    function maskWhatsapp(input) {
      if (!input) return;
      let v = input.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 10) {
        v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
      } else if (v.length > 5) {
        v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
      } else if (v.length > 2) {
        v = v.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
      }
      input.value = v;
    }

          c.image = image;
          targetCourseRef = c;

        const newModId = generateUUID();

          origBtnHtml = submitBtn.innerHTML;
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="inline-flex items-center gap-2"><svg class="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> Gravando Curso no Supabase...</span>';
        }
      }

      // Persistência completa do curso e módulos/aulas no Supabase
      if (db && targetCourseRef) {
        try {
          const courseUuid = ensureUUID(targetCourseRef.rawId || targetCourseRef.id, '00000000-0000-0000-0000-');
          const numericPrice = parseFloat(String(targetCourseRef.price).replace(/[R$\s.]/g, '').replace(',', '.')) || 0;

          const coursePayload = {
            id: courseUuid,
            instructor_id: null, // Mantém null para respeitar a constraint FK com instructors_profile
            title: targetCourseRef.title,
            category: targetCourseRef.category || 'Beleza & Estética',
            description: targetCourseRef.description || 'Curso completo na plataforma KOGNUS.',
            price: numericPrice,
            thumbnail_url: targetCourseRef.image,
            external_checkout_url: targetCourseRef.checkoutUrl || '',
            status: (targetCourseRef.status === 'draft' || targetCourseRef.status === 'rascunho') ? 'draft' : 'publicado',
            certificate_enabled: targetCourseRef.certificateConfig?.enabled ?? true,
            certificate_hours: targetCourseRef.certificateConfig?.workloadHours || 40
          };

          const qC = db.from('courses');
          if (qC && typeof qC.upsert === 'function') {
            const { data: cData, error: cErr } = await qC.upsert(coursePayload).select();
            if (cErr) {
              console.error('[Supabase Course Upsert Error]', cErr);
              showToast('Aviso: Erro ao persistir curso no Supabase: ' + cErr.message, 'warning');
            } else {
              console.log('[Supabase Course Upsert Success]', cData);
            }
          }

          // Persiste módulos e aulas do curso
          if (targetCourseRef.modules && Array.isArray(targetCourseRef.modules)) {
            for (let mi = 0; mi < targetCourseRef.modules.length; mi++) {
              const mod = targetCourseRef.modules[mi];
              const modUuid = ensureUUID(mod.rawId || mod.id, '00000000-0000-0001-');
              const qMod = db.from('course_modules');
              if (qMod && typeof qMod.upsert === 'function') {
                const { error: mErr } = await qMod.upsert({
                  id: modUuid,
                  course_id: courseUuid,
                  title: mod.title,
                  order_index: mi
                });
                if (mErr) console.error('[Supabase Module Upsert Error]', mErr);
              }

              if (mod.lessons && Array.isArray(mod.lessons)) {
                for (let li = 0; li < mod.lessons.length; li++) {
                  const les = mod.lessons[li];
                  const lesUuid = ensureUUID(les.rawId || les.id, '00000000-0002-');
                  const qLes = db.from('course_lessons');
                  if (qLes && typeof qLes.upsert === 'function') {
                    const { error: lErr } = await qLes.upsert({
                      id: lesUuid,
                      module_id: modUuid,
                      course_id: courseUuid,
                      title: les.title,
                      duration: les.duration || '15 min',
                      video_url: les.videoUrl || `https://www.youtube-nocookie.com/embed/${les.youtubeId || 'dQw4w9WgXcQ'}`,
                      pdf_url: les.pdf || 'Apostila.pdf',
                      order_index: li
                    });
                    if (lErr) console.error('[Supabase Lesson Upsert Error]', lErr);
                  }
                }
              }
            }
          }
        } catch(err) {
          console.error('[Supabase Course Persist Exception]', err);
        }
      }

      if (submitBtn && submitBtn.disabled) {
        submitBtn.disabled = false;
        if (origBtnHtml) submitBtn.innerHTML = origBtnHtml;
      }

      closeCourseModal();
      navigateTo('dashboard-instrutor');
    }

    // 4. Funções de Upload de Vídeo e PDF para Aulas
    function setLessonVideoMode(mode) {
      currentLessonVideoType = mode;
      const ytInput = document.getElementById('video-input-youtube');
      const upInput = document.getElementById('video-input-upload');
      const btnYt = document.getElementById('btn-mode-youtube');
      const btnUp = document.getElementById('btn-mode-upload');
      if (mode === 'upload') {
        if (ytInput) ytInput.classList.add('hidden');
        if (upInput) upInput.classList.remove('hidden');
        if (btnUp) { btnUp.className = 'px-2.5 py-1 rounded bg-brand-600 text-white font-bold'; }
        if (btnYt) { btnYt.className = 'px-2.5 py-1 rounded text-zinc-400 hover:text-white font-medium'; }
      } else {
        if (upInput) upInput.classList.add('hidden');
        if (ytInput) ytInput.classList.remove('hidden');
        if (btnYt) { btnYt.className = 'px-2.5 py-1 rounded bg-brand-600 text-white font-bold'; }
        if (btnUp) { btnUp.className = 'px-2.5 py-1 rounded text-zinc-400 hover:text-white font-medium'; }
      }
    }

    function handleLessonVideoUpload(input) {
      if (!input || !input.files || !input.files[0]) return;
      const file = input.files[0];
      if (typeof URL !== 'undefined' && URL.createObjectURL) {
        currentUploadedVideoUrl = URL.createObjectURL(file);
      } else {
        const reader = new FileReader();
        reader.onload = function(e) { currentUploadedVideoUrl = e.target.result; };
        reader.readAsDataURL(file);
      }
      const st = document.getElementById('nl-video-status');
      if (st) st.innerText = `✓ Vídeo carregado: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
    }

    function handleLessonPdfUpload(input) {
      if (!input || !input.files || !input.files[0]) return;
      const file = input.files[0];
      const nameInput = document.getElementById('nl-pdf-name');
      if (nameInput) nameInput.value = file.name;
    }

    // 5. Radar de Espera em Tempo Real do Aluno (Checkout BYOG & Stripe Unificado)
    async function handleStudentCheckoutSubmit(e, courseId) {
      if (e && e.preventDefault) e.preventDefault();
      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId) || state.courses[0];
      const nameInput = document.getElementById('chk-name');
      const emailInput = document.getElementById('chk-email');
      const studentName = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : (currentUser ? currentUser.name : 'Aluno');
      const studentEmail = (emailInput && emailInput.value.trim()) ? emailInput.value.trim() : (currentUser ? currentUser.email : 'aluno@exemplo.com');

      // Persistência cadastral do aluno no Supabase
      if (db && studentEmail) {
        try {
          const qUs = db.from('users');
          if (qUs && typeof qUs.upsert === 'function') {
            const { error: uErr } = await qUs.upsert({
            id: generateUUID(),
            name: studentName,
            email: studentEmail.toLowerCase().trim(),
            role: 'aluno',
            school_name: '',
            status: 'ativo',
            password_hash: 'kognus123',
            must_change_password: true,
            created_at: new Date().toISOString()
          }, { onConflict: 'email' });
            if (uErr) console.error('[Supabase Student Checkout User Error]', uErr);
          }
        } catch(err) {
          console.error('[Supabase Student Checkout Exception]', err);
        }
      }

      // 1. Identificador composto do aluno e do curso
      const clientRef = `student_${encodeURIComponent(studentEmail)}__course_${course.id}`;

      // 2. Base URL do checkout (BYOG do curso ou Stripe da plataforma)
      const rawCheckoutUrl = (course && course.checkoutUrl) ? course.checkoutUrl : (localStorage.getItem('kognus_stripe_checkout_url') || state.stripeCheckoutUrl || 'https://buy.stripe.com/test_eVaeVd0QbgwE8kU6oo');
      const sep = rawCheckoutUrl.includes('?') ? '&' : '?';
      const targetUrl = `${rawCheckoutUrl}${sep}prefilled_email=${encodeURIComponent(studentEmail)}&client_reference_id=${encodeURIComponent(clientRef)}&course_id=${course.id}`;

      // 3. Salva no localStorage o estado pendente da matrícula
      try {
        localStorage.setItem('pending_student_checkout', JSON.stringify({
          email: studentEmail,
          courseId: course.id,
          startedAt: Date.now()
        }));
      } catch(err) {}

      // 4. Abre o link do Stripe em nova aba
      if (typeof window !== 'undefined' && window.open) {
        try {
          window.open(targetUrl, '_blank');
        } catch(err) {
          console.warn('Pop-up bloqueado:', err);
        }
      }

      // Abre imediatamente o Modal de Escuta em Tempo Real
      openStudentRadarModal(studentEmail, studentName, course.id);
    }

    function startStudentPaymentGateway(courseId) {
      handleStudentCheckoutSubmit(null, courseId);
    }

    function setupStudentRealtimeListener(studentEmail, courseId) {
      if (window.studentRealtimeChannel && db && typeof db.removeChannel === 'function') {
        try { db.removeChannel(window.studentRealtimeChannel); } catch(e) {}
        window.studentRealtimeChannel = null;
      }

      if (db && typeof db.channel === 'function') {
        try {
          const studentChannel = db.channel('student-enrollment-watch')
            .on('postgres_changes', {
              event: 'INSERT',
              schema: 'public',
              table: 'enrollments',
              filter: `student_email=eq.${studentEmail.toLowerCase().trim()}`
            }, (payload) => {
              console.log('[Supabase Realtime] Evento na tabela enrollments:', payload);
              if (payload.new && (!courseId || String(payload.new.course_id) === String(courseId))) {
                onStudentPaymentSuccess(payload.new);
              }
            })
            .subscribe();
          window.studentRealtimeChannel = studentChannel;
        } catch(err) {
          console.warn('[Supabase Realtime Student Warning]:', err);
        }
      }
    }

    function openStudentRadarModal(email, name, courseId) {
      setupStudentRealtimeListener(email, courseId);
      openStripeRadarModal(email, 'student', courseId);
    }

    function onStudentPaymentSuccess(data) {
      const studentEmail = (data && data.student_email) || currentRadarTargetEmail || 'aluno@kognus.com';
      const courseId = (data && data.course_id) || currentRadarCourseId || 1;

      if (window.studentRealtimeChannel && db && typeof db.removeChannel === 'function') {
        try { db.removeChannel(window.studentRealtimeChannel); } catch(e) {}
        window.studentRealtimeChannel = null;
      }
      if (window.studentRadarInterval) {
        clearInterval(window.studentRadarInterval);
        window.studentRadarInterval = null;
      }

      const cleanEmail = studentEmail.toLowerCase().trim();
      const cid = Number(courseId) || courseId;

      if (!state.enrollments.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === String(cid))) {
        state.enrollments.push({ studentEmail: cleanEmail, courseId: cid });
      }

      try {
        localStorage.setItem('kognus_enrollments', JSON.stringify(state.enrollments));
        localStorage.removeItem('pending_student_checkout');
      } catch(err) {}

      if (!currentUser) {
        currentUser = {
          id: 'aluno_' + Math.random().toString(36).substring(2, 7),
          name: 'Aluno',
          email: cleanEmail,
          role: 'aluno'
        };
        try { localStorage.setItem('kognus_session', JSON.stringify(currentUser)); } catch(e) {}
        renderHeader();
      }

      const v = document.getElementById('app-viewport');
      if (v && currentView === 'checkout') {
        const tempPass = 'TMP-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        v.innerHTML = renderPurchaseSuccessPage(tempPass);
      }

      setPaymentModalState('SUCCESS');
      showToast('🎉 Matrícula Confirmada com Sucesso!', 'success');
    }

    function confirmStudentEnrollment(email, name, courseId) {
      onStudentPaymentSuccess({ student_email: email, course_id: courseId });
    }

    function closeStudentRadarModal() {
      closeStripeRadarModal();
    }

    function startStudentEnrollmentPolling(email, courseId) {
      if (window.studentRadarInterval) clearInterval(window.studentRadarInterval);
      const cleanEmail = email.toLowerCase().trim();
      const cid = String(courseId || (state.courses[0] ? state.courses[0].id : 1));

      window.studentRadarInterval = setInterval(async () => {
        // 1. Checa estado local
        const hasLocal = state.enrollments.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === cid);
        if (hasLocal) {
          onStudentPaymentSuccess({ student_email: cleanEmail, course_id: cid });
          return;
        }

        // 2. Polling de redundância no Supabase a cada 2.5s
        if (db) {
          try {
            const { data, error } = await db.from('enrollments')
              .select('*')
              .eq('student_email', cleanEmail)
              .eq('course_id', cid)
              .maybeSingle();

            if (!error && data && (data.status === 'active' || !data.status)) {
              onStudentPaymentSuccess(data);
              return;
            }
          } catch(e) {
            console.warn('[Student Polling Supabase Warning]:', e);
          }
        }

        // 3. Checa localStorage kognus_enrollments
        try {
          const stored = JSON.parse(localStorage.getItem('kognus_enrollments') || '[]');
          if (stored.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === cid)) {
            onStudentPaymentSuccess({ student_email: cleanEmail, course_id: cid });
          }
        } catch(e) {}
      }, 2500);
    }

    // Inicialização ao carregar a página
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
