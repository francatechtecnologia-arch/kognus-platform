<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KOGNUS">
  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>KOGNUS — Plataforma Educacional & Creator Studio SaaS</title>
  <meta name="description" content="Plataforma de cursos online e gestão de escolas digitais com 0% de comissão.">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <!-- CDN Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
            cinzel: ['Cinzel', 'serif']
          },
          colors: {
            brand: {
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#1e1b4b'
            },
            darkBg: '#09090b',
            darkCard: '#111116',
            darkBorder: '#27272a'
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --school-accent: #6366f1;

      /* LIGHT MODE (Padrão quando a classe .dark NÃO está presente no <html> ou <body>) */
      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-subtle: #f1f5f9;
      --border-app: #e2e8f0;
      --text-main: #0f172a;        /* Quase preto para títulos e textos principais */
      --text-muted: #475569;       /* Cinza escuro com alto contraste para subtítulos */
      --text-soft: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
    }

    html.dark, body.dark {
      /* DARK MODE */
      --bg-app: #09090b;
      --bg-surface: #18181b;
      --bg-surface-subtle: #27272a;
      --border-app: #27272a;
      --text-main: #f8fafc;
      --text-muted: #a1a1aa;
      --text-soft: #71717a;
      --input-bg: #121215;
      --input-border: #3f3f46;
    }

    .school-accent-bg {
      background-color: var(--school-accent) !important;
    }
    .school-accent-text {
      color: var(--school-accent) !important;
    }
    .school-accent-border {
      border-color: var(--school-accent) !important;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    html {
      width: 100% !important;
      max-width: 100vw !important;
      overflow-x: hidden !important;
      -webkit-text-size-adjust: 100%;
    }

    body {
      width: 100% !important;
      max-width: 100vw !important;
      overflow-x: hidden !important;
      position: relative;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    #app-viewport {
      width: 100% !important;
      max-width: 100vw !important;
      overflow-x: hidden !important;
      min-width: 0 !important;
    }

    img, video, iframe {
      max-width: 100%;
      height: auto;
    }

    h1, h2, h3, h4, h5, h6, p, span, a, button {
      overflow-wrap: break-word;
    }

    a, button, input, select, textarea {
      touch-action: manipulation;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
    
    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }
      body * {
        visibility: hidden;
      }
      #certificate-print-area, #certificate-print-area *,
      #printable-cert, #printable-cert * {
        visibility: visible;
      }
      #certificate-print-area {
        position: fixed;
        left: 0;
        top: 0;
        width: 297mm;
        height: 210mm;
        margin: 0;
        padding: 0;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        background: #ffffff !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
        z-index: 99999999 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      .no-print {
        display: none !important;
      }
      /* Regras estritas de impressão de alto padrão em folha A4 paisagem */
      #certificate-print-area .cert-sheet {
        width: 297mm !important;
        height: 210mm !important;
        max-width: 297mm !important;
        max-height: 210mm !important;
        margin: 0 !important;
        padding: 8mm 12mm !important;
        background: #ffffff !important;
        color: #0f172a !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
      }
      #certificate-print-area .cert-sheet * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      #certificate-print-area .cert-outer-frame {
        border-color: #d97706 !important;
        background: #ffffff !important;
      }
      #certificate-print-area .cert-inner-frame {
        border-color: rgba(217, 119, 6, 0.45) !important;
      }
      #certificate-print-area .cert-title-classic {
        color: #b45309 !important;
        -webkit-text-fill-color: #b45309 !important;
      }
      #certificate-print-area .cert-title-modern {
        color: #4338ca !important;
        -webkit-text-fill-color: #4338ca !important;
      }
      #certificate-print-area .cert-title-corporate {
        color: #047857 !important;
        -webkit-text-fill-color: #047857 !important;
      }
      #certificate-print-area .cert-student-name {
        color: #000000 !important;
        -webkit-text-fill-color: #000000 !important;
      }
      #certificate-print-area .cert-body-text {
        color: #1e293b !important;
      }
      #certificate-print-area .cert-muted-text {
        color: #475569 !important;
      }
      #certificate-print-area .cert-pill {
        background: #f8fafc !important;
        color: #334155 !important;
        border-color: #cbd5e1 !important;
      }
      #certificate-print-area .cert-sig-line {
        border-color: #94a3b8 !important;
      }
    }

    /* ===== APLICAÇÃO DAS VARIÁVEIS DE TEMA (LIGHT MODE) ===== */
    html:not(.dark) body {
      background-color: var(--bg-app) !important;
      color: var(--text-main) !important;
    }
    html:not(.dark) main {
      background-color: var(--bg-app) !important;
      color: var(--text-main) !important;
    }
    html:not(.dark) header {
      background-color: rgba(255, 255, 255, 0.96) !important;
      border-bottom-color: var(--border-app) !important;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04) !important;
    }
    html:not(.dark) footer {
      background-color: var(--bg-surface) !important;
      border-top-color: var(--border-app) !important;
    }
    html:not(.dark) footer span,
    html:not(.dark) footer button {
      color: var(--text-soft) !important;
    }
    html:not(.dark) footer button:hover {
      color: var(--text-main) !important;
    }

    /* Superfícies, Cartões e Painéis */
    html:not(.dark) .bg-darkBg {
      background-color: var(--bg-app) !important;
    }
    html:not(.dark) .bg-darkCard,
    html:not(.dark) .bg-zinc-950,
    html:not(.dark) .bg-zinc-900,
    html:not(.dark) [class*="bg-zinc-950"],
    html:not(.dark) [class*="bg-zinc-900"],
    html:not(.dark) [class*="bg-[#0b0d14]"],
    html:not(.dark) [class*="bg-[#070913]"],
    html:not(.dark) [class*="bg-[#0a0f12]"] {
      background-color: var(--bg-surface) !important;
      border-color: var(--border-app) !important;
    }
    html:not(.dark) .bg-darkCard {
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05) !important;
    }
    html:not(.dark) .bg-zinc-800,
    html:not(.dark) .bg-zinc-850,
    html:not(.dark) [class*="bg-zinc-800"],
    html:not(.dark) [class*="bg-zinc-850"] {
      background-color: var(--bg-surface-subtle) !important;
      border-color: var(--border-app) !important;
    }

    /* Bordas */
    html:not(.dark) .border-darkBorder,
    html:not(.dark) [class*="border-darkBorder"],
    html:not(.dark) [class*="border-zinc-800"],
    html:not(.dark) [class*="border-zinc-700"],
    html:not(.dark) [class*="border-zinc-900"] {
      border-color: var(--border-app) !important;
    }

    /* TIPOGRAFIA E CONTRASTE WCAG AA (Sem texto branco sobre fundo branco) */
    html:not(.dark) .text-white,
    html:not(.dark) [class*="text-white"],
    html:not(.dark) .text-zinc-100,
    html:not(.dark) [class*="text-zinc-100"],
    html:not(.dark) .text-zinc-200,
    html:not(.dark) [class*="text-zinc-200"] {
      color: var(--text-main) !important;
    }
    html:not(.dark) h1,
    html:not(.dark) h2,
    html:not(.dark) h3,
    html:not(.dark) h4,
    html:not(.dark) h5,
    html:not(.dark) h6,
    html:not(.dark) strong {
      color: var(--text-main) !important;
    }

    /* Textos secundários e auxiliares */
    html:not(.dark) .text-zinc-300,
    html:not(.dark) [class*="text-zinc-300"],
    html:not(.dark) .text-zinc-400,
    html:not(.dark) [class*="text-zinc-400"] {
      color: var(--text-muted) !important;
    }
    html:not(.dark) .text-zinc-500,
    html:not(.dark) [class*="text-zinc-500"],
    html:not(.dark) .text-zinc-600,
    html:not(.dark) [class*="text-zinc-600"] {
      color: var(--text-soft) !important;
    }

    /* Métricas e destaques com contraste adequado no modo claro */
    html:not(.dark) .text-emerald-400,
    html:not(.dark) .text-emerald-300 {
      color: #059669 !important;
    }
    html:not(.dark) .text-brand-400,
    html:not(.dark) .text-brand-300 {
      color: #4f46e5 !important;
    }
    html:not(.dark) .text-indigo-400,
    html:not(.dark) .text-indigo-300 {
      color: #4338ca !important;
    }
    html:not(.dark) .text-amber-400,
    html:not(.dark) .text-amber-300 {
      color: #d97706 !important;
    }
    html:not(.dark) .text-red-400,
    html:not(.dark) .text-red-300 {
      color: #dc2626 !important;
    }

    /* BOTÕES COM FUNDO SÓLIDO: Preserva texto branco apenas em botões sólidos */
    html:not(.dark) .btn-primary,
    html:not(.dark) button.bg-brand-600,
    html:not(.dark) button.bg-brand-500,
    html:not(.dark) button.bg-indigo-600,
    html:not(.dark) button.bg-indigo-500,
    html:not(.dark) button.bg-emerald-600,
    html:not(.dark) button.bg-red-600,
    html:not(.dark) a.bg-brand-600,
    html:not(.dark) a.bg-brand-500,
    html:not(.dark) a.bg-indigo-600,
    html:not(.dark) button[class*="bg-brand"]:not([class*="/10"]):not([class*="/20"]):not([class*="/30"]),
    html:not(.dark) button[class*="bg-indigo"]:not([class*="/10"]):not([class*="/20"]):not([class*="/30"]),
    html:not(.dark) button[class*="bg-emerald"]:not([class*="/10"]):not([class*="/20"]):not([class*="/30"]),
    html:not(.dark) button[class*="bg-red"]:not([class*="/10"]):not([class*="/20"]):not([class*="/30"]),
    html:not(.dark) button[class~="bg-brand-600"],
    html:not(.dark) button[class~="bg-brand-500"],
    html:not(.dark) button[class~="bg-indigo-600"],
    html:not(.dark) button[class~="bg-emerald-600"],
    html:not(.dark) button[class~="bg-red-600"] {
      color: #ffffff !important;
    }
    html:not(.dark) button[class~="bg-brand-600"] *,
    html:not(.dark) button[class~="bg-brand-500"] *,
    html:not(.dark) button[class~="bg-indigo-600"] *,
    html:not(.dark) button[class~="bg-emerald-600"] *,
    html:not(.dark) button[class~="bg-red-600"] *,
    html:not(.dark) button[class*="bg-brand"]:not([class*="/10"]):not([class*="/20"]):not([class*="/30"]) *,
    html:not(.dark) button[class*="bg-indigo"]:not([class*="/10"]):not([class*="/20"]):not([class*="/30"]) * {
      color: #ffffff !important;
    }

    /* Botões fantasma/outline e links de navegação */
    html:not(.dark) nav a,
    html:not(.dark) nav button,
    html:not(.dark) header button:not([class~="bg-brand-600"]) {
      color: var(--text-muted) !important;
    }
    html:not(.dark) nav a:hover,
    html:not(.dark) nav button:hover,
    html:not(.dark) header button:not([class~="bg-brand-600"]):hover {
      color: var(--text-main) !important;
    }
    html:not(.dark) .hover\:bg-zinc-800:hover,
    html:not(.dark) .hover\:bg-zinc-700:hover,
    html:not(.dark) .hover\:bg-zinc-900:hover {
      background-color: var(--bg-surface-subtle) !important;
      color: var(--text-main) !important;
    }

    /* Formulários e Inputs */
    html:not(.dark) input,
    html:not(.dark) select,
    html:not(.dark) textarea {
      background-color: var(--input-bg) !important;
      color: var(--text-main) !important;
      border-color: var(--input-border) !important;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.04) !important;
    }
    html:not(.dark) select option {
      background-color: #ffffff !important;
      color: var(--text-main) !important;
    }
    html:not(.dark) input:focus,
    html:not(.dark) select:focus,
    html:not(.dark) textarea:focus {
      background-color: #ffffff !important;
      border-color: #6366f1 !important;
      color: var(--text-main) !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15) !important;
    }
    html:not(.dark) input::placeholder,
    html:not(.dark) textarea::placeholder {
      color: var(--text-soft) !important;
    }

    /* Modais e Overlays */
    html:not(.dark) [class*="fixed inset-0"][class*="bg-black"],
    html:not(.dark) [class*="fixed inset-0"][class*="bg-zinc-950"] {
      background-color: rgba(15, 23, 42, 0.6) !important;
      backdrop-filter: blur(4px) !important;
    }
    html:not(.dark) [id$="-modal"] > div,
    html:not(.dark) [id$="-modal"] .bg-darkCard,
    html:not(.dark) [id$="-modal"] .bg-zinc-900,
    html:not(.dark) [id$="-modal"] .bg-zinc-950 {
      background-color: var(--bg-surface) !important;
      color: var(--text-main) !important;
      border-color: var(--border-app) !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15) !important;
    }

    /* Tabelas */
    html:not(.dark) table {
      color: var(--text-main) !important;
    }
    html:not(.dark) table th {
      background-color: var(--bg-surface-subtle) !important;
      color: var(--text-muted) !important;
      border-color: var(--border-app) !important;
    }
    html:not(.dark) table td {
      color: var(--text-main) !important;
      border-color: var(--border-app) !important;
    }
    html:not(.dark) table tr:hover td {
      background-color: var(--bg-surface-subtle) !important;
    }

    /* LMS Player & Sidebar */
    html:not(.dark) #app-viewport [class*="bg-zinc-900/90"],
    html:not(.dark) #app-viewport [class*="bg-zinc-900/60"] {
      background-color: var(--bg-surface-subtle) !important;
      border-color: var(--border-app) !important;
    }
    html:not(.dark) #app-viewport [class*="bg-indigo-600/20"] {
      background-color: rgba(99, 102, 241, 0.1) !important;
      border-color: #6366f1 !important;
    }
    html:not(.dark) [class*="from-brand-900"] {
      background-image: linear-gradient(to right, #f1f5f9, #ffffff) !important;
      border-color: var(--border-app) !important;
    }

    /* Badges e Chips */
    html:not(.dark) [class*="bg-zinc-800"][class*="rounded"] {
      background-color: var(--bg-surface-subtle) !important;
      color: var(--text-muted) !important;
    }

    /* Certificado na tela em modo claro */
    html:not(.dark) #certificate-print-area .cert-sheet {
      background-color: var(--bg-surface) !important;
      color: var(--text-main) !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1) !important;
    }
    html:not(.dark) #certificate-print-area .cert-outer-frame {
      border-color: #d97706 !important;
    }
    html:not(.dark) #certificate-print-area .cert-inner-frame {
      border-color: rgba(217, 119, 6, 0.4) !important;
    }
    html:not(.dark) #certificate-print-area .cert-student-name {
      color: #09090b !important;
    }
    html:not(.dark) #certificate-print-area .cert-body-text {
      color: var(--text-muted) !important;
    }
    html:not(.dark) #certificate-print-area .cert-muted-text {
      color: var(--text-soft) !important;
    }
    html:not(.dark) #certificate-print-area .cert-pill {
      background-color: var(--bg-surface-subtle) !important;
      border-color: var(--border-app) !important;
      color: var(--text-muted) !important;
    }

    /* Theme toggle button animations */
    .theme-toggle-btn {
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), background-color 0.2s;
    }
    .theme-toggle-btn:hover { transform: rotate(20deg) scale(1.1); }
    .theme-toggle-btn:active { transform: rotate(0deg) scale(0.95); }
    * { transition: background-color 0.25s ease, border-color 0.25s ease, color 0.15s ease; }
  </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen flex flex-col selection:bg-brand-600 selection:text-white">

  <!-- CABEÇALHO UNIFICADO (HEADER) -->
  <header class="border-b border-darkBorder bg-darkBg/95 backdrop-blur sticky top-0 z-50 px-3 sm:px-4 lg:px-8 h-16 flex items-center justify-between transition-all w-full max-w-full overflow-hidden">
    <!-- Lado Esquerdo: Logo + Nome -->
    <div class="flex items-center space-x-2 sm:space-x-3 cursor-pointer group flex-shrink-0" onclick="navigateTo('landing')">
      <img src="logo.png" alt="KOGNUS" class="h-7 sm:h-8 w-auto object-contain drop-shadow-[0_2px_8px_rgba(99,102,241,0.3)] transition-transform group-hover:scale-105" onerror="this.src='https://placehold.co/32x32/6366f1/ffffff?text=K'">
      <span class="font-black tracking-tight text-lg sm:text-xl text-white group-hover:text-brand-400 transition">KOGNUS</span>
    </div>

    <!-- Centro: Links de Navegação Consistentes (Desktop) -->
    <nav id="nav-links" class="hidden md:flex items-center gap-6 text-sm font-medium text-zinc-300">
      <!-- Injetado dinamicamente via JS -->
    </nav>

    <!-- Lado Direito: Ações / Perfil de Usuário + Botão Hamburguer Mobile -->
    <div class="flex items-center space-x-1.5 sm:space-x-3 flex-shrink-0">
      <button id="theme-toggle-btn" onclick="toggleKognusTheme()" class="theme-toggle-btn min-h-[44px] min-w-[44px] text-zinc-400 hover:text-amber-400 p-2 rounded-lg hover:bg-zinc-800 transition flex items-center justify-center flex-shrink-0" aria-label="Alternar Tema" title="Alternar Tema Claro / Escuro">
        <i data-lucide="sun" class="w-5 h-5 hidden" id="theme-icon-sun"></i>
        <i data-lucide="moon" class="w-5 h-5" id="theme-icon-moon"></i>
      </button>
      <div id="nav-user-area" class="flex items-center space-x-1.5 sm:space-x-2">
        <!-- Injetado dinamicamente via JS -->
      </div>
      <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="md:hidden min-h-[44px] min-w-[44px] text-zinc-400 hover:text-white p-2 rounded-lg hover:bg-zinc-800 transition flex items-center justify-center flex-shrink-0" aria-label="Abrir Menu">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </div>
  </header>

  <!-- Menu Dropdown Mobile (< 768px) -->
  <div id="mobile-menu" class="hidden md:hidden border-b border-darkBorder bg-zinc-950/98 backdrop-blur-md px-4 py-4 space-y-3 z-40 transition-all max-w-full overflow-hidden">
    <div id="mobile-nav-links" class="flex flex-col space-y-2 text-sm font-medium text-zinc-300">
      <!-- Injetado dinamicamente via JS -->
    </div>
  </div>

  <!-- VIEWPORT PRINCIPAL SPA -->
  <main id="app-viewport" class="flex-1 w-full max-w-7xl mx-auto px-4 py-8">
    <!-- Conteúdo dinâmico das telas renderizado aqui -->

    // =========================================================================
    // GERADOR UNIVERSAL DE UUID SEGURO & COMPLIANCE POSTGRESQL / SUPABASE
    // =========================================================================
    function generateUUID() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function isValidUUID(str) {
      return typeof str === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str.trim());
    }

    function ensureUUID(id, prefix = '00000000-0000-0000-0000-') {
      if (!id) return generateUUID();
      const str = String(id).trim();
      if (isValidUUID(str)) return str;
      if (/^\d+$/.test(str)) {
        const hex = Math.floor(Number(str)).toString(16).padStart(12, '0').slice(-12);
        return `${prefix}${hex}`;
      }
      if (str.startsWith('inst_')) {
        const numPart = str.replace('inst_', '');
        const hex = (/^\d+$/.test(numPart) ? Number(numPart) : 101).toString(16).padStart(12, '0').slice(-12);
        return `00000000-0000-0000-0003-${hex}`;
      }
      if (str.startsWith('adm_')) {
        const numPart = str.replace('adm_', '');
        const hex = (/^\d+$/.test(numPart) ? Number(numPart) : 201).toString(16).padStart(12, '0').slice(-12);
        return `00000000-0000-0000-0004-${hex}`;
      }
      if (str.startsWith('alu_')) {
        const numPart = str.replace('alu_', '');
        const hex = (/^\d+$/.test(numPart) ? Number(numPart) : 301).toString(16).padStart(12, '0').slice(-12);
        return `00000000-0000-0000-0005-${hex}`;
      }
      return generateUUID();
    }

    function toUuid(id, prefix = '00000000-0000-0000-0000-') {
      return ensureUUID(id, prefix);
    }

    function fromUuidToId(uuid) {
      if (typeof uuid === 'number') return uuid;
      if (!uuid) return 1;
      const str = String(uuid);
      if (str.startsWith('00000000-0000-0000-0000-') || str.startsWith('00000000-0000-0000-0001-') || str.startsWith('00000000-0000-0000-0002-')) {
        const num = parseInt(str.slice(-12), 16);
        if (!isNaN(num)) return num;
      }
      return uuid;
    }

      if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split('?')[0];
      return url;
    }

            const qM = db.from('course_modules');
            if (qM && typeof qM.upsert === 'function') await qM.upsert({
              id: mUuid,
              course_id: cUuid,
              title: m.title,
              order_index: mi

              const l = m.lessons[li];
              const lUuid = toUuid(l.id, '00000000-0000-0000-0002-');
              const qL = db.from('course_lessons');
              if (qL && typeof qL.upsert === 'function') await qL.upsert({
                id: lUuid,
                module_id: mUuid,
                course_id: cUuid,
                title: l.title,
                duration: l.duration,
                video_url: l.videoUrl || `https://www.youtube-nocookie.com/embed/${l.youtubeId || 'dQw4w9WgXcQ'}`,
                pdf_url: l.pdf,
                order_index: li
              });
            }
          }
        }
        console.log('[Supabase Seed] Base inicial inserida com sucesso no Supabase.');
      } catch(err) {
        console.warn('[Supabase Seed Warning]', err);
      }

    // 3. INICIALIZAÇÃO DA APLICAÇÃO
    function initApp() {
      const savedSession = localStorage.getItem('kognus_session');
      if (savedSession) {
        try {
          currentUser = JSON.parse(savedSession);
          if (currentUser && currentUser.id) {
            currentUser.id = ensureUUID(currentUser.id);
          }
        } catch(e) {
          currentUser = null;
          localStorage.clear();
        }
      } else {
        currentUser = null;
      }

      // Restaura cursos customizados do storage se existirem
      // Restaura comentários customizados do storage se existirem
      const savedComments = localStorage.getItem('kognus_lesson_comments');
      if (savedComments) {
        try {
          const parsed = JSON.parse(savedComments);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.lessonComments = parsed;
          }
        } catch(e) {}
      }

      const savedCourses = localStorage.getItem('kognus_custom_courses');
      if (savedCourses) {
        try {
          const parsed = JSON.parse(savedCourses);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.courses = parsed;
          }
        } catch(e) {}
      }

      // Restaura matrículas customizadas do storage se existirem
      const savedEnrollments = localStorage.getItem('kognus_enrollments');
      if (savedEnrollments) {
        try {
          const parsed = JSON.parse(savedEnrollments);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.enrollments = parsed;
          }
        } catch(e) {}
      }

      // Restaura instrutores customizados do storage se existirem
      const savedInstructors = localStorage.getItem('kognus_instructors');
      if (savedInstructors) {
        try {
          const parsed = JSON.parse(savedInstructors);
          if (Array.isArray(parsed) && parsed.length > 0) {
            parsed.forEach(savedInst => {
              const idx = state.instructors.findIndex(i => i.email && savedInst.email && i.email.toLowerCase().trim() === savedInst.email.toLowerCase().trim());
              if (idx >= 0) {
                state.instructors[idx] = { ...state.instructors[idx], ...savedInst };
              } else {
                state.instructors.unshift(savedInst);
              }
            });
          }
        } catch(e) {}
      }

      // 3.1 CAPTURA DE RETORNO DO STRIPE VIA QUERY PARAMS (UNIFICADO INSTRUTOR & ALUNO)
      let stripeReturnHandled = false;
      let deepLinkedCourseId = null;

      if (typeof window !== 'undefined' && window.location && window.location.search) {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const stripeStatus = urlParams.get('stripe_status') || urlParams.get('payment_status') || urlParams.get('status');
          const isStripeReturn = stripeStatus === 'verifying' || stripeStatus === 'success' || urlParams.has('session_id');

          const rawType = urlParams.get('type');
          const cid = urlParams.get('course_id') || urlParams.get('curso') || urlParams.get('course');
          if (cid) deepLinkedCourseId = Number(cid);

          if (isStripeReturn) {
            const isStudent = rawType === 'student' || (!rawType && Boolean(deepLinkedCourseId)) || (currentUser && currentUser.role === 'aluno');
            const flowType = isStudent ? 'student' : 'instructor';
            const flowEmail = urlParams.get('email') || (currentUser ? currentUser.email : (flowType === 'instructor' ? 'instrutor@kognus.com' : 'aluno@kognus.com'));
            const targetCourseId = deepLinkedCourseId || (state.courses[0] ? state.courses[0].id : 1);

            // Limpa parâmetros da URL de forma invisível via window.history.replaceState
            if (window.history && window.history.replaceState) {
              window.history.replaceState({}, document.title, window.location.pathname);
            }

            stripeReturnHandled = true;
            renderHeader();

            if (flowType === 'instructor') {
              if (!currentUser || currentUser.email !== flowEmail) {
                const foundInst = state.instructors.find(i => i.email === flowEmail);
                currentUser = {
                  id: foundInst ? (foundInst.id || 'inst_1') : 'inst_1',
                  name: foundInst ? foundInst.name : 'Instrutor',
                  email: flowEmail,
                  school: foundInst ? foundInst.school : 'Minha Escola',
                  role: 'instrutor',
                  status: foundInst ? foundInst.status : 'pendente'
                };
                try {
                  localStorage.setItem('kognus_session', JSON.stringify(currentUser));
                } catch(e) {}
              }
              navigateTo('dashboard-instrutor');
              openStripeRadarModal(flowEmail, 'instructor');
              startRealtimePaymentWatcher(flowEmail);
            } else {
              if (!currentUser) {
                currentUser = {
                  id: 'aluno_' + Math.random().toString(36).substring(2, 7),
                  name: 'Aluno',
                  email: flowEmail,
                  role: 'aluno'
                };
                try {
                  localStorage.setItem('kognus_session', JSON.stringify(currentUser));
                } catch(e) {}
              }
              navigateTo('landing');
              openStripeRadarModal(flowEmail, 'student', targetCourseId);
              startStudentEnrollmentPolling(flowEmail, targetCourseId);
            }
          }
        } catch(e) {
          console.warn('[Stripe Return Parse Error]', e);
        }
      }

      if (stripeReturnHandled) return;

      renderHeader();
      if (deepLinkedCourseId) {
        navigateTo('checkout', { courseId: deepLinkedCourseId });
      } else if (currentUser) {
        if (currentUser.must_change_password) {
          navigateTo('first-login');
        } else if (currentUser.role === 'admin') {
          navigateTo('dashboard-admin');
        } else if (currentUser.role === 'instrutor') {
          navigateTo('dashboard-instrutor');
        } else {
          navigateTo('dashboard-aluno');
        }
      } else {
        navigateTo('landing');
      }

      // Aplica cor de destaque personalizada se definida
      if (currentUser && currentUser.school_accent_color && typeof document !== 'undefined' && document.documentElement) {
        document.documentElement.style.setProperty('--school-accent', currentUser.school_accent_color);
      }

      // 3.2 CARREGAMENTO REAL DO SUPABASE (Hydration Assíncrona e Resiliente)
      hydrateFromSupabase();
    }

    // 4. NOTIFICAÇÕES TOAST
    function showToast(msg, type='info') {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const t = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-600 border-red-500' : (type === 'success' ? 'bg-emerald-600 border-emerald-500' : 'bg-brand-600 border-brand-500');
      t.className = `${bg} text-white px-4 py-2.5 rounded-xl border text-xs font-semibold shadow-2xl transition-all duration-300 transform translate-y-0 opacity-100 flex items-center space-x-2`;
      t.innerHTML = `<span>${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateY(10px)';
        setTimeout(() => { t.remove(); }, 300);
      }, 3500);
    }

      const banner = document.createElement('div');
      banner.id = 'pwa-install-banner';

            </button>
          ` : ''}

            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      `;
      document.body.appendChild(banner);
      if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
    }

    function installPwaApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice && choice.outcome === 'accepted') {
            showToast('Aplicativo KOGNUS instalado com sucesso!', 'success');
          }
          deferredPrompt = null;
          dismissPwaBanner();
        });
      } else {
        showToast('Adicione à tela inicial através do menu do seu navegador.', 'info');
        dismissPwaBanner();
      }
    }

    function dismissPwaBanner() {
      if (typeof sessionStorage !== 'undefined') {
        sessionStorage.setItem('kognus_pwa_dismissed', 'true');
      }
      const b = document.getElementById('pwa-install-banner');
      if (b) b.remove();
    }

    // THEME TOGGLE (LIGHT / DARK) COM PERSISTÊNCIA LOCAL
    function toggleKognusTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      if (isDark) {
        html.classList.remove('dark');
        localStorage.setItem('kognus_theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('kognus_theme', 'dark');
      }
      updateThemeIcons();
    }
    window.toggleKognusTheme = toggleKognusTheme;

    function updateThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      const sunIcon = document.getElementById('theme-icon-sun');
      const moonIcon = document.getElementById('theme-icon-moon');
      if (sunIcon && moonIcon) {
        if (isDark) {
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
        } else {
          sunIcon.classList.remove('hidden');
          moonIcon.classList.add('hidden');
        }
      }
      if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
    }

    // Inicialização do tema salvo
    (function initTheme() {
      if (typeof document === 'undefined' || !document.documentElement) return;
      const saved = localStorage.getItem('kognus_theme');
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
      // Atualizar ícones após DOM carregar
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updateThemeIcons);
      } else {
        setTimeout(updateThemeIcons, 50);
      }
    })();

    function navigateTo(view, params = {}) {
      // 3. RESTRIÇÃO DE ACESSO AO CATÁLOGO PARA O INSTRUTOR (Guarda de Rotas SPA)
      if (currentUser && currentUser.role === 'instrutor') {
        if (view === 'landing' || view === 'catalog' || view === 'catalogo' || view === 'cursos') {
          view = 'dashboard-instrutor';
        }
      }

      currentView = view;
      const v = document.getElementById('app-viewport');
      if (!v) return;
      window.scrollTo(0, 0);

      const mMenu = document.getElementById('mobile-menu');
      if (mMenu && !mMenu.classList.contains('hidden')) {
        mMenu.classList.add('hidden');
      }

      // Verificação de Primeiro Acesso (Troca Obrigatória de Senha)
      if (currentUser && currentUser.must_change_password && view !== 'first-login') {
        navigateTo('first-login');
        return;
      }

      switch(view) {
        case 'landing':
          v.innerHTML = renderLandingPage();
          break;
        case 'catalog':
        case 'catalogo':
          v.innerHTML = renderLandingPage();
          setTimeout(() => { document.getElementById('catalogo')?.scrollIntoView({ behavior: 'smooth' }); }, 50);
          break;
        case 'dashboard-aluno':
        case 'aluno-dash':
          v.innerHTML = renderAlunoDashboard();
          break;
        case 'dashboard-instrutor':
        case 'creator':
        case 'instrutor-dash':
        case 'renderInstructorDashboard':
          v.innerHTML = renderCreatorPage();
          setupInstructorRealtimeListener();
          setTimeout(refreshInstructorRealMetrics, 50);
          break;
        case 'dashboard-admin':
        case 'superadmin':
        case 'admin-dash':
          v.innerHTML = renderSuperAdminPage();
          if (typeof setTimeout !== 'undefined') {
            setTimeout(renderSuperAdminCharts, 50);
          }
          break;
        case 'login':
          v.innerHTML = renderLoginPage();
          break;
        case 'register-instructor':
          v.innerHTML = renderRegisterInstructorPage();
          break;
        case 'first-login':
          v.innerHTML = renderFirstLoginPage();
          break;
        case 'checkout':
          v.innerHTML = renderCheckoutPage(params.courseId || 1);
          break;
        case 'purchase-success':
          v.innerHTML = renderPurchaseSuccessPage(params.tempPass || 'TMP-849201');
          break;
        case 'player':
          v.innerHTML = renderPlayerPage(params.courseId || 1);
          break;
        case 'certificate':

          break;
        case 'admin-expired':

    function getInstructorCourses() {
      if (!currentUser) return state.courses || [];

      const instName = currentUser.name ? currentUser.name.toLowerCase().trim() : '';
      const instSchool = currentUser.school ? currentUser.school.toLowerCase().trim() : '';

      return (state.courses || []).filter(c => {
        const cInstId = c.instructor_id || c.instructorId || '';
        if (instId && cInstId && String(cInstId) === instId) return true;
        
        const cEmail = (c.instructorEmail || '').toLowerCase().trim();
        if (instEmail && cEmail && cEmail === instEmail) return true;

        const cSchool = (c.school || '').toLowerCase().trim();
        if (instSchool && cSchool && cSchool === instSchool) return true;

        const cInst = (c.instructor || '').toLowerCase().trim();
        if (instName && cInst && (cInst === instName || cInst.includes(instName) || instName.includes(cInst))) return true;

        if (instEmail === 'instrutor@kognus.com' || instName.includes('renato')) {
          return cEmail === 'instrutor@kognus.com' || (cInst && cInst.includes('renato'));
        }

        return false;
      });
    }

    function parseCoursePrice(price) {
      if (typeof price === 'number') return isNaN(price) ? 0 : price;
      if (!price) return 0;
      let str = String(price).replace('R$', '').trim();
      if (str.includes(',') && str.includes('.')) {
        str = str.replace(/\./g, '').replace(',', '.');
      } else if (str.includes(',')) {
        str = str.replace(',', '.');
      }
      const val = parseFloat(str);
      return isNaN(val) ? 0 : val;
    }

    function formatBRL(value) {
      return (value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // REFRESH DE MÉTRICAS REAIS DO INSTRUTOR (SUPABASE + LOCAL)
    async function refreshInstructorRealMetrics() {
      const myCourses = getInstructorCourses();
      const published = myCourses.filter(c => {
        const st = (c.status || '').toLowerCase().trim();
        return st === 'published' || st === 'publicado';
      });

      let enrollmentsList = [...(state.enrollments || [])];
      if (db) {
        try {
          const { data: dbEnr, error } = await db.from('enrollments').select('*');
          if (!error && Array.isArray(dbEnr)) {
            dbEnr.forEach(item => {
              const cId = fromUuidToId(item.course_id);
              const sEmail = (item.student_email || item.studentEmail || '').toLowerCase().trim();
              const isAct = !item.status || item.status === 'active' || item.status === 'ativo';
              if (sEmail && isAct && !enrollmentsList.some(e => (e.studentEmail || '').toLowerCase().trim() === sEmail && (String(e.courseId) === String(cId) || (item.course_id && String(e.rawCourseId) === String(item.course_id))))) {
                enrollmentsList.push({ studentEmail: sEmail, courseId: cId, rawCourseId: item.course_id, status: item.status || 'active' });
              }
            });
            state.enrollments = enrollmentsList;
            try { localStorage.setItem('kognus_enrollments', JSON.stringify(enrollmentsList)); } catch(e) {}
          }
        } catch(e) {
          console.warn('[refreshInstructorRealMetrics DB warning]', e);
        }
      }

      const uniqueStudents = new Set();
      let revenueTotal = 0;
      const countedPairs = new Set();

      enrollmentsList.forEach(e => {
        const isAct = !e.status || e.status === 'active' || e.status === 'ativo';
        if (!isAct) return;
        const cIdStr = String(e.courseId);
        const rawCId = e.rawCourseId ? String(e.rawCourseId) : '';
        const match = myCourses.find(c => String(c.id) === cIdStr || (c.rawId && (String(c.rawId) === cIdStr || (rawCId && String(c.rawId) === rawCId))));
        if (match) {
          const sEmail = (e.studentEmail || '').toLowerCase().trim();
          if (sEmail) {
            uniqueStudents.add(sEmail);
            const pairKey = `${sEmail}_${match.id}`;
            if (!countedPairs.has(pairKey)) {
              countedPairs.add(pairKey);
              revenueTotal += parseCoursePrice(match.price);
            }
          }
        }
      });

      const instructorRecord = state.instructors.find(i => i.email === (currentUser?.email || ''));
      const currentStatus = instructorRecord ? instructorRecord.status : (currentUser?.status || 'ativo');
      const isLocked = (currentStatus === 'pendente' || currentStatus === 'inadimplente');

      const elStudents = document.getElementById('kpi-instructor-students');
      const elRevenue = document.getElementById('kpi-instructor-revenue');
      const elCourses = document.getElementById('kpi-instructor-courses');

      if (elStudents) {
        const count = isLocked ? 0 : uniqueStudents.size;
        elStudents.textContent = `${count} ${count === 1 ? 'aluno' : 'alunos'}`;
      }
      if (elRevenue) {
        elRevenue.textContent = isLocked ? 'R$ 0,00' : formatBRL(revenueTotal);
      }
      if (elCourses) {
        const cCount = isLocked ? 0 : published.length;
        elCourses.textContent = `${cCount} ${cCount === 1 ? 'publicado' : 'publicados'}`;
      }
    }
    window.refreshInstructorRealMetrics = refreshInstructorRealMetrics;

                  curriculum.forEach(m => { (m.lessons || []).forEach(l => acc.push({ courseId: c.id, lessonId: l.id })); });
                  return acc;
                }, []);
                if (allMyLessons.length === 0 || uniqueStudentEmails.size === 0) return '0%';
                let totalPossible = allMyLessons.length * uniqueStudentEmails.size;
                let totalDone = 0;
                uniqueStudentEmails.forEach(email => {

                  try {

    // GESTÃO DE FILTRAGEM DO CATÁLOGO POR CATEGORIAS
    let selectedCatalogCategory = 'Todas';
    window.selectedCatalogCategory = 'Todas';

    function getCatalogCategories() {
      const base = [
        "Todas",
        "Beleza & Estética",
        "Tecnologia & Programação",
        "Culinária & Gastronomia",
        "Negócios & Gestão",
        "Marketing Digital & Vendas",
        "Saúde & Fitness",
        "Design & Artes"
      ];
      const extra = [];
      if (state && state.courses) {
        state.courses.forEach(c => {
          if (c.category && !base.includes(c.category) && !extra.includes(c.category)) {
            extra.push(c.category);
          }
        });
      }
      return [...base, ...extra];
    }

    function filterCategory(categoryName) {
      selectedCatalogCategory = categoryName;
      window.selectedCatalogCategory = categoryName;
      const viewport = document.getElementById('app-viewport');
      if (viewport && currentView === 'landing') {
        viewport.innerHTML = renderLandingPage();
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      } else {
        navigateTo('landing');
      }
    }

    // TELA 1: LANDING PAGE & CATÁLOGO
    function renderLandingPage() {
      const isStudentEnrolled = (courseId) => {
        if (!currentUser) return false;
        return state.enrollments.some(e => e.studentEmail === currentUser.email && e.courseId === courseId);
      };

      const categories = getCatalogCategories();

      const filteredCourses = state.courses.filter(course => {
        // Regra de Exibição no Catálogo/Vitrine Pública:
        // Apenas cursos com status === 'published' (ou 'Publicado') são visíveis para novos visitantes e no catálogo geral
        const isPublished = !course.status || course.status.toLowerCase() === 'published' || course.status.toLowerCase() === 'publicado';
        if (!isPublished) return false;

        if (!selectedCatalogCategory || selectedCatalogCategory === 'Todas') return true;
        const cCat = (course.category || '').toLowerCase().trim();
        const sCat = selectedCatalogCategory.toLowerCase().trim();

        if (cCat === sCat) return true;

        if (sCat === 'beleza & estética' && (cCat.includes('beleza') || cCat.includes('colorimetria') || cCat.includes('estética'))) return true;
        if (sCat === 'negócios & gestão' && (cCat.includes('negócios') || cCat.includes('gestão') || cCat.includes('finanças'))) return true;
        if (sCat === 'tecnologia & programação' && (cCat.includes('tecnologia') || cCat.includes('programação') || cCat.includes('software'))) return true;
        if (sCat === 'culinária & gastronomia' && (cCat.includes('culinária') || cCat.includes('gastronomia'))) return true;
        if (sCat === 'marketing digital & vendas' && (cCat.includes('marketing') || cCat.includes('vendas'))) return true;
        if (sCat === 'saúde & fitness' && (cCat.includes('saúde') || cCat.includes('fitness') || cCat.includes('bem-estar'))) return true;
        if (sCat === 'design & artes' && (cCat.includes('design') || cCat.includes('audiovisual') || cCat.includes('artes') || cCat.includes('música'))) return true;

        return false;
      });

      return `
        <div class="space-y-12">
          <!-- Hero Section -->
          <div class="text-center max-w-3xl mx-auto space-y-4 pt-6">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-brand-500/30 bg-brand-500/10 text-brand-400 text-xs font-bold">
              SAAS DE ENSINO & MARKETPLACE INTEGRADO
            </div>
            <h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-tight">
              Aprenda com mestres.<br>
              <span class="bg-gradient-to-r from-brand-400 via-indigo-400 to-violet-500 bg-clip-text text-transparent">Monetize com escala.</span>
            </h1>
            <p class="text-zinc-400 text-base">SaaS Puro: 0% de comissões sobre suas vendas. Mensalidade fixa de apenas R$ 89,90/mês para manter sua escola ativa com alunos e cursos ilimitados.</p>
            <div class="flex justify-center gap-4 pt-2">
              <button onclick="document.getElementById('catalogo')?.scrollIntoView({ behavior: 'smooth' });" class="bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs px-6 py-3 rounded-xl transition shadow-lg shadow-brand-600/30">
                Conhecer Cursos
              </button>
              <button onclick="navigateTo('register-instructor')" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-xs px-6 py-3 rounded-xl border border-darkBorder transition">
                Criar Minha Escola
              </button>
            </div>
          </div>

          <!-- Grade de Cursos / Catálogo -->
          <div id="catalogo" class="pt-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-3 mb-6">
              <div>
                <h2 class="text-xl font-bold text-white">Catálogo de Cursos Oficiais</h2>
                <p class="text-xs text-zinc-400 mt-1">Cursos práticos ministrados por instrutores certificados na plataforma KOGNUS.</p>
              </div>
              <span class="text-xs text-zinc-400 bg-zinc-900 border border-darkBorder px-3 py-1.5 rounded-lg">
                Exibindo: <strong class="text-brand-400">${filteredCourses.length}</strong> de ${state.courses.length} cursos
              </span>
            </div>

            <!-- Barra de Filtros por Categoria -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-2 mb-6 -mx-1 px-1">
              ${categories.map(cat => {
                const isActive = selectedCatalogCategory === cat;
                return `
                  <button onclick="filterCategory('${cat}')" class="whitespace-nowrap px-4 py-2 rounded-xl text-xs transition min-h-[38px] flex items-center gap-1.5 ${
                    isActive 
                      ? 'bg-brand-600 text-white font-bold shadow-md shadow-brand-600/30 ring-1 ring-brand-400' 
                      : 'bg-zinc-900 text-zinc-400 hover:text-white hover:bg-zinc-800 border border-darkBorder font-medium'
                  }">
                    ${cat}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Grade de Cursos Filtrada -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
              ${filteredCourses.length > 0 ? filteredCourses.map(course => {
                const enrolled = isStudentEnrolled(course.id);
                return `
                  <div class="bg-darkCard border ${enrolled ? 'border-emerald-500/40' : 'border-darkBorder'} rounded-2xl overflow-hidden flex flex-col justify-between shadow-xl transition hover:border-zinc-700">
                    <div class="relative">
                      <img src="${course.image}" alt="${course.title}" class="h-52 w-full object-cover ${!enrolled ? 'brightness-75' : ''}">
                      <span class="absolute top-3 left-3 text-[10px] font-bold px-2.5 py-1 rounded bg-brand-600 text-white uppercase tracking-wider">${course.category}</span>
                      ${enrolled 
                        ? `<span class="absolute top-3 right-3 text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-500 text-white shadow-md">✓ Matriculado</span>` 
                        : `<div class="absolute inset-0 flex items-center justify-center pointer-events-none"><div class="bg-black/75 p-3 rounded-full border border-zinc-700 text-white shadow-lg"><i data-lucide="lock" class="w-6 h-6"></i></div></div>`
                      }
                    </div>
                    <div class="p-6 flex-1 flex flex-col justify-between">
                      <div>
                        <div class="text-[11px] font-semibold text-brand-400 mb-1">${course.school}</div>
                        <h3 class="font-bold text-lg text-white leading-snug">${course.title}</h3>
                        <p class="text-xs text-zinc-400 mt-2 leading-relaxed">${course.description}</p>
                        <p class="text-xs text-zinc-500 mt-3 flex items-center gap-1.5"><i data-lucide="user" class="w-3.5 h-3.5"></i> Instrutor: ${course.instructor}</p>
                      </div>
                      <div class="mt-6 pt-4 border-t border-darkBorder flex items-center justify-between">
                        <div>
                          ${enrolled 
                            ? `<span class="text-xs font-semibold text-emerald-400 flex items-center gap-1"><i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Acesso Liberado</span>` 
                            : `<span class="text-lg font-black text-white">R$ ${course.price}</span>`
                          }
                        </div>
                        <div>
                          ${enrolled 
                            ? `<button onclick="navigateTo('player', { courseId: '${course.id}' })" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2.5 rounded-lg font-bold flex items-center gap-1.5 transition">
                                 Acessar Sala de Aula <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                               </button>`
                            : `<button onclick="navigateTo('checkout', { courseId: '${course.id}' })" class="bg-brand-600 hover:bg-brand-500 text-white text-xs px-4 py-2.5 rounded-lg font-bold flex items-center gap-1.5 transition shadow-lg shadow-brand-600/30">
                                 Matricular-se <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                               </button>`
                          }
                        </div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('') : `
                <div class="col-span-full p-12 text-center bg-darkCard border border-darkBorder rounded-2xl space-y-3">
                  <div class="w-12 h-12 rounded-full bg-zinc-800/80 border border-darkBorder flex items-center justify-center mx-auto text-zinc-400">
                    <i data-lucide="inbox" class="w-6 h-6"></i>
                  </div>
                  <h3 class="text-base font-bold text-white">Nenhum curso encontrado nesta categoria no momento.</h3>
                  <p class="text-xs text-zinc-400 max-w-sm mx-auto">Explore outras categorias ou volte para "Todas" para ver os cursos disponíveis.</p>
                  <button onclick="filterCategory('Todas')" class="mt-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow-md shadow-brand-600/20">
                    Ver Todos os Cursos
                  </button>
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // TELA 2: CHECKOUT SIMPLIFICADO DO ALUNO

      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId) || state.courses[0];

                  <i data-lucide="shield-check" class="w-5 h-5"></i> Ir para Pagamento Seguro • R$ ${course.price}
                </button>

    // =========================================================================
    // NAVEGAÇÃO DE AULAS E AVALIAÇÕES INTERATIVAS COM CORREÇÃO AUTOMÁTICA
    // =========================================================================
    function getCourseFlattenedLessons(course) {
      if (!course || !course.modules) return [];
      return course.modules.flatMap(m => m.lessons || []);
    }

    function getNextLesson(courseId, currentLessonId) {
      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId);
      if (!course) return null;
      const flat = getCourseFlattenedLessons(course);
      const currIdx = flat.findIndex(l => l.id == currentLessonId || String(l.id) === String(currentLessonId) || l.rawId === currentLessonId);
      if (currIdx >= 0 && currIdx < flat.length - 1) {
        return flat[currIdx + 1];
      }
      return null;
    }

    function getPrevLesson(courseId, currentLessonId) {
      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId);
      if (!course) return null;
      const flat = getCourseFlattenedLessons(course);
      const currIdx = flat.findIndex(l => l.id == currentLessonId || String(l.id) === String(currentLessonId) || l.rawId === currentLessonId);
      if (currIdx > 0) {
        return flat[currIdx - 1];
      }
      return null;
    }

    function goToNextLesson(courseId) {
      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId) || state.courses[0];
      if (!course) return;
      const activeLesson = selectedLesson || (course.modules[0] ? course.modules[0].lessons[0] : null);
      if (!activeLesson) return;

      const isQuiz = activeLesson.type === 'quiz' || (activeLesson.quiz_data && activeLesson.quiz_data.length > 0);
      const isDone = completedLessons.some(id => String(id) === String(activeLesson.id) || String(id) === String(activeLesson.rawId));
      if (isQuiz && !isDone) {
        showToast('Navegação bloqueada: Complete a avaliação com 100% de acerto para liberar a próxima aula.', 'warning');
        return;
      }

      const next = getNextLesson(course.id, activeLesson.id);
      if (next) {
        selectedLesson = next;
        navigateTo('player', { courseId: course.id });
      } else {
        showToast('Parabéns! Você já concluiu todas as aulas deste curso!', 'success');
      }
    }
    window.goToNextLesson = goToNextLesson;

    function goToPrevLesson(courseId) {
      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId) || state.courses[0];
      if (!course) return;
      const activeLesson = selectedLesson || (course.modules[0] ? course.modules[0].lessons[0] : null);
      if (!activeLesson) return;

      const prev = getPrevLesson(course.id, activeLesson.id);
      if (prev) {
        selectedLesson = prev;
        navigateTo('player', { courseId: course.id });
      } else {
        showToast('Você já está na primeira aula do curso.', 'info');
      }
    }
    window.goToPrevLesson = goToPrevLesson;

    function handleStudentQuizOptionSelect(lessonId, questionIndex, optionIndex, courseId) {
      window.__studentQuizState = window.__studentQuizState || {};
      const lKey = String(lessonId);
      if (!window.__studentQuizState[lKey]) {
        window.__studentQuizState[lKey] = { answers: {}, submitted: false, score: 0, total: 0, passed: false };
      }
      if (window.__studentQuizState[lKey].submitted && window.__studentQuizState[lKey].passed) {
        return;
      }
      window.__studentQuizState[lKey].answers[questionIndex] = optionIndex;
      
      const v = document.getElementById('app-viewport');
      if (v && currentView === 'player') {
        v.innerHTML = renderPlayerPage(courseId);
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      }
    }
    window.handleStudentQuizOptionSelect = handleStudentQuizOptionSelect;

    async function handleStudentQuizSubmit(courseId, lessonId) {
      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId) || state.courses[0];
      if (!course) return;
      const flat = getCourseFlattenedLessons(course);
      const targetLesson = flat.find(l => String(l.id) === String(lessonId) || (l.rawId && String(l.rawId) === String(lessonId)));
      if (!targetLesson || !targetLesson.quiz_data) return;

      const questions = targetLesson.quiz_data;
      const lKey = String(lessonId);
      window.__studentQuizState = window.__studentQuizState || {};
      if (!window.__studentQuizState[lKey]) {
        window.__studentQuizState[lKey] = { answers: {}, submitted: false, score: 0, total: questions.length, passed: false };
      }
      const qState = window.__studentQuizState[lKey];

      // Validação: todas as questões respondidas
      for (let i = 0; i < questions.length; i++) {
        if (qState.answers[i] === undefined) {
          showToast(`Por favor, responda a Questão ${i + 1} antes de enviar as respostas.`, 'warning');
          return;
        }
      }

      // Correção automática com nota de corte configurável
      let correctCount = 0;
      questions.forEach((q, idx) => {
        if (qState.answers[idx] === q.correctIndex) {
          correctCount++;
        }
      });

      const totalQuestions = questions.length;
      const scorePercentage = Math.round((correctCount / totalQuestions) * 100);
      // Nota mínima configurada pelo instrutor (padrão 100% se não definida)
      const minGrade = Number(targetLesson.min_grade) || 100;
      const isPassed = scorePercentage >= minGrade;

      qState.submitted = true;
      qState.score = correctCount;
      qState.scorePercent = scorePercentage;
      qState.total = totalQuestions;
      qState.minGrade = minGrade;
      qState.passed = isPassed;

      if (isPassed) {
        // Marca aula como concluída localmente
        if (!completedLessons.some(id => String(id) === String(targetLesson.id) || String(id) === String(targetLesson.rawId))) {
          completedLessons.push(targetLesson.id);
        }
        if (currentUser && currentUser.email) {
          try {
            localStorage.setItem('kognus_completed_lessons_' + currentUser.email, JSON.stringify(completedLessons));
          } catch(e) {}
        }

        // Persistência no Supabase (lesson_progress)
        if (db && currentUser && currentUser.email) {
          try {
            const cleanEmail = currentUser.email.toLowerCase().trim();
            const cUuid = ensureUUID(course.rawId || course.id, '00000000-0000-0000-0000-');
            const lUuid = ensureUUID(targetLesson.rawId || targetLesson.id, '00000000-0000-0000-0002-');
            const qP = db.from('lesson_progress');
            if (qP && typeof qP.upsert === 'function') {
              await qP.upsert({
                student_email: cleanEmail,
                course_id: cUuid,
                lesson_id: lUuid,
                completed: true,
                completed_at: new Date().toISOString()
              }, { onConflict: 'student_email,lesson_id' });
            }
          } catch(e) {
            console.warn('[Quiz Progress Supabase Exception]', e);
          }
        }

        showToast(`🎉 Parabéns! Você foi aprovado com ${scorePercentage}% de aproveitamento!`, 'success');
      } else {
        showToast(`Você obteve ${scorePercentage}% (mínimo exigido: ${minGrade}%). Revise e tente novamente!`, 'warning');
      }

      const v = document.getElementById('app-viewport');
      if (v && currentView === 'player') {
        v.innerHTML = renderPlayerPage(course.id);
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      }
    }
    window.handleStudentQuizSubmit = handleStudentQuizSubmit;

    function handleStudentQuizRetry(courseId, lessonId) {
      const lKey = String(lessonId);
      if (window.__studentQuizState && window.__studentQuizState[lKey]) {
        window.__studentQuizState[lKey].submitted = false;
        window.__studentQuizState[lKey].answers = {};
        window.__studentQuizState[lKey].passed = false;
      }
      const v = document.getElementById('app-viewport');
      if (v && currentView === 'player') {
        v.innerHTML = renderPlayerPage(courseId);
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      }
    }
    window.handleStudentQuizRetry = handleStudentQuizRetry;

    function renderQuizPlayerHtml(course, activeLesson) {

      const lessonIdStr = String(activeLesson.id);
      const isLessonDone = completedLessons.some(id => String(id) === lessonIdStr || String(id) === String(activeLesson.rawId));
      
      if (!window.__studentQuizState[lessonIdStr]) {
        window.__studentQuizState[lessonIdStr] = {
          answers: {},
          submitted: isLessonDone,
          score: isLessonDone && activeLesson.quiz_data ? activeLesson.quiz_data.length : 0,
          total: activeLesson.quiz_data ? activeLesson.quiz_data.length : 0,
          passed: isLessonDone
        };

      const qState = window.__studentQuizState[lessonIdStr];
      const questions = activeLesson.quiz_data || [];
      const nextLesson = getNextLesson(course.id, activeLesson.id);
      // Nota mínima configurada pelo instrutor (padrão 100%)
      const minGrade = Number(activeLesson.min_grade) || 100;
      // Percentual obtido (pode estar no estado se já submeteu)
      const scorePercent = qState.scorePercent !== undefined ? qState.scorePercent
        : (qState.passed ? 100 : (qState.submitted ? Math.round((qState.score / (qState.total || 1)) * 100) : 0));

      if (questions.length === 0) {
        return `
          <div class="bg-darkCard border border-darkBorder rounded-2xl p-8 text-center space-y-3">
            <div class="w-12 h-12 rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/20 flex items-center justify-center mx-auto">
              <i data-lucide="help-circle" class="w-6 h-6"></i>

            <h3 class="text-lg font-bold text-white">${activeLesson.title}</h3>

          </div>

      return `

          <!-- Cabeçalho da Avaliação -->
          <div class="border-b border-darkBorder pb-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30 uppercase tracking-wider mb-1.5">
                <i data-lucide="award" class="w-3.5 h-3.5 text-purple-400"></i> Avaliação Interativa • Questionário Oficial
              </span>
              <h2 class="text-xl sm:text-2xl font-black text-white">${activeLesson.title}</h2>
              <p class="text-xs text-zinc-400 mt-1">Responda a todas as questões. Para ser aprovado e liberar a próxima aula, é necessário obter <strong class="text-emerald-400">${minGrade}% de aproveitamento</strong>. Tentativas ilimitadas.</p>
            </div>
            <div class="shrink-0 text-right space-y-1">
              <span class="text-xs font-mono font-bold px-3 py-1.5 rounded-lg bg-zinc-900 border border-darkBorder text-zinc-300 block">
                ${questions.length} ${questions.length === 1 ? 'Questão' : 'Questões'}
              </span>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/30 block text-center">
                Nota mín.: ${minGrade}%
              </span>
            </div>
          </div>

          <!-- Feedback de Correção (após submissão) -->
          ${qState.submitted ? (
            qState.passed ? `
              <div class="p-6 bg-gradient-to-r from-emerald-500/20 via-teal-500/15 to-emerald-500/20 border-2 border-emerald-500/60 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-5 shadow-2xl shadow-emerald-500/10">
                <div class="flex items-center gap-4">
                  <div class="p-3.5 bg-emerald-500/20 text-emerald-400 rounded-2xl border border-emerald-500/40 shrink-0">
                    <i data-lucide="check-circle-2" class="w-8 h-8"></i>
                  </div>
                  <div>
                    <span class="text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded-full uppercase tracking-wider">Aprovado • ${scorePercent}% de Aproveitamento</span>
                    <h4 class="font-black text-white text-base sm:text-lg mt-1">🎉 Parabéns! Você foi aprovado com ${scorePercent}% de aproveitamento!</h4>
                    <p class="text-xs text-emerald-300/90 mt-0.5">Nota registrada. A navegação para a próxima aula foi desbloqueada.</p>
                  </div>
                </div>
                <div class="flex items-center gap-2 self-stretch sm:self-auto justify-end">
                  <button onclick="handleStudentQuizRetry('${course.id}', '${activeLesson.id}')" class="min-h-[44px] px-4 py-2.5 rounded-xl border border-darkBorder text-zinc-400 hover:text-white hover:bg-zinc-800 text-xs font-semibold transition" title="Refazer avaliação para praticar">
                    Refazer Teste
                  </button>
                  ${nextLesson ? `
                    <button onclick="goToNextLesson('${course.id}')" class="min-h-[44px] bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-black text-xs px-5 py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/30 flex items-center justify-center gap-2 transform hover:scale-[1.02]">
                      <span>Próxima Aula</span>
                      <i data-lucide="arrow-right" class="w-4 h-4"></i>

                  ` : `

                          <i data-lucide="x" class="w-3.5 h-3.5"></i> Incorreta

                      `
                    ) : ''}
                  </div>

                  <!-- Alternativas -->
                  <div class="space-y-2.5 pt-1">
                    ${(q.options || []).map((opt, optIdx) => {
                      const isChecked = selectedOpt === optIdx;
                      let optStyle = 'border-darkBorder bg-zinc-900/60 hover:bg-zinc-850 hover:border-zinc-700 text-zinc-300';
                      
                      if (isQuestionEvaluated) {
                        if (optIdx === q.correctIndex) {
                          optStyle = 'border-emerald-500/60 bg-emerald-500/15 text-emerald-200 font-semibold shadow-sm';
                        } else if (isChecked && optIdx !== q.correctIndex) {
                          optStyle = 'border-red-500/60 bg-red-500/15 text-red-300 font-semibold';
                        } else {
                          optStyle = 'border-darkBorder/40 bg-zinc-900/30 text-zinc-500 opacity-60';
                        }
                      } else if (isChecked) {
                        optStyle = 'border-brand-500 bg-brand-500/20 text-white font-semibold ring-1 ring-brand-500 shadow-md shadow-brand-500/10';
                      }

                      return `
                        <label onclick="${!qState.submitted ? `handleStudentQuizOptionSelect('${activeLesson.id}', ${qIdx}, ${optIdx}, '${course.id}')` : ''}" class="flex items-center justify-between p-3.5 rounded-xl border ${optStyle} ${!qState.submitted ? 'cursor-pointer' : 'cursor-default'} transition text-xs sm:text-sm">

                            <div class="w-5 h-5 rounded-full border ${isChecked ? 'border-brand-400 bg-brand-600' : 'border-zinc-600 bg-zinc-900'} flex items-center justify-center shrink-0">

                            </div>
                            <span>${opt}</span>
                          </div>
                          ${isQuestionEvaluated && optIdx === q.correctIndex ? `
                            <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1 shrink-0 ml-2">
                              <i data-lucide="check" class="w-3.5 h-3.5"></i> Gabarito
                            </span>
                          ` : ''}
                        </label>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- Barra Inferior de Envio -->
          ${!qState.submitted ? `
            <div class="pt-6 border-t border-darkBorder flex flex-col sm:flex-row justify-between items-center gap-4">
              <p class="text-xs text-zinc-400 text-center sm:text-left">

              </p>
              <button onclick="handleStudentQuizSubmit('${course.id}', '${activeLesson.id}')" class="w-full sm:w-auto min-h-[48px] bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs px-8 py-3 rounded-xl transition shadow-xl shadow-brand-600/30 flex items-center justify-center gap-2 transform hover:scale-[1.02]">
                <i data-lucide="send" class="w-4 h-4"></i> Enviar Respostas para Avaliação
              </button>
            </div>
          ` : ''}

      `;
    }

    // TELA 8: PLAYER LMS MODERNO (COM ACORDEÃO E SUPORTE COMPLETO A QUIZZES)

      const course = state.courses.find(c => c.id == courseId || String(c.id) === String(courseId) || c.rawId === courseId) || state.courses[0];
      const activeLesson = selectedLesson || (course.modules[0] ? course.modules[0].lessons[0] : null);

      // 1. Contagem Dinâmica de Aulas
      const totalLessons = (course.modules || []).reduce((acc, m) => acc + (m.lessons ? m.lessons.length : 0), 0);
      const courseLessonIds = (course.modules || []).flatMap(m => (m.lessons || []).map(l => l.id));
      const courseLessonRawIds = (course.modules || []).flatMap(m => (m.lessons || []).map(l => l.rawId || l.id));

      // 2. Aulas Concluídas pelo Aluno
      const completedLessonsCount = completedLessons.filter(lId => 
        courseLessonIds.some(cId => String(cId) === String(lId)) || 
        courseLessonRawIds.some(cId => String(cId) === String(lId))
      ).length;

      // 3. Porcentagem de progresso
      const progressPercent = totalLessons > 0 ? Math.round((completedLessonsCount / totalLessons) * 100) : 0;
      const progressPct = progressPercent;

      const isQuizLesson = activeLesson && (activeLesson.type === 'quiz' || (activeLesson.quiz_data && activeLesson.quiz_data.length > 0));
      const isLessonCompleted = activeLesson && completedLessons.some(id => String(id) === String(activeLesson.id) || String(id) === String(activeLesson.rawId));
      const isNextBlocked = isQuizLesson && !isLessonCompleted;

                  <button onclick="goToPrevLesson('${course.id}')" class="min-h-[40px] px-4 py-2 rounded-xl border border-darkBorder text-zinc-300 hover:text-white hover:bg-zinc-800 text-xs font-semibold transition flex items-center gap-2 ${!prevLesson ? 'opacity-40 cursor-not-allowed' : ''}">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> ← Aula Anterior

                  <div class="text-[11px] text-zinc-500 hidden sm:block">
                    Sala de Estudos KOGNUS
                  </div>

                  ${isNextBlocked ? `
                    <button disabled class="min-h-[40px] bg-zinc-850 text-zinc-500 border border-darkBorder/60 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 cursor-not-allowed opacity-60 shadow-inner" title="Acerte 100% das questões do questionário para liberar a próxima aula">
                      <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-400"></i> Próxima Aula → (Bloqueada)

                  ` : `
                    <button onclick="goToNextLesson('${course.id}')" class="min-h-[40px] bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition shadow-lg shadow-indigo-600/30 ${!nextLesson ? 'opacity-50' : ''}">

            <!-- ============================================================ -->
            <!-- COLUNA LATERAL (DIREITA - lg:col-span-4): GRADE & SUPORTE     -->

                      <i data-lucide="layers" class="w-4 h-4 text-indigo-400"></i> Grade Curricular do Curso

                    <span class="text-[10px] font-mono font-bold px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                      ${completedLessonsCount}/${totalLessons} • ${progressPercent}%

                  <!-- Barra de progresso compacta -->
                  <div class="w-full bg-zinc-800 rounded-full h-1.5 overflow-hidden">

                  <!-- Acordeão de Módulos -->

                    ${course.modules.map(mod => {
                      const isOpen = openAccordionModules[mod.id] !== false;
                      const modCompletedCount = (mod.lessons || []).filter(l => completedLessons.some(id => String(id) === String(l.id) || String(id) === String(l.rawId || l.id))).length;
                      return `

                      ${waLink ? `
                        <a href="${waLink}" target="_blank" rel="noopener noreferrer" class="w-full min-h-[40px] bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl flex items-center justify-center gap-2 transition shadow-lg shadow-emerald-600/30">
                          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.832-1.438A9.955 9.955 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18a8 8 0 01-4.264-1.227l-.306-.182-2.87.852.852-2.87-.182-.306A8 8 0 1112 20z"/></svg>

    // TELA 9: CERTIFICADO DE CONCLUSÃO OFICIAL (A4 LANDSCAPE DE ALTO PADRÃO)
    function renderCertificatePage(courseId) {
      const course = state.courses.find(c => c.id === courseId || String(c.id) === String(courseId)) || state.courses[0];
      const certConfig = getCourseCertificateConfig(course);
      const studentName = currentUser ? currentUser.name : "Lucas Mendes de Souza";
      const authCode = 'AUTH-KOGNUS-#KOG-' + Math.floor(100000 + Math.random() * 900000) + '-BR';
      const emissionDate = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });

      const tpl = certConfig.template || 'classic';
      const isModern = tpl === 'modern';
      const isCorporate = tpl === 'corporate';
      const isClassic = !isModern && !isCorporate;

      // Estilos temáticos de moldura e tipografia
      let outerBorderClass = 'border-amber-500/70 dark:border-amber-500/60 shadow-amber-500/10';
      let innerBorderClass = 'border-amber-500/30 dark:border-amber-500/25';
      let titleClass = 'cert-title-classic font-serif font-black tracking-widest text-amber-500 dark:text-amber-300';
      let titleText = 'Certificado de Conclusão';
      let studentFontClass = 'font-serif font-black text-zinc-900 dark:text-white';
      let cornerColor = 'text-amber-500';
      let badgeThemeClass = 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/20';
      let authBadgeClass = 'text-amber-700 dark:text-amber-300 bg-amber-500/10 border-amber-500/30';
      let dividerColor = 'bg-gradient-to-r from-transparent via-amber-500 to-transparent';

      if (isModern) {
        outerBorderClass = 'border-brand-500/70 dark:border-brand-500/60 shadow-brand-500/15';

    function fillLogin(email, pass) {
      const e = document.getElementById('login-email');
      const p = document.getElementById('login-password');
      if (e) e.value = email;
      if (p) p.value = pass;
