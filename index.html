  <!-- JAVASCRIPT GLOBAL -->

    // 1. SUPABASE CLIENT & FALLBACK RESILIENTE

    try {

    // 2. ESTADO GLOBAL DA APLICAÇÃO

    let currentView = 'landing';

    // Banco de Dados Seed Local / Contingência

                { id: 4, title: "04. Matização com Pigmentos Puros e Brilho Espelhado", duration: "19 min", youtubeId: "dQw4w9WgXcQ", pdf: "Guia_Matizacao_Final.pdf" }

                { id: 6, title: "02. Calculadora de Lucro Líquido", duration: "20 min", youtubeId: "dQw4w9WgXcQ", pdf: "Calculadora_Preco_Sugerido.pdf" }

    };

    // 3. INICIALIZAÇÃO DA APLICAÇÃO
    function initApp() {
      const savedSession = localStorage.getItem('kognus_session');
      if (savedSession) {
        try {
          currentUser = JSON.parse(savedSession);
        } catch(e) {
          currentUser = null;
          localStorage.removeItem('kognus_session');
        }
      } else {
        currentUser = null;
      }

      renderHeader();
      if (currentUser) {
        if (currentUser.must_change_password) {
          navigateTo('first-login');
        } else if (currentUser.role === 'admin') {
          navigateTo('superadmin');
        } else if (currentUser.role === 'instrutor') {
          navigateTo('creator');
        } else {
          navigateTo('landing');
        }
      } else {
        navigateTo('landing');
      }
    }

    // 4. NOTIFICAÇÕES TOAST
    function showToast(msg, type='info') {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const t = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-600 border-red-500' : (type === 'success' ? 'bg-emerald-600 border-emerald-500' : 'bg-brand-600 border-brand-500');
      t.className = `${bg} text-white px-4 py-2.5 rounded-xl border text-xs font-semibold shadow-2xl transition-all duration-300 transform translate-y-0 opacity-100 flex items-center space-x-2`;
      t.innerHTML = `<span>${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateY(10px)';
        setTimeout(() => { t.remove(); }, 300);
      }, 3500);
    }

    // 5. ATUALIZAÇÃO DO CABEÇALHO GLOBAL (HEADER)
    function renderHeader() {
      const navLinks = document.getElementById('nav-links');
      const userArea = document.getElementById('nav-user-area');
      if (!navLinks || !userArea) return;

      if (!currentUser) {
        // --- ESTADO DESLOGADO (VISITANTE) ---
        navLinks.innerHTML = `
          <button onclick="navigateTo('landing')" class="hover:text-white transition">Início</button>
          <button onclick="navigateTo('landing'); setTimeout(() => { document.getElementById('catalogo')?.scrollIntoView({ behavior: 'smooth' }); }, 50);" class="hover:text-white transition">Cursos / Catálogo</button>
          <button onclick="navigateTo('register-instructor')" class="hover:text-white transition">Para Instrutores</button>
        `;

        userArea.innerHTML = `
          <button onclick="navigateTo('login')" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold px-4 py-2 rounded-lg border border-darkBorder transition">
            Entrar
          </button>
          <button onclick="navigateTo('register-instructor')" class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow-lg shadow-brand-600/30">
            Criar Minha Escola
          </button>
        `;
      } else {
        // --- ESTADO LOGADO ---
        let roleBadge = currentUser.role === 'admin' ? 'SuperAdmin' : (currentUser.role === 'instrutor' ? 'Instrutor' : 'Aluno');
        let roleColor = currentUser.role === 'admin' 
          ? 'bg-red-500/20 text-red-400 border-red-500/30' 
          : (currentUser.role === 'instrutor' ? 'bg-brand-500/20 text-brand-400 border-brand-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30');

        if (currentUser.role === 'aluno') {
          navLinks.innerHTML = `
            <button onclick="navigateTo('landing')" class="hover:text-white transition">Catálogo</button>
            <button onclick="navigateTo('player', { courseId: 1 })" class="hover:text-white transition">Meus Cursos / Sala de Aula</button>
          `;
        } else if (currentUser.role === 'instrutor') {
          navLinks.innerHTML = `
            <button onclick="navigateTo('landing')" class="hover:text-white transition">Catálogo</button>
            <button onclick="navigateTo('creator')" class="hover:text-white transition">Creator Studio</button>
            <button onclick="navigateTo('creator'); setTimeout(() => { document.getElementById('secao-escola')?.scrollIntoView({ behavior: 'smooth' }); }, 50);" class="hover:text-white transition">Minha Escola</button>
          `;
        } else if (currentUser.role === 'admin') {
          navLinks.innerHTML = `
            <button onclick="navigateTo('superadmin')" class="hover:text-white transition">Visão Geral SaaS</button>
            <button onclick="navigateTo('superadmin'); setTimeout(() => { document.getElementById('gestao-escolas')?.scrollIntoView({ behavior: 'smooth' }); }, 50);" class="hover:text-white transition">Gestão de Escolas</button>
          `;
        }

        userArea.innerHTML = `
          <div class="flex items-center space-x-3 bg-zinc-900/80 border border-darkBorder px-3 py-1.5 rounded-xl">
            <div class="w-8 h-8 rounded-full bg-brand-600 flex items-center justify-center font-bold text-xs text-white uppercase shadow-inner">
              ${(currentUser.name || 'U').charAt(0).toUpperCase()}
            </div>
            <div class="text-left hidden sm:block">
              <p class="text-xs font-bold text-white leading-tight">${currentUser.name || 'Usuário'}</p>

    // 6. ROTEADOR DE TELAS SPA
    function navigateTo(view, params = {}) {
      currentView = view;
      const v = document.getElementById('app-viewport');
      if (!v) return;
      window.scrollTo(0, 0);

      // Verificação de Primeiro Acesso (Troca Obrigatória de Senha)
      if (currentUser && currentUser.must_change_password && view !== 'first-login') {
        navigateTo('first-login');
        return;
      }

      switch(view) {
        case 'landing':
          v.innerHTML = renderLandingPage();
          break;
        case 'login':
          v.innerHTML = renderLoginPage();
          break;
        case 'register-instructor':
          v.innerHTML = renderRegisterInstructorPage();
          break;
        case 'first-login':
          v.innerHTML = renderFirstLoginPage();
          break;
        case 'checkout':
          v.innerHTML = renderCheckoutPage(params.courseId || 1);
          break;
        case 'purchase-success':
          v.innerHTML = renderPurchaseSuccessPage(params.tempPass || 'TMP-849201');
          break;
        case 'player':
          v.innerHTML = renderPlayerPage(params.courseId || 1);
          break;
        case 'certificate':
          v.innerHTML = renderCertificatePage(params.courseId || 1);
          break;
        case 'creator':
          v.innerHTML = renderCreatorPage();
          break;
        case 'superadmin':
          v.innerHTML = renderSuperAdminPage();
          break;
        case 'admin-expired':
          v.innerHTML = renderAdminExpiredPage();
          break;
        default:
          v.innerHTML = renderLandingPage();
      }

      if (window.lucide) lucide.createIcons();
    }

    // 7. CICLO DE VIDA DO LOGOUT RIGOROSO
    function logout() {
      // 1. Limpeza de storage
      localStorage.removeItem('kognus_session');
      sessionStorage.clear();
      // 2. Redefinição da variável global
      currentUser = null;
      // 3. Re-renderização imediata do Header
      renderHeader();
      // 4. Redirecionamento para a Landing Page
      navigateTo('landing');
      // 5. Toast de confirmação
      showToast('Sessão encerrada com sucesso.', 'info');
    }

            <div class="flex justify-center gap-4 pt-2">

                Conhecer Cursos
              </button>

                Criar Minha Escola

          </div>

          <!-- Grade de Cursos / Catálogo -->

                <h2 class="text-xl font-bold text-white">Catálogo de Cursos Oficiais</h2>

              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
              ${state.courses.map(course => {
                const enrolled = isStudentEnrolled(course.id);
                return `
                  <div class="bg-darkCard border ${enrolled ? 'border-emerald-500/40' : 'border-darkBorder'} rounded-2xl overflow-hidden flex flex-col justify-between shadow-xl transition hover:border-zinc-700">

                      }
                    </div>
                    <div class="p-6 flex-1 flex flex-col justify-between">
                      <div>

    // =========================================================================

    function fillLogin(email, pass) {
      const e = document.getElementById('login-email');
      const p = document.getElementById('login-password');
      if (e) e.value = email;
      if (p) p.value = pass;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();

      // Tentativa de consulta Supabase
      if (db) {
        try {
          const { data, error } = await db.from('users').select('*').eq('email', email).single();
          if (data && data.password_hash === pass) {
            loginUserSuccess(data);
            return;
          }
        } catch(err) {
          console.warn('[Supabase] Consulta falhou, acionando fallback.');
        }
      }

      // Autenticação local de contingência
      if (email === 'admin@kognus.com' && pass === 'admin123') {
        loginUserSuccess({ id: 'adm_1', name: 'Administrador Kognus', email, role: 'admin' });
      } else if (email === 'instrutor@kognus.com' && pass === '123456') {
        loginUserSuccess({ id: 'inst_1', name: 'Prof. Renato Mestre', email, role: 'instrutor' });
      } else if (email === 'aluno@kognus.com' && pass === '123456') {
        loginUserSuccess({ id: 'alu_1', name: 'Lucas Mendes', email, role: 'aluno', must_change_password: false });
      } else if (pass.startsWith('TMP-')) {
        loginUserSuccess({ id: 'alu_tmp', name: 'Aluno Recente', email, role: 'aluno', must_change_password: true });
      } else {
        showToast('Credenciais incorretas! Tente as contas de teste rápidas.', 'error');
      }
    }

    function loginUserSuccess(user) {
      currentUser = user;
      localStorage.setItem('kognus_session', JSON.stringify(user));
      renderHeader();
      showToast(`Bem-vindo, ${user.name}!`, 'success');

      if (user.must_change_password) {
        navigateTo('first-login');
      } else if (user.role === 'admin') {
        navigateTo('superadmin');
      } else if (user.role === 'instrutor') {
        navigateTo('creator');
      } else {
        navigateTo('landing');
      }
    }

    function handleCheckoutSimulate(e, courseId) {
      e.preventDefault();
      const name = document.getElementById('chk-name').value;
      const email = document.getElementById('chk-email').value;
      const tempPass = 'TMP-' + Math.floor(100000 + Math.random() * 900000);

      state.enrollments.push({ studentEmail: email, courseId: courseId });
      showToast('Matrícula confirmada pelo Gateway!', 'success');
      navigateTo('purchase-success', { tempPass: tempPass });
    }

    function handlePasswordChange(e) {
      e.preventDefault();
      const n = document.getElementById('new-pass').value;
      const c = document.getElementById('confirm-pass').value;
      if (n !== c) {
        showToast('As senhas não coincidem!', 'error');
        return;
      }
      if (n.length < 6) {
        showToast('A senha deve ter no mínimo 6 caracteres!', 'error');
        return;
      }
      if (currentUser) {
        currentUser.must_change_password = false;
        localStorage.setItem('kognus_session', JSON.stringify(currentUser));
      }
      showToast('Senha alterada com sucesso! Acesso liberado.', 'success');
      navigateTo('player', { courseId: 1 });
    }

    function handleInstructorRegister(e) {
      e.preventDefault();
      const name = document.getElementById('inst-name').value;
      const school = document.getElementById('inst-school').value;
      const email = document.getElementById('inst-email').value;
      const user = { id: 'inst_' + Date.now(), name, school, email, role: 'instrutor' };
      loginUserSuccess(user);
    }

    function handleAdminPasswordRenew(e) {
      e.preventDefault();
      showToast('Senha de administrador renovada com sucesso!', 'success');
      navigateTo('superadmin');
    }

    function selectLesson(courseId, lessonId) {
      const course = state.courses.find(c => c.id === courseId);
      if (course) {
        for (let m of course.modules) {
          let l = m.lessons.find(item => item.id === lessonId);
          if (l) {
            selectedLesson = l;
            navigateTo('player', { courseId });
            return;
          }
        }
      }
    }

    function toggleLessonComplete(lessonId, courseId) {
      if (!completedLessons.includes(lessonId)) {
        completedLessons.push(lessonId);
        showToast('Aula concluída com sucesso!', 'success');
      } else {
        showToast('Esta aula já estava marcada como concluída.', 'info');
      }
      navigateTo('player', { courseId: courseId || 1 });
    }

    function toggleAccordion(moduleId) {
      openAccordionModules[moduleId] = !openAccordionModules[moduleId];
      const course = state.courses[0];
      navigateTo('player', { courseId: course.id });
    }

    window.addEventListener('DOMContentLoaded', initApp);
