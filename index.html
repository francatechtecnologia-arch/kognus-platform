    // Funções Utilitárias de Mapeamento Determinístico de UUID / IDs
    function toUuid(id, prefix = '00000000-0000-0000-0000-') {
      if (!id) return `${prefix}000000000001`;
      const str = String(id);
      if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str)) {
        return str;
      }
      const hex = Number(id) ? Math.floor(Number(id)).toString(16).padStart(12, '0').slice(-12) : '000000000001';
      return `${prefix}${hex}`;
    }

    function fromUuidToId(uuid) {
      if (typeof uuid === 'number') return uuid;
      if (!uuid) return 1;
      const str = String(uuid);
      if (str.startsWith('00000000-0000-0000-0000-') || str.startsWith('00000000-0000-0000-0001-') || str.startsWith('00000000-0000-0000-0002-')) {
        const num = parseInt(str.slice(-12), 16);
        if (!isNaN(num)) return num;
      }
      return uuid;
    }

    function extractYoutubeId(url) {
      if (!url) return 'dQw4w9WgXcQ';
      if (url.includes('embed/')) return url.split('embed/')[1].split('?')[0];
      if (url.includes('v=')) return url.split('v=')[1].split('&')[0];
      if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split('?')[0];
      return url;
    }

    // Persistência Inicial de Contingência (Seed Fallback no Supabase)
    async function seedSupabaseDatabase() {
      if (!db) return;
      try {
        for (const c of state.courses) {
          const cUuid = toUuid(c.id, '00000000-0000-0000-0000-');
          const numericPrice = parseFloat(String(c.price).replace(/\./g, '').replace(',', '.')) || 0;

          const qC = db.from('courses');
          if (qC && typeof qC.upsert === 'function') await qC.upsert({
            id: cUuid,
            title: c.title,
            category: c.category,
            description: c.description || 'Curso completo na plataforma KOGNUS.',
            price: numericPrice,
            thumbnail_url: c.image,
            status: 'publicado',
            certificate_enabled: c.certificateConfig?.enabled ?? true,
            certificate_hours: c.certificateConfig?.workloadHours || 40
          });

          for (let mi = 0; mi < (c.modules || []).length; mi++) {
            const m = c.modules[mi];
            const mUuid = toUuid(m.id, '00000000-0000-0000-0001-');
            const qM = db.from('course_modules');
            if (qM && typeof qM.upsert === 'function') await qM.upsert({
              id: mUuid,
              course_id: cUuid,
              title: m.title,
              order_index: mi
            });

            for (let li = 0; li < (m.lessons || []).length; li++) {
              const l = m.lessons[li];
              const lUuid = toUuid(l.id, '00000000-0000-0000-0002-');
              const qL = db.from('course_lessons');
              if (qL && typeof qL.upsert === 'function') await qL.upsert({
                id: lUuid,
                module_id: mUuid,
                course_id: cUuid,
                title: l.title,
                duration: l.duration,
                video_url: l.videoUrl || `https://www.youtube-nocookie.com/embed/${l.youtubeId || 'dQw4w9WgXcQ'}`,
                pdf_url: l.pdf,
                order_index: li
              });
            }
          }
        }
        console.log('[Supabase Seed] Base inicial inserida com sucesso no Supabase.');
      } catch(err) {
        console.warn('[Supabase Seed Warning]', err);
      }
    }

    // Leitura e Hidratação Real do Supabase
    async function hydrateFromSupabase() {
      if (!db) return;
      try {
        // 1. Busca todos os cursos publicados com módulos e aulas
        const { data: coursesData, error: coursesError } = await db
          .from('courses')
          .select('*, course_modules(*, course_lessons(*))');

        if (!coursesError && coursesData && coursesData.length > 0) {
          state.courses = coursesData.map(c => {
            const certConfig = c.certificate_config || {
              enabled: c.certificate_enabled ?? true,
              template: 'classic',
              minCompletionPercentage: 100,
              workloadHours: c.certificate_hours || 40,
              instructorTitle: 'Instrutor Titular & Diretor Técnico',
              showSchoolName: true,
              schoolLogo: null,
              signatureImage: null
            };

            return {
              id: fromUuidToId(c.id),
              rawId: c.id,
              title: c.title,
              instructor: c.instructor_name || c.school_name || 'Prof. Renato Mestre',
              instructorEmail: c.instructor_email || 'instrutor@kognus.com',
              school: c.school_name || 'Escola do Renato Mestre',
              price: typeof c.price === 'number' ? c.price.toFixed(2).replace('.', ',') : (c.price || '297,00'),
              category: c.category || 'Colorimetria',
              image: c.image_url || c.thumbnail_url || 'https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=800&q=80',
              description: c.description || 'Curso completo na plataforma KOGNUS.',
              status: (c.status === 'published' || c.status === 'publicado') ? 'Publicado' : c.status,
              studentsCount: c.students_count || 0,
              checkoutUrl: c.external_checkout_url || c.checkout_url || '',
              certificateConfig: certConfig,
              modules: (c.course_modules || []).sort((a, b) => (a.order_index || 0) - (b.order_index || 0)).map(m => ({
                id: fromUuidToId(m.id),
                rawId: m.id,
                title: m.title,
                lessons: (m.course_lessons || []).sort((a, b) => (a.order_index || 0) - (b.order_index || 0)).map(l => ({
                  id: fromUuidToId(l.id),
                  rawId: l.id,
                  title: l.title,
                  duration: l.duration || '15 min',
                  youtubeId: extractYoutubeId(l.video_url || 'dQw4w9WgXcQ'),
                  videoUrl: l.video_url || '',
                  pdf: l.pdf_url || l.pdf_name || 'Apostila.pdf'
                }))
              }))
            };
          });

          try {
            localStorage.setItem('kognus_custom_courses', JSON.stringify(state.courses));
          } catch(e) {}
        } else if (!coursesError && (!coursesData || coursesData.length === 0)) {
          // Se tabela vazia, insere seed inicial para não ficar vazio
          seedSupabaseDatabase();
        }

        // 2. Se usuário estiver logado, recupera matrículas e aulas concluídas
        if (currentUser && currentUser.email) {
          const cleanEmail = currentUser.email.toLowerCase().trim();

          // Matrículas ativas
          try {
            const { data: enrData, error: enrError } = await db
              .from('enrollments')
              .select('*')
              .eq('student_email', cleanEmail);

            if (!enrError && enrData && enrData.length > 0) {
              enrData.forEach(item => {
                const cId = fromUuidToId(item.course_id);
                if (!state.enrollments.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === String(cId))) {
                  state.enrollments.push({ studentEmail: cleanEmail, courseId: cId });
                }
              });
              try {
                localStorage.setItem('kognus_enrollments', JSON.stringify(state.enrollments));
              } catch(e) {}
            }
          } catch(eEnr) {
            console.warn('[Supabase Enrollments Hydration]', eEnr);
          }

          // Aulas concluídas
          try {
            const { data: progData, error: progError } = await db
              .from('lesson_progress')
              .select('lesson_id')
              .eq('student_email', cleanEmail);

            if (!progError && progData && progData.length > 0) {
              progData.forEach(p => {
                const lId = fromUuidToId(p.lesson_id);
                if (!completedLessons.includes(lId)) {
                  completedLessons.push(lId);
                }
              });
              try {
                localStorage.setItem('kognus_completed_lessons_' + cleanEmail, JSON.stringify(completedLessons));
              } catch(e) {}
            }
          } catch(eProg) {
            console.warn('[Supabase Progress Hydration]', eProg);
          }
        }

        // Re-renderiza a visualização caso esteja em catálogo ou painel
        if (['landing', 'dashboard-instrutor', 'dashboard-aluno'].includes(currentView)) {
          renderHeader();
          navigateTo(currentView);
        }
      } catch(err) {
        console.warn('[Supabase Hydration Exception]', err);
      }
    }

    // 2. ESTADO GLOBAL DA APLICAÇÃO
    let currentUser = null; // Padrão inicial rigoroso: DESLOGADO
    let currentView = 'landing';
    let selectedCourse = null;
    let selectedLesson = null;
    let completedLessons = [1, 2];
    let openAccordionModules = { 1: true, 2: true };
    let showAddLessonForm = false;

    // Banco de Dados Seed Local / Contingência
    let state = {
      courses: [
        {
          id: 1,

          category: "Colorimetria",

                { id: 2, title: "02. Neutralização Direta de Fundos de Clareamento", duration: "18 min", youtubeId: "dQw4w9WgXcQ", pdf: "Calculo_Neutralizacao_Pratica.pdf" }
              ]
            },
            {
              id: 2,
              title: "Módulo 2: Casos Práticos de Salão & Finalização",
              lessons: [
                { id: 3, title: "03. Tratamento de Cabelos Sensibilizados", duration: "22 min", youtubeId: "dQw4w9WgXcQ", pdf: "Ficha_Diagnostico_Capilar.pdf" },
                { id: 4, title: "04. Matização com Pigmentos Puros e Brilho Espelhado", duration: "19 min", youtubeId: "dQw4w9WgXcQ", pdf: "Guia_Matizacao_Final.pdf" }
              ]
            }
          ]
        },
        {
          id: 2,
          title: "Gestão Financeira & Precificação para Salões e Barbearias",
          instructor: "Prof. Renato Mestre",

      ],

        { id: 3, name: "Juliana Estética", email: "juliana@estetica.com", school: "Instituto Juliana Pele", coursesCount: 3, status: "inadimplente", mrr: 89.90, createdAt: "15/02/2026" },

    // 3. INICIALIZAÇÃO DA APLICAÇÃO
    function initApp() {
      const savedSession = localStorage.getItem('kognus_session');
      if (savedSession) {
        try {
          currentUser = JSON.parse(savedSession);
        } catch(e) {
          currentUser = null;
          localStorage.clear();
        }
      } else {
        currentUser = null;
      }

      // Restaura cursos customizados do storage se existirem
      const savedCourses = localStorage.getItem('kognus_custom_courses');
      if (savedCourses) {
        try {
          const parsed = JSON.parse(savedCourses);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.courses = parsed;
          }
        } catch(e) {}
      }

      // Restaura matrículas customizadas do storage se existirem
      const savedEnrollments = localStorage.getItem('kognus_enrollments');
      if (savedEnrollments) {
        try {
          const parsed = JSON.parse(savedEnrollments);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.enrollments = parsed;
          }
        } catch(e) {}
      }

      // 3.1 CAPTURA DE RETORNO DO STRIPE VIA QUERY PARAMS (UNIFICADO INSTRUTOR & ALUNO)
      let stripeReturnHandled = false;
      let deepLinkedCourseId = null;

      if (typeof window !== 'undefined' && window.location && window.location.search) {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const stripeStatus = urlParams.get('stripe_status') || urlParams.get('payment_status') || urlParams.get('status');
          const isStripeReturn = stripeStatus === 'verifying' || stripeStatus === 'success' || urlParams.has('session_id');

          const rawType = urlParams.get('type');
          const cid = urlParams.get('course_id') || urlParams.get('curso') || urlParams.get('course');
          if (cid) deepLinkedCourseId = Number(cid);

          if (isStripeReturn) {
            const isStudent = rawType === 'student' || (!rawType && Boolean(deepLinkedCourseId)) || (currentUser && currentUser.role === 'aluno');
            const flowType = isStudent ? 'student' : 'instructor';
            const flowEmail = urlParams.get('email') || (currentUser ? currentUser.email : (flowType === 'instructor' ? 'instrutor@kognus.com' : 'aluno@kognus.com'));
            const targetCourseId = deepLinkedCourseId || (state.courses[0] ? state.courses[0].id : 1);

            // Limpa parâmetros da URL de forma invisível via window.history.replaceState
            if (window.history && window.history.replaceState) {
              window.history.replaceState({}, document.title, window.location.pathname);
            }

            stripeReturnHandled = true;
            renderHeader();

            if (flowType === 'instructor') {
              if (!currentUser || currentUser.email !== flowEmail) {
                const foundInst = state.instructors.find(i => i.email === flowEmail);
                currentUser = {
                  id: foundInst ? (foundInst.id || 'inst_1') : 'inst_1',
                  name: foundInst ? foundInst.name : 'Instrutor',
                  email: flowEmail,
                  school: foundInst ? foundInst.school : 'Minha Escola',
                  role: 'instrutor',
                  status: foundInst ? foundInst.status : 'pendente'
                };
                try {
                  localStorage.setItem('kognus_session', JSON.stringify(currentUser));
                } catch(e) {}
              }
              navigateTo('dashboard-instrutor');
              openStripeRadarModal(flowEmail, 'instructor');
              startRealtimePaymentWatcher(flowEmail);
            } else {
              if (!currentUser) {
                currentUser = {
                  id: 'aluno_' + Math.random().toString(36).substring(2, 7),
                  name: 'Aluno',
                  email: flowEmail,
                  role: 'aluno'
                };
                try {
                  localStorage.setItem('kognus_session', JSON.stringify(currentUser));
                } catch(e) {}
              }
              navigateTo('landing');
              openStripeRadarModal(flowEmail, 'student', targetCourseId);
              startStudentEnrollmentPolling(flowEmail, targetCourseId);
            }
          }
        } catch(e) {
          console.warn('[Stripe Return Parse Error]', e);
        }
      }

      if (stripeReturnHandled) return;

      renderHeader();
      if (deepLinkedCourseId) {
        navigateTo('checkout', { courseId: deepLinkedCourseId });
      } else if (currentUser) {
        if (currentUser.must_change_password) {
          navigateTo('first-login');
        } else if (currentUser.role === 'admin') {
          navigateTo('dashboard-admin');
        } else if (currentUser.role === 'instrutor') {
          navigateTo('dashboard-instrutor');
        } else {
          navigateTo('dashboard-aluno');
        }
      } else {
        navigateTo('landing');
      }

      // Aplica cor de destaque personalizada se definida
      if (currentUser && currentUser.school_accent_color && typeof document !== 'undefined' && document.documentElement) {
        document.documentElement.style.setProperty('--school-accent', currentUser.school_accent_color);
      }

      // 3.2 CARREGAMENTO REAL DO SUPABASE (Hydration Assíncrona e Resiliente)
      hydrateFromSupabase();
    }

    // 4. NOTIFICAÇÕES TOAST
    function showToast(msg, type='info') {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const t = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-600 border-red-500' : (type === 'success' ? 'bg-emerald-600 border-emerald-500' : 'bg-brand-600 border-brand-500');
      t.className = `${bg} text-white px-4 py-2.5 rounded-xl border text-xs font-semibold shadow-2xl transition-all duration-300 transform translate-y-0 opacity-100 flex items-center space-x-2`;
      t.innerHTML = `<span>${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateY(10px)';
        setTimeout(() => { t.remove(); }, 300);
      }, 3500);
    }

    function installPwaApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice && choice.outcome === 'accepted') {
            showToast('Aplicativo KOGNUS instalado com sucesso!', 'success');
          }
          deferredPrompt = null;
          dismissPwaBanner();
        });
      } else {
        showToast('Adicione à tela inicial através do menu do seu navegador.', 'info');
        dismissPwaBanner();
      }
    }

    function dismissPwaBanner() {
      if (typeof sessionStorage !== 'undefined') {
        sessionStorage.setItem('kognus_pwa_dismissed', 'true');
      }
      const b = document.getElementById('pwa-install-banner');
      if (b) b.remove();

    // 6. ROTEADOR DE TELAS SPA COM SUPORTE INTEGRAL AOS DASHBOARDS
    function navigateTo(view, params = {}) {
      currentView = view;
      const v = document.getElementById('app-viewport');
      if (!v) return;
      window.scrollTo(0, 0);

      // Verificação de Primeiro Acesso (Troca Obrigatória de Senha)
      if (currentUser && currentUser.must_change_password && view !== 'first-login') {
        navigateTo('first-login');
        return;
      }

      switch(view) {
        case 'landing':
          v.innerHTML = renderLandingPage();
          break;
        case 'dashboard-aluno':
        case 'aluno-dash':
          v.innerHTML = renderAlunoDashboard();
          break;
        case 'dashboard-instrutor':
        case 'creator':
        case 'instrutor-dash':
          v.innerHTML = renderCreatorPage();
          setupInstructorRealtimeListener();
          break;
        case 'dashboard-admin':
        case 'superadmin':
        case 'admin-dash':
          v.innerHTML = renderSuperAdminPage();
          if (typeof setTimeout !== 'undefined') {
            setTimeout(renderSuperAdminCharts, 50);
          }
          break;
        case 'login':
          v.innerHTML = renderLoginPage();
          break;
        case 'register-instructor':
          v.innerHTML = renderRegisterInstructorPage();
          break;
        case 'first-login':
          v.innerHTML = renderFirstLoginPage();
          break;
        case 'checkout':
          v.innerHTML = renderCheckoutPage(params.courseId || 1);
          break;
        case 'purchase-success':
          v.innerHTML = renderPurchaseSuccessPage(params.tempPass || 'TMP-849201');
          break;
        case 'player':
          v.innerHTML = renderPlayerPage(params.courseId || 1);
          break;
        case 'certificate':
          v.innerHTML = renderCertificatePage(params.courseId || 1);
          break;
        case 'admin-expired':
          v.innerHTML = renderAdminExpiredPage();
          break;
        default:
          v.innerHTML = renderLandingPage();
      }

      if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
    }

    function logout() {
      // 1. Limpeza rigorosa de armazenamento local e de sessão
      localStorage.clear();
      sessionStorage.clear();
      // 2. Redefinição reativa do estado global
      currentUser = null;
      // 3. Re-renderização imediata do cabeçalho
      renderHeader();
      // 4. Redirecionamento instantâneo para a vitrine de visitante
      navigateTo('landing');
      // 5. Toast de confirmação
      showToast('Sessão encerrada com sucesso.', 'info');
    }

    // GESTÃO DE FILTRAGEM DO CATÁLOGO POR CATEGORIAS
    let selectedCatalogCategory = 'Todas';
    window.selectedCatalogCategory = 'Todas';

    function getCatalogCategories() {
      const base = [
        "Todas",
        "Beleza & Estética",
        "Tecnologia & Programação",
        "Culinária & Gastronomia",
        "Negócios & Gestão",
        "Marketing Digital & Vendas",
        "Saúde & Fitness",
        "Design & Artes"
      ];
      const extra = [];
      if (state && state.courses) {
        state.courses.forEach(c => {
          if (c.category && !base.includes(c.category) && !extra.includes(c.category)) {
            extra.push(c.category);
          }
        });
      }
      return [...base, ...extra];
    }

    function filterCategory(categoryName) {
      selectedCatalogCategory = categoryName;
      window.selectedCatalogCategory = categoryName;
      const viewport = document.getElementById('app-viewport');
      if (viewport && currentView === 'landing') {
        viewport.innerHTML = renderLandingPage();
        if (typeof window !== 'undefined' && window.lucide) window.lucide.createIcons();
      } else {
        navigateTo('landing');
      }
    }

    // TELA 1: LANDING PAGE & CATÁLOGO
    function renderLandingPage() {
      const isStudentEnrolled = (courseId) => {
        if (!currentUser) return false;
        return state.enrollments.some(e => e.studentEmail === currentUser.email && e.courseId === courseId);
      };

      const categories = getCatalogCategories();

      const filteredCourses = state.courses.filter(course => {
        // Regra de Exibição no Catálogo/Vitrine Pública:
        // Apenas cursos com status === 'published' (ou 'Publicado') são visíveis para novos visitantes e no catálogo geral
        const isPublished = !course.status || course.status.toLowerCase() === 'published' || course.status.toLowerCase() === 'publicado';
        if (!isPublished) return false;

        if (!selectedCatalogCategory || selectedCatalogCategory === 'Todas') return true;
        const cCat = (course.category || '').toLowerCase().trim();
        const sCat = selectedCatalogCategory.toLowerCase().trim();

        if (cCat === sCat) return true;

        if (sCat === 'beleza & estética' && (cCat.includes('beleza') || cCat.includes('colorimetria') || cCat.includes('estética'))) return true;
        if (sCat === 'negócios & gestão' && (cCat.includes('negócios') || cCat.includes('gestão') || cCat.includes('finanças'))) return true;
        if (sCat === 'tecnologia & programação' && (cCat.includes('tecnologia') || cCat.includes('programação') || cCat.includes('software'))) return true;
        if (sCat === 'culinária & gastronomia' && (cCat.includes('culinária') || cCat.includes('gastronomia'))) return true;
        if (sCat === 'marketing digital & vendas' && (cCat.includes('marketing') || cCat.includes('vendas'))) return true;
        if (sCat === 'saúde & fitness' && (cCat.includes('saúde') || cCat.includes('fitness') || cCat.includes('bem-estar'))) return true;
        if (sCat === 'design & artes' && (cCat.includes('design') || cCat.includes('audiovisual') || cCat.includes('artes') || cCat.includes('música'))) return true;

        return false;
      });

            <p class="text-zinc-400 text-base">SaaS Puro: 0% de comissões sobre suas vendas. Mensalidade fixa de apenas R$ 89,90/mês para manter sua escola ativa com alunos e cursos ilimitados.</p>
            <div class="flex justify-center gap-4 pt-2">

          <!-- Grade de Cursos / Catálogo -->
          <div id="catalogo" class="pt-8">

              ${categories.map(cat => {

                    ${cat}

            </div>

            <!-- Grade de Cursos Filtrada -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
              ${filteredCourses.length > 0 ? filteredCourses.map(course => {
                const enrolled = isStudentEnrolled(course.id);
                return `
                  <div class="bg-darkCard border ${enrolled ? 'border-emerald-500/40' : 'border-darkBorder'} rounded-2xl overflow-hidden flex flex-col justify-between shadow-xl transition hover:border-zinc-700">

                            : `<span class="text-lg font-black text-white">R$ ${course.price}</span>`
                          }
                        </div>
                        <div>
                          ${enrolled

                  </div>
                `;
              }).join('') : `

                  <div class="w-12 h-12 rounded-full bg-zinc-800/80 border border-darkBorder flex items-center justify-center mx-auto text-zinc-400">

    function fillLogin(email, pass) {
      const e = document.getElementById('login-email');
      const p = document.getElementById('login-password');
      if (e) e.value = email;
      if (p) p.value = pass;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();

      // Tentativa de consulta Supabase
      if (db) {
        try {
          const { data, error } = await db.from('users').select('*').eq('email', email).single();
          if (data && data.password_hash === pass) {
            loginUserSuccess(data);
            return;
          }
        } catch(err) {
          console.warn('[Supabase] Consulta falhou, acionando fallback.');
        }
      }

      // Autenticação local de contingência
      if (email === 'admin@kognus.com' && pass === 'admin123') {
        loginUserSuccess({ id: 'adm_1', name: 'Administrador Kognus', email, role: 'admin' });
      } else if (email === 'instrutor@kognus.com' && pass === '123456') {
        loginUserSuccess({ id: 'inst_1', name: 'Prof. Renato Mestre', email, role: 'instrutor' });
      } else if (email === 'aluno@kognus.com' && pass === '123456') {
        loginUserSuccess({ id: 'alu_1', name: 'Lucas Mendes', email, role: 'aluno', must_change_password: false });
      } else if (pass.startsWith('TMP-')) {
        loginUserSuccess({ id: 'alu_tmp', name: 'Aluno Recente', email, role: 'aluno', must_change_password: true });
      } else {
        showToast('Credenciais incorretas! Tente as contas de teste rápidas.', 'error');
      }
    }

    function loginUserSuccess(user) {
      currentUser = user;
      localStorage.setItem('kognus_session', JSON.stringify(user));
      renderHeader();
      showToast(`Bem-vindo, ${user.name}!`, 'success');

      // REDIRECIONAMENTO OBRIGATÓRIO POR PERFIL
      if (user.must_change_password) {
        navigateTo('first-login');
      } else if (user.role === 'admin') {
        navigateTo('dashboard-admin');
      } else if (user.role === 'instrutor') {
        navigateTo('dashboard-instrutor');
      } else {
        navigateTo('dashboard-aluno');
      }
    }

    function handleCheckoutSimulate(e, courseId) {
      e.preventDefault();
      const name = document.getElementById('chk-name').value;
      const email = document.getElementById('chk-email').value;
      const tempPass = 'TMP-' + Math.floor(100000 + Math.random() * 900000);

      const cleanEmail = email.toLowerCase().trim();
      const cid = Number(courseId) || courseId;

      if (!state.enrollments.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === String(cid))) {
        state.enrollments.push({ studentEmail: cleanEmail, courseId: cid });
      }

      try {
        localStorage.setItem('kognus_enrollments', JSON.stringify(state.enrollments));
      } catch(err) {}

      // Persistência de contingência no Supabase
      if (db) {
        (async () => {
          try {
            const qUs = db.from('users');
            if (qUs && typeof qUs.upsert === 'function') {
              await qUs.upsert({
                id: 'aluno_' + Date.now(),
                name: name,
                email: cleanEmail,
                role: 'aluno',
                school_name: '',
                status: 'ativo',
                created_at: new Date().toISOString()
              }, { onConflict: 'email' });
            }
          } catch(err) {
            try {
              await db.from('users').upsert({
                name: name,
                email: cleanEmail,
                role: 'aluno',
                password_hash: 'kognus123',
                must_change_password: true
              }, { onConflict: 'email' });
            } catch(e2) {}
          }

          try {
            const qEn = db.from('enrollments');
            if (qEn && typeof qEn.upsert === 'function') {
              await qEn.upsert({
                student_email: cleanEmail,
                course_id: String(cid || '1'),
                status: 'active',
                created_at: new Date().toISOString()
              }, { onConflict: 'student_email,course_id' });
            }
          } catch(err) {
            try {
              const cUuid = toUuid(cid, '00000000-0000-0000-0000-');
              await db.from('enrollments').insert({
                course_id: cUuid,
                progress_percentage: 0,
                enrolled_at: new Date().toISOString()
              });
            } catch(e2) {}
          }
        })();
      }

      showToast('Matrícula confirmada pelo Gateway!', 'success');
      navigateTo('purchase-success', { tempPass: tempPass });
    }

    function handlePasswordChange(e) {
      e.preventDefault();
      const n = document.getElementById('new-pass').value;
      const c = document.getElementById('confirm-pass').value;
      if (n !== c) {
        showToast('As senhas não coincidem!', 'error');
        return;
      }
      if (n.length < 6) {
        showToast('A senha deve ter no mínimo 6 caracteres!', 'error');
        return;
      }
      if (currentUser) {
        currentUser.must_change_password = false;
        localStorage.setItem('kognus_session', JSON.stringify(currentUser));
      }
      showToast('Senha alterada com sucesso! Acesso liberado ao seu painel.', 'success');
      navigateTo('dashboard-aluno');
    }

    function handleInstructorRegister(e) {
      e.preventDefault();
      const name = document.getElementById('inst-name').value;
      const school = document.getElementById('inst-school').value;
      const email = document.getElementById('inst-email').value;
      const userId = 'inst_' + Date.now();
      const user = {
        id: userId,
        name,
        school,
        email,
        role: 'instrutor',
        status: 'pendente'
      };
      
      const newRecord = {
        id: user.id,
        name,
        email,
        school,
        coursesCount: 0,
        status: 'pendente',
        mrr: 89.90,
        createdAt: new Date().toLocaleDateString('pt-BR')
      };
      const existingIdx = state.instructors.findIndex(i => i.email === email);
      if (existingIdx >= 0) {
        state.instructors[existingIdx] = newRecord;
      } else {
        state.instructors.unshift(newRecord);
      }

      // Persistência na tabela users do Supabase
      if (db) {
        (async () => {
          try {
            const qU = db.from('users');
            if (qU && typeof qU.upsert === 'function') {
              await qU.upsert({
                id: userId,
                name: name,
                email: email.toLowerCase().trim(),
                role: 'instrutor',
                school_name: school || '',
                status: 'pendente',
                created_at: new Date().toISOString()
              }, { onConflict: 'email' });
            }
          } catch(err) {
            console.warn('[Supabase Instructor Users Upsert Warning]', err);
            try {
              await db.from('users').upsert({
                name: name,
                email: email.toLowerCase().trim(),
                role: 'instrutor',
                password_hash: 'kognus123'
              }, { onConflict: 'email' });
            } catch(e2) {}
          }
        })();
      }

      loginUserSuccess(user);
    }

    function handleSaveNewLesson(e) {
      e.preventDefault();
      const modTitle = document.getElementById('nl-module-title').value.trim();
      const lessonTitle = document.getElementById('nl-lesson-title').value.trim();
      const videoUrl = document.getElementById('nl-video-url').value.trim();
      const pdfName = document.getElementById('nl-pdf-name').value.trim();

      let ytId = 'dQw4w9WgXcQ';
      if (videoUrl.includes('v=')) {
        ytId = videoUrl.split('v=')[1].split('&')[0];
      } else if (videoUrl.includes('youtu.be/')) {
        ytId = videoUrl.split('youtu.be/')[1].split('?')[0];
      }

      const course = state.courses[0];
      let targetMod = course.modules.find(m => m.title.toLowerCase() === modTitle.toLowerCase());
      if (!targetMod) {
        targetMod = {
          id: Date.now(),
          title: modTitle,
          lessons: []
        };
        course.modules.push(targetMod);
      }

      const newLesson = {
        id: Date.now() + 1,
        title: lessonTitle,
        duration: "15 min",
        youtubeId: ytId,
        pdf: pdfName || "Apostila_Complementar.pdf"
      };
      targetMod.lessons.push(newLesson);

      try {
        localStorage.setItem('kognus_custom_courses', JSON.stringify(state.courses));
      } catch(err) {}

      // Persistência nas tabelas course_modules e course_lessons do Supabase
      if (db) {
        (async () => {
          try {
            const courseUuid = toUuid(course.id, '00000000-0000-0000-0000-');
            const modUuid = toUuid(targetMod.id, '00000000-0000-0000-0001-');
            const lessonUuid = toUuid(newLesson.id, '00000000-0000-0000-0002-');

            const qMod = db.from('course_modules');
            if (qMod && typeof qMod.upsert === 'function') await qMod.upsert({
              id: modUuid,
              course_id: courseUuid,
              title: targetMod.title,
              order_index: course.modules.indexOf(targetMod)
            });

            const qLes = db.from('course_lessons');
            if (qLes && typeof qLes.upsert === 'function') await qLes.upsert({
              id: lessonUuid,
              module_id: modUuid,
              course_id: courseUuid,
              title: newLesson.title,
              duration: newLesson.duration,
              video_url: videoUrl || `https://www.youtube-nocookie.com/embed/${ytId}`,
              pdf_url: newLesson.pdf,
              order_index: targetMod.lessons.length - 1
            });
          } catch(err) {
            console.warn('[Supabase Module/Lesson Upsert Warning]', err);
          }
        })();
      }

      showAddLessonForm = false;
      showToast('Nova aula salva na grade com sucesso!', 'success');
      navigateTo('dashboard-instrutor');
    }

    // 2. SINCRONIZAÇÃO ASSÍNCRONA E TEMPO REAL (REALTIME LOCKDOWN)
    let instructorRealtimeChannel = null;
    let instructorStatusPollInterval = null;

    function setupInstructorRealtimeListener() {
      if (!currentUser || currentUser.role !== 'instrutor') return;
      const userEmail = currentUser.email;

      // Limpa listeners prévios para evitar duplicação
      if (instructorRealtimeChannel && db) {
        try {
          db.removeChannel(instructorRealtimeChannel);
        } catch(e) {}
        instructorRealtimeChannel = null;
      }
      if (instructorStatusPollInterval) {
        clearInterval(instructorStatusPollInterval);
        instructorStatusPollInterval = null;
      }

      // 1. Escuta Supabase Realtime (se cliente disponível)
      if (db && typeof db.channel === 'function') {
        try {
          instructorRealtimeChannel = db.channel(`user-status-${userEmail}`)
            .on('postgres_changes', {
              event: '*',
              schema: 'public',
              table: 'users',
              filter: `email=eq.${userEmail}`
            }, (payload) => {
              console.log('[Supabase Realtime] Evento na tabela users:', payload);
              const newStatus = payload.new?.status;
              if (newStatus && newStatus !== currentUser.status) {
                handleRealtimeStatusTransition(newStatus);
              }
            })
            .subscribe();
        } catch(err) {
          console.warn('[Supabase Realtime Warning]:', err);
        }
      }

      // 2. Fallback de Polling contínuo a cada 3 segundos
      instructorStatusPollInterval = setInterval(async () => {
        if (!currentUser || currentUser.role !== 'instrutor') {
          clearInterval(instructorStatusPollInterval);
          return;
        }

        // Checa Supabase se disponível
        if (db) {
          try {
            const { data } = await db.from('users').select('status').eq('email', userEmail).single();
            if (data && data.status && data.status !== currentUser.status) {
              handleRealtimeStatusTransition(data.status);
              return;
            }
          } catch(e) {}
        }

        // Checa LocalStorage / Estado
        const storedStatus = localStorage.getItem('kognus_status_' + userEmail);
        if (storedStatus && storedStatus !== currentUser.status) {
          handleRealtimeStatusTransition(storedStatus);
          return;
        }
        const inst = state.instructors.find(i => i.email === userEmail);
        if (inst && inst.status !== currentUser.status) {
          handleRealtimeStatusTransition(inst.status);
        }
      }, 3000);
    }

    // 3. Listener Cross-Tab nativo (0ms entre abas SuperAdmin e Instrutor)
    if (typeof window !== 'undefined') {
      window.addEventListener('storage', (e) => {
        if (!currentUser || currentUser.role !== 'instrutor') return;
        if (e.key === 'kognus_status_' + currentUser.email || e.key === 'kognus_realtime_event') {
          let targetStatus = null;
          if (e.key === 'kognus_status_' + currentUser.email) {
            targetStatus = e.newValue;
          } else if (e.key === 'kognus_realtime_event' && e.newValue) {
            try {
              const parsed = JSON.parse(e.newValue);
              if (parsed.email === currentUser.email) {
                targetStatus = parsed.status;
              }
            } catch(err) {}
          }
          if (targetStatus && targetStatus !== currentUser.status) {
            handleRealtimeStatusTransition(targetStatus);
          }
        }
      });
    }

    function handleRealtimeStatusTransition(newStatus) {
      if (!currentUser) return;
      const oldStatus = currentUser.status;
      currentUser.status = newStatus;
      localStorage.setItem('kognus_session', JSON.stringify(currentUser));
      localStorage.setItem('kognus_status_' + currentUser.email, newStatus);
      const inst = state.instructors.find(i => i.email === currentUser.email);
      if (inst) inst.status = newStatus;

      console.log(`[Realtime Lockdown] Transição para ${currentUser.email}: ${oldStatus} -> ${newStatus}`);

      // Sincroniza a Máquina de Estados do Modal de Pagamento se estiver visível
      const modal = document.getElementById('stripe-radar-modal');
      if (modal) {
        if (newStatus === 'ativo') {
          setPaymentModalState('SUCCESS');
        } else if (newStatus === 'recusado') {
          setPaymentModalState('FAILED');
        } else if (newStatus === 'pendente') {
          setPaymentModalState('WAITING');
        }
      }

      if (newStatus === 'inadimplente') {
        showToast('⚠️ ATENÇÃO: Sua assinatura foi suspensa por inadimplência. Regularize para reativar sua escola.', 'error');
      } else if (newStatus === 'ativo') {
        showToast('🎉 Pagamento aprovado! Sua escola foi liberada.', 'success');
      } else if (newStatus === 'recusado') {
        showToast('❌ Pagamento recusado pela operadora.', 'error');
      }

      // Destrava ou Trava instantaneamente na tela sem F5
      if (currentView === 'dashboard-instrutor' || currentView === 'creator') {
        navigateTo('dashboard-instrutor');
      }
    }

    function getStripeCheckoutUrl(email, userId, courseId = null) {
      let baseUrl = '';
      const isInstructor = !courseId;
      if (courseId) {
        const c = state.courses.find(item => item.id === courseId);
        baseUrl = (c && c.checkoutUrl) ? c.checkoutUrl : (localStorage.getItem('kognus_stripe_checkout_url') || state.stripeCheckoutUrl || 'https://buy.stripe.com/test_eVaeVd0QbgwE8kU6oo');
      } else {
        baseUrl = localStorage.getItem('kognus_stripe_checkout_url') || localStorage.getItem('kognus_master_checkout_url') || state.stripeCheckoutUrl || 'https://buy.stripe.com/test_eVaeVd0QbgwE8kU6oo';
      }

      const userEmail = email || (currentUser ? currentUser.email : (isInstructor ? 'instrutor@kognus.com' : 'aluno@kognus.com'));
      const clientRef = userId || (isInstructor ? (currentUser ? currentUser.id : 'inst_1') : `student_${encodeURIComponent(userEmail)}__course_${courseId || 1}`);
      const origin = (typeof window !== 'undefined' && window.location?.origin) ? window.location.origin : 'http://localhost:3000';
      const returnUrl = `${origin}/?stripe_status=verifying&type=${isInstructor ? 'instructor' : 'student'}&email=${encodeURIComponent(userEmail)}${courseId ? '&course_id=' + courseId : ''}`;

      const sep = baseUrl.includes('?') ? '&' : '?';
      const sessionNonce = Date.now();
      return `${baseUrl}${sep}prefilled_email=${encodeURIComponent(userEmail)}&client_reference_id=${encodeURIComponent(clientRef)}&return_url=${encodeURIComponent(returnUrl)}&_t=${sessionNonce}`;
    }

    function setPaymentModalState(newState) {
      paymentModalState = newState;
      window.paymentModalState = newState;
      const modal = document.getElementById('stripe-radar-modal') || document.getElementById('student-radar-modal');
      if (!modal) return;

      const loadingState = document.getElementById('radar-loading-state');
      const successState = document.getElementById('radar-success-state');
      const failedState = document.getElementById('radar-failed-state');

      // Limpa timer anterior se houver
      if (window.failedCountdownTimer) {
        clearInterval(window.failedCountdownTimer);
        window.failedCountdownTimer = null;
      }

      if (newState === 'WAITING') {
        if (loadingState) loadingState.classList.remove('hidden');
        if (successState) successState.classList.add('hidden');
        if (failedState) failedState.classList.add('hidden');

        failedCountdownSeconds = 10;
        updateCountdownUI(failedCountdownSeconds);
      } else if (newState === 'FAILED') {
        if (loadingState) loadingState.classList.add('hidden');
        if (successState) successState.classList.add('hidden');
        if (failedState) failedState.classList.remove('hidden');

        failedCountdownSeconds = 10;
        updateCountdownUI(failedCountdownSeconds);

        window.failedCountdownTimer = setInterval(() => {
          failedCountdownSeconds--;
          updateCountdownUI(failedCountdownSeconds);

          if (failedCountdownSeconds <= 0) {
            clearInterval(window.failedCountdownTimer);
            window.failedCountdownTimer = null;
            retryStripePayment();
          }
        }, 1000);
      } else if (newState === 'SUCCESS') {
        if (loadingState) loadingState.classList.add('hidden');
        if (successState) successState.classList.remove('hidden');
        if (failedState) failedState.classList.add('hidden');

        // Atualiza status da transação no card
        const statusLabel = document.getElementById('radar-transaction-status');
        if (statusLabel) {
          statusLabel.className = 'text-emerald-400 font-semibold flex items-center gap-1.5';
          statusLabel.innerHTML = '<i data-lucide="check-circle" class="w-3.5 h-3.5"></i> ✅ Pagamento Confirmado e Aprovado!';
        }

        const isStudent = currentRadarRole === 'student';
        if (isStudent) {
          // Desbloqueio e matrícula de aluno
          if (!currentUser) {
            currentUser = {
              id: 'aluno_' + Math.random().toString(36).substring(2, 7),

              email: currentRadarTargetEmail || 'aluno@kognus.com',
              role: 'aluno'
            };
            try {
              localStorage.setItem('kognus_session', JSON.stringify(currentUser));
            } catch(e) {}
            renderHeader();

        } else {
          // Desbloqueio imediato do instrutor
          if (currentUser) {
            currentUser.status = 'ativo';
            localStorage.setItem('kognus_session', JSON.stringify(currentUser));
            localStorage.setItem('kognus_status_' + currentUser.email, 'ativo');

          const inst = state.instructors.find(i => i.email === (currentUser ? currentUser.email : 'instrutor@kognus.com'));

    function startStripePolling(email) {
      if (stripePollingInterval) clearInterval(stripePollingInterval);

      }, 2000);

    async function checkActivationStatus(isManual = false, emailToCheck = null, role = null, courseId = null) {
      const email = emailToCheck || currentRadarTargetEmail || (currentUser ? currentUser.email : null);
      const activeRole = role || currentRadarRole || 'instructor';
      const cid = courseId || currentRadarCourseId || (state.courses[0] ? state.courses[0].id : 1);

      if (!email) return;

      if (activeRole === 'student') {
        const cleanEmail = email.toLowerCase().trim();
        let isEnrolled = state.enrollments.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === String(cid));

        if (!isEnrolled && db) {
          try {
            const { data, error } = await db.from('enrollments')
              .select('*')
              .eq('student_email', cleanEmail)
              .eq('course_id', String(cid))
              .maybeSingle();

            if (!error && data && (data.status === 'active' || !data.status)) {
              isEnrolled = true;
            }
          } catch(e) {
            console.warn('[CheckActivation Supabase]:', e);
          }
        }

        if (!isEnrolled) {
          try {
            const localStored = JSON.parse(localStorage.getItem('kognus_enrollments') || '[]');
            if (localStored.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === String(cid))) {
              isEnrolled = true;
            }
          } catch(e) {}
        }

        if (isEnrolled) {
          onStudentPaymentSuccess({ student_email: cleanEmail, course_id: cid });
        } else if (isManual) {
          showToast('Ainda processando transação no Stripe, aguarde mais alguns segundos...', 'info');
        }
        return;
      }

      // Fluxo do Instrutor:
      let currentFoundStatus = null;

      // 1. Consulta no Supabase se cliente estiver disponível
      if (db) {
        try {
          const { data, error } = await db.from('users').select('status, subscription_status').eq('email', email).single();
          if (!error && data && data.status) {
            currentFoundStatus = data.status;
          }
        } catch (e) {
          console.warn('[Polling Supabase]', e);
        }
      }

      // 2. Consulta no LocalStorage / State fallback
      const storedStatus = localStorage.getItem('kognus_status_' + email);
      if (storedStatus) {
        currentFoundStatus = storedStatus;
      }
      const inst = state.instructors.find(i => i.email === email);
      if (inst && inst.status) {
        if (!currentFoundStatus || currentFoundStatus === 'pendente') {
          currentFoundStatus = inst.status;
        }
      }

      console.log(`[Stripe Polling] Status para ${email}: ${currentFoundStatus}`);

      if (currentFoundStatus === 'ativo') {
        if (stripePollingInterval) {
          clearInterval(stripePollingInterval);
          stripePollingInterval = null;
        }
        setPaymentModalState('SUCCESS');
        showToast('🎉 Pagamento aprovado! Sua escola foi liberada.', 'success');
      } else if (currentFoundStatus === 'recusado') {
        if (stripePollingInterval) {
          clearInterval(stripePollingInterval);
          stripePollingInterval = null;
        }
        if (currentUser && currentUser.email === email) {
          currentUser.status = 'recusado';
          localStorage.setItem('kognus_session', JSON.stringify(currentUser));
        }
        if (inst) inst.status = 'recusado';
        setPaymentModalState('FAILED');
        showToast('❌ Pagamento recusado pela operadora.', 'error');
      } else {
        if (isManual) {
          showToast('Ainda processando transação no Stripe, aguarde mais alguns segundos...', 'info');
        }
      }
    }

    function closeCertificateStudioModal() {
      const m = document.getElementById('certificate-studio-modal');
      if (m) m.remove();
    }

    function setCertificateStudioTemplate(tpl) {
      window.currentCertificateStudioTemplate = tpl;
      ['classic', 'modern', 'corporate'].forEach(t => {
        const card = document.getElementById('tpl-card-' + t);
        if (card) {
          if (t === tpl) {
            const color = t === 'classic' ? 'border-amber-500 bg-amber-500/10' : (t === 'modern' ? 'border-brand-500 bg-brand-500/10' : 'border-emerald-500 bg-emerald-500/10');
            card.className = `p-4 rounded-xl border-2 cursor-pointer transition flex flex-col justify-between ${color}`;
          } else {
            card.className = 'p-4 rounded-xl border-2 cursor-pointer transition flex flex-col justify-between border-darkBorder bg-zinc-950 hover:border-zinc-700';
          }
        }
      });
    }

    function handleCertSchoolLogoUpload(input) {
      if (!input || !input.files || !input.files[0]) return;
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        window.currentCertSchoolLogo = e.target.result;
        const prev = document.getElementById('cert-logo-preview');
        if (prev) prev.src = window.currentCertSchoolLogo;
      };
      reader.readAsDataURL(file);
    }

    function handleCertSignatureUpload(input) {
      if (!input || !input.files || !input.files[0]) return;
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        window.currentCertSignature = e.target.result;
        const box = document.getElementById('cert-signature-preview-box');
        if (box) {
          box.innerHTML = `<img id="cert-signature-preview" src="${window.currentCertSignature}" alt="Assinatura Preview" class="h-6 w-auto object-contain">`;
        }
      };
      reader.readAsDataURL(file);
    }

    function handleSaveCertificateStudio(e, courseId) {
      if (e && e.preventDefault) e.preventDefault();
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return;

      const enabled = document.getElementById('cert-enabled')?.checked ?? true;
      const template = window.currentCertificateStudioTemplate || 'classic';
      const minCompletionPercentage = Number(document.getElementById('cert-min-percentage')?.value || 100);
      const workloadHours = Number(document.getElementById('cert-workload-hours')?.value || 40);
      const instructorTitle = document.getElementById('cert-instructor-title')?.value || 'Instrutor Titular & Diretor Técnico';
      const showSchoolName = document.getElementById('cert-show-school')?.checked ?? true;
      const schoolLogo = window.currentCertSchoolLogo || (course.certificateConfig?.schoolLogo || null);
      const signatureImage = window.currentCertSignature || (course.certificateConfig?.signatureImage || null);

      course.certificateConfig = {
        enabled,
        template,
        minCompletionPercentage,
        workloadHours,
        instructorTitle,
        showSchoolName,
        schoolLogo,
        signatureImage
      };

      try {
        localStorage.setItem('kognus_custom_courses', JSON.stringify(state.courses));
      } catch(err) {}

      // Atualização persistente de certificado no Supabase
      if (db && course) {
        (async () => {
          try {
            const courseUuid = toUuid(course.id, '00000000-0000-0000-0000-');
            await db.from('courses').update({
              certificate_config: course.certificateConfig,
              certificate_enabled: course.certificateConfig.enabled,
              certificate_hours: course.certificateConfig.workloadHours || 40
            }).eq('id', courseUuid);
          } catch(err) {
            console.warn('[Supabase Certificate Save Warning]', err);
          }
        })();
      }

      closeCertificateStudioModal();
      showToast(`Certificado do curso "${course.title}" configurado com sucesso!`, 'success');
      navigateTo('dashboard-instrutor');
    }

    // 1. Cópia do Link Direto Compartilhável de Vendas
    function copyCourseDirectLink(courseId) {
      const origin = (typeof window !== 'undefined' && window.location?.origin) ? window.location.origin : 'http://localhost:3000';
      const directUrl = `${origin}/?curso=${courseId}`;
      const nav = (typeof window !== 'undefined' && window.navigator && window.navigator.clipboard) ? window.navigator : (typeof navigator !== 'undefined' ? navigator : null);
      if (nav && nav.clipboard && nav.clipboard.writeText) {
        nav.clipboard.writeText(directUrl).then(() => {
          showToast('Link direto de vendas copiado para a área de transferência!', 'success');
        }).catch(() => {
          showToast('Link do curso: ' + directUrl, 'info');
        });
      } else {
        showToast('Link do curso: ' + directUrl, 'info');
      }
    }

    // 2. Upload de Capa do Curso (FileReader)
    function handleCourseCoverUpload(input) {
      if (!input || !input.files || !input.files[0]) return;
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        currentUploadedCover = e.target.result;
        const preview = document.getElementById('course-cover-preview');
        if (preview) {
          preview.src = currentUploadedCover;
          preview.classList.remove('hidden');
        }
        const urlInput = document.getElementById('course-cover-url');
        if (urlInput) urlInput.value = currentUploadedCover;
      };
      reader.readAsDataURL(file);
    }

    function setCoverInputMode(mode) {
      const upMode = document.getElementById('cover-mode-upload');
      const urlMode = document.getElementById('cover-mode-url');
      const btnUp = document.getElementById('btn-cover-upload');
      const btnUrl = document.getElementById('btn-cover-url');
      if (mode === 'url') {
        if (upMode) upMode.classList.add('hidden');
        if (urlMode) urlMode.classList.remove('hidden');
        if (btnUrl) btnUrl.className = 'px-2.5 py-1 rounded bg-brand-600 text-white font-bold';
        if (btnUp) btnUp.className = 'px-2.5 py-1 rounded text-zinc-400 hover:text-white font-medium';
      } else {
        if (urlMode) urlMode.classList.add('hidden');
        if (upMode) upMode.classList.remove('hidden');
        if (btnUp) btnUp.className = 'px-2.5 py-1 rounded bg-brand-600 text-white font-bold';
        if (btnUrl) btnUrl.className = 'px-2.5 py-1 rounded text-zinc-400 hover:text-white font-medium';
      }
    }

    function updateCourseCoverPreview(val) {
      const preview = document.getElementById('course-cover-preview');

    async function toggleCoursePublishStatus(courseId) {
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return;

      const isCurrentPub = !course.status || course.status.toLowerCase() === 'published' || course.status.toLowerCase() === 'publicado';
      const newStatus = isCurrentPub ? 'draft' : 'published';
      course.status = newStatus;

      try {
        localStorage.setItem('kognus_custom_courses', JSON.stringify(state.courses));
      } catch(e) {}

      if (newStatus === 'draft') {
        showToast(`Curso "${course.title}" colocado em rascunho (oculto do catálogo)!`, 'warning');
      } else {

    function maskCnpj(input) {
      if (!input) return;
      let v = input.value.replace(/\D/g, '').slice(0, 14);
      v = v.replace(/^(\d{2})(\d)/, '$1.$2');
      v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
      v = v.replace(/(\d{4})(\d)/, '$1-$2');
      input.value = v;
    }

    function maskWhatsapp(input) {
      if (!input) return;
      let v = input.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 10) {
        v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
      } else if (v.length > 5) {
        v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
      } else if (v.length > 2) {
        v = v.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
      }
      input.value = v;
    }

    // 5. Radar de Espera em Tempo Real do Aluno (Checkout BYOG & Stripe Unificado)
    function handleStudentCheckoutSubmit(e, courseId) {
      if (e && e.preventDefault) e.preventDefault();
      const course = state.courses.find(c => c.id === courseId) || state.courses[0];
      const nameInput = document.getElementById('chk-name');
      const emailInput = document.getElementById('chk-email');
      const studentName = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : (currentUser ? currentUser.name : 'Aluno');
      const studentEmail = (emailInput && emailInput.value.trim()) ? emailInput.value.trim() : (currentUser ? currentUser.email : 'aluno@exemplo.com');

      // Persistência cadastral do aluno no Supabase
      if (db && studentEmail) {
        (async () => {
          try {
            const qUs = db.from('users');
            if (qUs && typeof qUs.upsert === 'function') {
              await qUs.upsert({
                id: 'aluno_' + Date.now(),
                name: studentName,
                email: studentEmail.toLowerCase().trim(),
                role: 'aluno',
                school_name: '',
                status: 'ativo',
                created_at: new Date().toISOString()
              }, { onConflict: 'email' });
            }
          } catch(err) {
            try {
              await db.from('users').upsert({
                name: studentName,
                email: studentEmail.toLowerCase().trim(),
                role: 'aluno',
                password_hash: 'kognus123',
                must_change_password: true
              }, { onConflict: 'email' });
            } catch(e2) {}
          }
        })();
      }

      // 1. Identificador composto do aluno e do curso
      const clientRef = `student_${encodeURIComponent(studentEmail)}__course_${course.id}`;

      // 2. Base URL do checkout (BYOG do curso ou Stripe da plataforma)
      const rawCheckoutUrl = (course && course.checkoutUrl) ? course.checkoutUrl : (localStorage.getItem('kognus_stripe_checkout_url') || state.stripeCheckoutUrl || 'https://buy.stripe.com/test_eVaeVd0QbgwE8kU6oo');
      const sep = rawCheckoutUrl.includes('?') ? '&' : '?';
      const targetUrl = `${rawCheckoutUrl}${sep}prefilled_email=${encodeURIComponent(studentEmail)}&client_reference_id=${encodeURIComponent(clientRef)}&course_id=${course.id}`;

      // 3. Salva no localStorage o estado pendente da matrícula
      try {
        localStorage.setItem('pending_student_checkout', JSON.stringify({
          email: studentEmail,
          courseId: course.id,
          startedAt: Date.now()
        }));
      } catch(err) {}

      // 4. Abre o link do Stripe em nova aba
      if (typeof window !== 'undefined' && window.open) {
        try {
          window.open(targetUrl, '_blank');
        } catch(err) {
          console.warn('Pop-up bloqueado:', err);
        }
      }

      // Abre imediatamente o Modal de Escuta em Tempo Real
      openStudentRadarModal(studentEmail, studentName, course.id);
    }

    function setupStudentRealtimeListener(studentEmail, courseId) {
      if (window.studentRealtimeChannel && db && typeof db.removeChannel === 'function') {
        try { db.removeChannel(window.studentRealtimeChannel); } catch(e) {}
        window.studentRealtimeChannel = null;
      }

      if (db && typeof db.channel === 'function') {
        try {
          const studentChannel = db.channel('student-enrollment-watch')
            .on('postgres_changes', {
              event: 'INSERT',
              schema: 'public',
              table: 'enrollments',
              filter: `student_email=eq.${studentEmail.toLowerCase().trim()}`
            }, (payload) => {
              console.log('[Supabase Realtime] Evento na tabela enrollments:', payload);
              if (payload.new && (!courseId || String(payload.new.course_id) === String(courseId))) {
                onStudentPaymentSuccess(payload.new);
              }
            })
            .subscribe();
          window.studentRealtimeChannel = studentChannel;
        } catch(err) {
          console.warn('[Supabase Realtime Student Warning]:', err);
        }
      }
    }

    function openStudentRadarModal(email, name, courseId) {
      setupStudentRealtimeListener(email, courseId);

    }

    function onStudentPaymentSuccess(data) {
      const studentEmail = (data && data.student_email) || currentRadarTargetEmail || 'aluno@kognus.com';
      const courseId = (data && data.course_id) || currentRadarCourseId || 1;

      if (window.studentRealtimeChannel && db && typeof db.removeChannel === 'function') {
        try { db.removeChannel(window.studentRealtimeChannel); } catch(e) {}
        window.studentRealtimeChannel = null;
      }
      if (window.studentRadarInterval) {
        clearInterval(window.studentRadarInterval);
        window.studentRadarInterval = null;
      }

      const cleanEmail = studentEmail.toLowerCase().trim();
      const cid = Number(courseId) || courseId;

      if (!state.enrollments.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === String(cid))) {
        state.enrollments.push({ studentEmail: cleanEmail, courseId: cid });
      }

      try {
        localStorage.setItem('kognus_enrollments', JSON.stringify(state.enrollments));
        localStorage.removeItem('pending_student_checkout');
      } catch(err) {}

      if (!currentUser) {
        currentUser = {
          id: 'aluno_' + Math.random().toString(36).substring(2, 7),
          name: 'Aluno',
          email: cleanEmail,
          role: 'aluno'
        };
        try { localStorage.setItem('kognus_session', JSON.stringify(currentUser)); } catch(e) {}
        renderHeader();
      }

      const v = document.getElementById('app-viewport');
      if (v && currentView === 'checkout') {
        const tempPass = 'TMP-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        v.innerHTML = renderPurchaseSuccessPage(tempPass);
      }

      setPaymentModalState('SUCCESS');
      showToast('🎉 Matrícula Confirmada com Sucesso!', 'success');
    }

    function confirmStudentEnrollment(email, name, courseId) {
      onStudentPaymentSuccess({ student_email: email, course_id: courseId });
    }

    function closeStudentRadarModal() {
      closeStripeRadarModal();
    }

    function startStudentEnrollmentPolling(email, courseId) {
      if (window.studentRadarInterval) clearInterval(window.studentRadarInterval);
      const cleanEmail = email.toLowerCase().trim();
      const cid = String(courseId || (state.courses[0] ? state.courses[0].id : 1));

      window.studentRadarInterval = setInterval(async () => {
        // 1. Checa estado local
        const hasLocal = state.enrollments.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === cid);
        if (hasLocal) {
          onStudentPaymentSuccess({ student_email: cleanEmail, course_id: cid });
          return;
        }

        // 2. Polling de redundância no Supabase a cada 2.5s
        if (db) {
          try {
            const { data, error } = await db.from('enrollments')
              .select('*')
              .eq('student_email', cleanEmail)
              .eq('course_id', cid)
              .maybeSingle();

            if (!error && data && (data.status === 'active' || !data.status)) {
              onStudentPaymentSuccess(data);
              return;
            }
          } catch(e) {
            console.warn('[Student Polling Supabase Warning]:', e);
          }
        }

        // 3. Checa localStorage kognus_enrollments
        try {
          const stored = JSON.parse(localStorage.getItem('kognus_enrollments') || '[]');
          if (stored.some(e => e.studentEmail.toLowerCase().trim() === cleanEmail && String(e.courseId) === cid)) {
            onStudentPaymentSuccess({ student_email: cleanEmail, course_id: cid });
          }
        } catch(e) {}
      }, 2500);
    }

    // Inicialização ao carregar a página
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
