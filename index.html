<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>KOGNUS - Plataforma Educacional & SaaS</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
            darkBg: '#09090b',
            darkCard: '#121217',
            darkBorder: '#27272a'
          }
        }
      }
    }
  </script>
</head>

<body
  class="bg-darkBg text-zinc-100 font-sans antialiased selection:bg-brand-600 selection:text-white min-h-screen flex flex-col justify-between">

  <!-- ==================== HEADER UNIFICADO (ZERO BUG VISUAL) ==================== -->
  <header
    class="border-b border-darkBorder bg-darkBg/95 backdrop-blur sticky top-0 z-50 px-4 lg:px-8 h-16 flex items-center justify-between">
    <!-- Esquerda: Marca -->
    <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('landing')">
      <img src="logo.png" alt="KOGNUS" class="h-8 w-auto object-contain"
        onerror="this.src='https://placehold.co/32x32/6366f1/ffffff?text=K'">
      <span class="font-black tracking-tight text-xl text-white">KOGNUS</span>
    </div>

    <!-- Centro: Links dinâmicos -->
    <nav id="nav-links" class="hidden md:flex items-center gap-6 text-sm font-medium text-zinc-300">
      <!-- Injetado via JS -->
    </nav>

    <!-- Direita: Área do usuário ou botões de visitante -->
    <div id="nav-user-area" class="flex items-center space-x-3">
      <!-- Injetado via JS -->
    </div>
  </header>

  <!-- ==================== VIEWPORT PRINCIPAL ==================== -->
  <main id="app-viewport" class="flex-1 w-full max-w-7xl mx-auto px-4 py-8">
    <!-- Telas renderizadas dinamicamente -->
  </main>

  <!-- ==================== NOTIFICAÇÕES TOAST ==================== -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

  <script>
    // 1. SUPABASE CLIENT
    const SUPABASE_URL = 'https://nbpxotppnjlxqjgzcblw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5icHhvdHBwbmpseHFqZ3pjYmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMTAwNjYsImV4cCI6MjEwNTg4NjA2Nn0.QsaRhyuqXA8gXT890V7W8o2pL4unrFVatxlOnLwGnXA';
    let db = null;
    try {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      console.warn("Supabase local mode.");
    }

    // 2. ESTADO GLOBAL
    let currentUser = null;
    let currentView = 'landing';
    let selectedLesson = null;
    let completedLessons = [1];

    let state = {
      courses: [
        {
          id: 1,
          title: "Colorimetria Avançada e Tonalização",
          instructor: "Prof. Renato Mestre",
          school: "Escola do Renato Mestre",
          price: "297,00",
          category: "Beleza",
          image: "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=600&q=80",
          modules: [
            {
              id: 1,
              title: "Módulo 1: Fundamentos da Cor",
              lessons: [
                { id: 1, title: "01. Estrela de Oswald e Neutralização", duration: "15 min", youtubeId: "dQw4w9WgXcQ", pdf: "Apostila_Colorimetria_Mod1.pdf" },
                { id: 2, title: "02. Fundo de Clareamento sem Segredos", duration: "20 min", youtubeId: "dQw4w9WgXcQ", pdf: "Tabela_Clareamento.pdf" }
              ]
            },
            {
              id: 2,
              title: "Módulo 2: Aplicação Prática",
              lessons: [
                { id: 3, title: "03. Matização e Banho de Brilho", duration: "18 min", youtubeId: "dQw4w9WgXcQ", pdf: "Guia_Matizacao.pdf" }
              ]
            }
          ]
        },
        {
          id: 2,
          title: "Gestão Financeira para Salões",
          instructor: "Prof. Renato Mestre",
          school: "Escola do Renato Mestre",
          price: "197,00",
          category: "Negócios",
          image: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=600&q=80",
          modules: []
        }
      ],
      enrollments: [
        { studentEmail: 'aluno@kognus.com', courseId: 1 }
      ]
    };

    // 3. INICIALIZAÇÃO - GARANTE VISITANTE POR PADRÃO
    function initApp() {
      // Se não houver sessão válida salva com JSON legítimo, limpa totalmente
      try {
        const raw = localStorage.getItem('kognus_session');
        if (raw) {
          currentUser = JSON.parse(raw);
        } else {
          currentUser = null;
        }
      } catch (e) {
        currentUser = null;
        localStorage.clear();
      }

      renderHeader();
      navigateTo('landing');
    }

    // 4. ATUALIZAÇÃO REATIVA DO HEADER (SEM MOCK OU RESÍDUOS)
    function renderHeader() {
      const links = document.getElementById('nav-links');
      const userArea = document.getElementById('nav-user-area');

      if (!currentUser) {
        // MODO VISITANTE LIMPO
        links.innerHTML = `
          <button onclick="navigateTo('landing')" class="hover:text-white transition">Início</button>
          <a href="#catalogo" onclick="navigateTo('landing')" class="hover:text-white transition">Cursos / Catálogo</a>
          <button onclick="navigateTo('register-instructor')" class="hover:text-white transition">Para Instrutores</button>
        `;

        userArea.innerHTML = `
          <button onclick="navigateTo('login')" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold px-4 py-2 rounded-lg border border-darkBorder transition">
            Entrar
          </button>
          <button onclick="navigateTo('register-instructor')" class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow-lg shadow-brand-600/30">
            Criar Minha Escola
          </button>
        `;
      } else {
        // MODO LOGADO
        let badgeColor = currentUser.role === 'admin' ? 'bg-red-500/20 text-red-400 border-red-500/30' : (currentUser.role === 'instrutor' ? 'bg-brand-500/20 text-brand-400 border-brand-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30');
        let roleName = currentUser.role === 'admin' ? 'SuperAdmin' : (currentUser.role === 'instrutor' ? 'Instrutor' : 'Aluno');

        links.innerHTML = `
          <button onclick="navigateTo('landing')" class="hover:text-white transition">Catálogo</button>
          ${currentUser.role === 'instrutor' ? `<button onclick="navigateTo('creator')" class="text-brand-400 font-bold hover:text-brand-300 transition">Creator Studio</button>` : ''}
          ${currentUser.role === 'admin' ? `<button onclick="navigateTo('superadmin')" class="text-red-400 font-bold hover:text-red-300 transition">Painel SaaS</button>` : ''}
        `;

        userArea.innerHTML = `
          <div class="flex items-center space-x-3 bg-zinc-900/90 border border-darkBorder px-3 py-1.5 rounded-xl">
            <div class="w-7 h-7 rounded-full bg-brand-600 flex items-center justify-center font-bold text-xs text-white">
              ${(currentUser.name || 'U').charAt(0).toUpperCase()}
            </div>
            <div class="text-left hidden sm:block">
              <p class="text-xs font-bold text-white leading-none">${currentUser.name}</p>
              <span class="text-[9px] px-1.5 py-0.2 rounded border ${badgeColor} inline-block mt-0.5">${roleName}</span>
            </div>
            <button onclick="logout()" title="Sair da Conta" class="text-zinc-400 hover:text-red-400 ml-2 transition">
              <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      }
      lucide.createIcons();
    }

    // 5. LOGOUT DEFINITIVO (LIMPA TUDO E FORÇA VISITANTE)
    function logout() {
      localStorage.clear();
      sessionStorage.clear();
      currentUser = null;
      renderHeader();
      navigateTo('landing');
      showToast('Sessão encerrada com sucesso.', 'info');
    }

    // 6. ROTEADOR DE TELAS
    function navigateTo(view, params = {}) {
      currentView = view;
      const v = document.getElementById('app-viewport');
      window.scrollTo(0, 0);

      if (currentUser && currentUser.must_change_password && view !== 'first-login') {
        navigateTo('first-login');
        return;
      }

      switch (view) {
        case 'landing':
          v.innerHTML = renderLanding();
          break;
        case 'login':
          v.innerHTML = renderLogin();
          break;
        case 'register-instructor':
          v.innerHTML = renderRegisterInstructor();
          break;
        case 'first-login':
          v.innerHTML = renderFirstLogin();
          break;
        case 'checkout':
          v.innerHTML = renderCheckout(params.courseId || 1);
          break;
        case 'purchase-success':
          v.innerHTML = renderPurchaseSuccess(params.tempPass || 'TMP-849201');
          break;
        case 'player':
          v.innerHTML = renderPlayer(params.courseId || 1);
          break;
        case 'certificate':
          v.innerHTML = renderCertificate(params.courseId || 1);
          break;
        case 'creator':
          v.innerHTML = renderCreator();
          break;
        case 'superadmin':
          v.innerHTML = renderSuperAdmin();
          break;
        case 'admin-expired':
          v.innerHTML = renderAdminExpired();
          break;
        default:
          v.innerHTML = renderLanding();
      }
      lucide.createIcons();
    }

    // 7. TOAST NOTIFICATIONS
    function showToast(msg, type = 'info') {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-600 border-red-500' : (type === 'success' ? 'bg-emerald-600 border-emerald-500' : 'bg-brand-600 border-brand-500');
      t.className = `${bg} text-white px-4 py-2.5 rounded-xl border text-xs font-semibold shadow-2xl transition-all duration-300`;
      t.innerHTML = msg;
      c.appendChild(t);
      setTimeout(() => { t.remove(); }, 3500);
    }

    // =========================================================================
    // RENDERS DE TODAS AS TELAS
    // =========================================================================

    function isEnrolled(courseId) {
      if (!currentUser) return false;
      return state.enrollments.some(e => e.studentEmail === currentUser.email && e.courseId === courseId);
    }

    // TELA 1: LANDING & VITRINE
    function renderLanding() {
      return `
        <div class="space-y-12">

              SAAS DE ENSINO & MARKETPLACE INTEGRADO
            </div>
            <h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-tight">
              Aprenda com mestres.<br>
              <span class="bg-gradient-to-r from-brand-400 to-violet-500 bg-clip-text text-transparent">Monetize com escala.</span>
            </h1>
            <p class="text-zinc-400 text-sm sm:text-base">SaaS Puro: 0% de comissões sobre suas vendas. Mensalidade fixa de apenas R$ 89,90/mês para manter sua escola ativa com cursos ilimitados.</p>
            <div class="flex justify-center gap-4 pt-2">
              <a href="#catalogo" class="bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs px-6 py-3 rounded-xl transition shadow-lg shadow-brand-600/30">
                Conhecer Cursos
              </a>
              <button onclick="navigateTo('register-instructor')" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-xs px-6 py-3 rounded-xl border border-darkBorder transition">
                Criar Minha Escola
              </button>
            </div>
          </div>

          <div id="catalogo" class="pt-8">
            <h2 class="text-xl font-bold text-white mb-6">Catálogo de Cursos Oficiais</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              ${state.courses.map(course => {
        const enrolled = isEnrolled(course.id);
        return `
                  <div class="bg-darkCard border ${enrolled ? 'border-emerald-500/40' : 'border-darkBorder'} rounded-2xl overflow-hidden flex flex-col justify-between shadow-xl">
                    <div class="relative">
                      <img src="${course.image}" class="h-48 w-full object-cover ${!enrolled ? 'brightness-75' : ''}">
                      <span class="absolute top-3 left-3 text-[10px] font-bold px-2 py-0.5 rounded bg-brand-600 text-white uppercase">${course.category}</span>${enrolled
            ? `<span class="absolute top-3 right-3 text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-500 text-white">✓ Matriculado</span>`
            : `<div class="absolute inset-0 flex items-center justify-center"><div class="bg-black/70 p-3 rounded-full border border-zinc-700 text-white"><i data-lucide="lock" class="w-6 h-6"></i></div></div>`
          }
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                      <div>
                        <h3 class="font-bold text-base text-white">${course.title}</h3>
                        <p class="text-xs text-zinc-400 mt-1">Instrutor: ${course.instructor}</p>
                      </div>
                      <div class="mt-6 pt-4 border-t border-darkBorder flex items-center justify-between">
                        ${enrolled
            ? `<span class="text-xs font-semibold text-emerald-400">Liberado para você</span>
                             <button onclick="navigateTo('player', { courseId: ${course.id} })" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-lg font-bold flex items-center gap-1.5 transition">
                               <i data-lucide="play-circle" class="w-3.5 h-3.5"></i> Assistir
                             </button>`
            : `<div><span class="text-[10px] text-zinc-500 block">Preço</span><span class="font-extrabold text-lg text-white">R$ ${course.price}</span></div>
                             <button onclick="navigateTo('checkout', { courseId: ${course.id} })" class="bg-brand-600 hover:bg-brand-500 text-white text-xs px-4 py-2 rounded-lg font-bold flex items-center gap-1.5 transition shadow-lg shadow-brand-600/20">
                               <i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i> Matricular-se
                             </button>`
          }
                      </div>
                    </div>
                  </div>
                `;
      }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // TELA 2: CHECKOUT
    function renderCheckout(courseId) {
      const course = state.courses.find(c => c.id === courseId) || state.courses[0];
      return `
        <div class="max-w-xl mx-auto bg-darkCard border border-darkBorder p-8 rounded-2xl shadow-2xl">
          <button onclick="navigateTo('landing')" class="text-xs text-zinc-400 hover:text-white flex items-center gap-1 mb-4">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Voltar ao Catálogo

          <div class="flex items-center justify-between mb-6 pb-4 border-b border-darkBorder">

              <span class="text-[10px] text-brand-400 font-bold uppercase tracking-wider">Gateway do Instrutor</span>

                <div class="border border-brand-500 bg-brand-500/10 text-white p-3 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold">
                  <i data-lucide="qr-code" class="w-4 h-4 text-brand-400"></i> PIX Instantâneo
                </div>
                <div class="border border-darkBorder text-zinc-400 p-3 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold opacity-60">

                </div>
              </div>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-lg font-bold text-sm shadow-lg shadow-emerald-600/20 transition mt-4">
              Simular Webhook: Pagamento Confirmado
            </button>
          </form>
        </div>
      `;
    }

            <i data-lucide="check" class="w-7 h-7"></i>
          </div>

    // TELA 4: PRIMEIRO ACESSO (TROCA OBRIGATÓRIA)
    function renderFirstLogin() {
      return `
        <div class="max-w-md mx-auto bg-darkCard border border-darkBorder p-8 rounded-2xl shadow-2xl">

            </div>

    }

    // TELA 5: LOGIN UNIFICADO
    function renderLogin() {
      return `
        <div class="max-w-md mx-auto bg-darkCard border border-darkBorder p-8 rounded-2xl shadow-2xl">
          <div class="text-center mb-6">

          <form onsubmit="handleLoginSubmit(event)" class="space-y-4">

            </div>
            <div>
              <label class="block text-xs font-semibold text-zinc-300 mb-1">Senha</label>
              <input type="password" id="log-pass" required placeholder="••••••••" class="w-full bg-zinc-900 border border-darkBorder rounded-lg px-4 py-2.5 text-sm text-white">

              <p class="font-bold text-zinc-300">Contas padrão para testes imediatos:</p>
              <div class="flex justify-between items-center cursor-pointer hover:text-white" onclick="setLog('aluno@kognus.com', '123456')">
                <span>Aluno: <code>aluno@kognus.com</code></span> <span class="text-brand-400 font-semibold">Usar</span>
              </div>
              <div class="flex justify-between items-center cursor-pointer hover:text-white" onclick="setLog('instrutor@kognus.com', '123456')">

                <span>SuperAdmin: <code>admin@kognus.com</code></span> <span class="text-brand-400 font-semibold">Usar</span>
              </div>
            </div>
          </form>
        </div>
      `;
    }

    // TELA 6: EXPIRAÇÃO DE SENHA SUPERADMIN (30 DIAS)
    function renderAdminExpired() {
      return `
        <div class="max-w-md mx-auto bg-darkCard border border-red-500/40 p-8 rounded-2xl shadow-2xl text-center space-y-4">
          <div class="w-12 h-12 bg-red-500/10 border border-red-500/30 rounded-full flex items-center justify-center mx-auto text-red-500">
            <i data-lucide="shield-alert" class="w-6 h-6"></i>

    // =========================================================================
    // HANDLERS

    function setLog(e, p) {
      document.getElementById('log-email').value = e;
      document.getElementById('log-pass').value = p;
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const em = document.getElementById('log-email').value.trim();
      const pw = document.getElementById('log-pass').value.trim();

      if (db) {
        try {
          const { data } = await db.from('users').select('*').eq('email', em).eq('password_hash', pw).single();
          if (data) {
            applyLogin(data);
            return;
          }
        } catch (err) { }
      }

      if (em === 'admin@kognus.com' && pw === 'admin123') {
        applyLogin({ name: 'Admin Kognus', email: em, role: 'admin' });
      } else if (em === 'instrutor@kognus.com' && pw === '123456') {
        applyLogin({ name: 'Prof. Renato Mestre', email: em, role: 'instrutor' });
      } else if (em === 'aluno@kognus.com' && pw === '123456') {
        applyLogin({ name: 'Lucas Mendes', email: em, role: 'aluno', must_change_password: false });
      } else if (pw.startsWith('TMP-')) {
        applyLogin({ name: 'Aluno Recente', email: em, role: 'aluno', must_change_password: true });
      } else {
        showToast('Credenciais incorretas! Tente as contas de teste.', 'error');
      }
    }

    function applyLogin(u) {
      currentUser = u;
      localStorage.setItem('kognus_session', JSON.stringify(u));
      renderHeader();
      showToast(`Bem-vindo, ${u.name}!`, 'success');
      if (u.must_change_password) navigateTo('first-login');
      else if (u.role === 'admin') navigateTo('superadmin');
      else if (u.role === 'instrutor') navigateTo('creator');
      else navigateTo('landing');
    }

    function handleCheckout(e, courseId) {
      e.preventDefault();
      const em = document.getElementById('chk-email').value;
      const tmp = 'TMP-' + Math.floor(100000 + Math.random() * 900000);
      state.enrollments.push({ studentEmail: em, courseId });
      navigateTo('purchase-success', { tempPass: tmp });
    }

    function handlePassChange(e) {
      e.preventDefault();
      if (document.getElementById('np-1').value !== document.getElementById('np-2').value) {
        showToast('As senhas não coincidem!', 'error');
        return;
      }
      if (currentUser) currentUser.must_change_password = false;
      showToast('Senha alterada! Acesso liberado.', 'success');
      navigateTo('player', { courseId: 1 });
    }

    function handleInstructorReg(e) {
      e.preventDefault();
      const name = document.getElementById('ins-name').value;
      const email = document.getElementById('ins-email').value;
      applyLogin({ name, email, role: 'instrutor' });
    }

    function handleAdminPass(e) {
      e.preventDefault();
      showToast('Senha do SuperAdmin renovada por mais 30 dias!', 'success');
      navigateTo('superadmin');
    }

    function pickLesson(courseId, lessonId) {
      const course = state.courses.find(c => c.id === courseId);
      if (course) {
        for (let m of course.modules) {
          let l = m.lessons.find(item => item.id === lessonId);
          if (l) {
            selectedLesson = l;
            navigateTo('player', { courseId });
            return;
          }
        }
      }
    }

    function toggleDone(lessonId) {
      if (!completedLessons.includes(lessonId)) completedLessons.push(lessonId);
      showToast('Aula concluída!', 'success');
      navigateTo('player', { courseId: 1 });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
